U('s62','1','분수의 나눗셈',[
{id:'m1',title:'분모가 같은 (분수) ÷ (분수)',book:'111단계',key:'분모가 같으면 <b>분자끼리 나눠요</b>',
ex:()=>`<p>${fr(6,7)} ÷ ${fr(2,7)}은 ${fr(6,7)} 안에 ${fr(2,7)}이 몇 번 들어가는지 → ${fr(1,7)}이 6개, 2개 → 6 ÷ 2 = <b>3</b></p><div class="eg">${fr(3,8)} ÷ ${fr(5,8)} = 3 ÷ 5 = <b>${fr(3,5)}</b></div>`,
gen(lv){let d,a,b;if(lv===1){do{d=R(5,15);b=R(1,4);a=b*R(2,4)}while(a>=d||gcd(a,d)!==1||gcd(b,d)!==1)}else{do{d=R(5,15);a=R(1,d-1);b=R(1,d-1)}while(a===b||a%b===0||gcd(a,d)!==1||gcd(b,d)!==1)}
  return prob(`다음을 계산하세요.<div class="big">${fr(a,d)} ÷ ${fr(b,d)}</div>`,F(a,b),`분모가 같으니 분자끼리 나눠요: ${a} ÷ ${b} = ${fr(a,b)}${tail(a,b)}`)}},
{id:'m2',title:'분모가 다른 (분수) ÷ (분수)',book:'111~112단계',key:'나누는 분수의 <b>분모와 분자를 바꾸어</b> 곱해요',
ex:()=>`<div class="eg"><div class="egt">통분해서</div>${fr(3,4)} ÷ ${fr(2,5)} = ${fr(15,20)} ÷ ${fr(8,20)} = 15 ÷ 8 = ${fr(15,8)}</div><div class="eg"><div class="egt">곱셈으로 바꾸어 (더 빨라요)</div>${fr(3,4)} ÷ ${fr(2,5)} = ${fr(3,4)} × ${fr(5,2)} = ${fr(15,8)} = <b>1${fr(7,8)}</b></div>
<div class="warn">앞의 분수를 뒤집으면 안 돼요! <b>나누는 수(뒤)</b>만 뒤집어요.</div>`,
gen(lv){let a,b,c,d;do{[a,b]=coprimeFrac(2,lv===1?8:12);[c,d]=coprimeFrac(2,lv===1?8:12)}while(b===d||(a*d===b*c));
  return prob(`다음을 계산하세요.<div class="big">${fr(a,b)} ÷ ${fr(c,d)}</div>`,F(a*d,b*c),`${fr(a,b)} ÷ ${fr(c,d)} = ${fr(a,b)} × ${fr(d,c)} = ${fr(a*d,b*c)}${tail(a*d,b*c)}`)}},
{id:'m3',title:'(자연수) ÷ (분수)',book:'112단계',key:'■ ÷ <span class="fr"><span class="nu">b</span><span class="de">c</span></span> = ■ × <span class="fr"><span class="nu">c</span><span class="de">b</span></span>',
ex:()=>`<div class="eg">6 ÷ ${fr(2,3)} = 6 × ${fr(3,2)} = ${fr(18,2)} = <b>9</b></div><div class="eg"><div class="egt">의미</div>${fr(2,3)}이 6이면 1은? → 6 ÷ 2 × 3 = 9</div><div class="warn">진분수로 나누면 몫이 나누어지는 수보다 <b>커져요</b>.</div>`,
gen(lv){const [b,c]=coprimeFrac(2,lv===1?6:12);let k=lv===1?b*R(1,6):R(2,15);
  return prob(`다음을 계산하세요.<div class="big">${k} ÷ ${fr(b,c)}</div>`,F(k*c,b),`${k} ÷ ${fr(b,c)} = ${k} × ${fr(c,b)} = ${fr(k*c,b)}${tail(k*c,b)}`)}},
{id:'m4',title:'대분수·가분수의 나눗셈',book:'113단계',key:'대분수 → 가분수로 바꾸고 → 나누는 수를 뒤집어 곱해요',
ex:()=>`<div class="eg">2${fr(1,4)} ÷ ${fr(3,5)} = ${fr(9,4)} × ${fr(5,3)} = ${fr(45,12)} = <b>3${fr(3,4)}</b></div><div class="eg">1${fr(1,2)} ÷ 1${fr(1,4)} = ${fr(3,2)} ÷ ${fr(5,4)} = ${fr(3,2)} × ${fr(4,5)} = ${fr(12,10)} = <b>1${fr(1,5)}</b></div>`,
gen(lv){const [a,b]=coprimeFrac(2,7),w=R(1,3),im=w*b+a;let c,d,h,cv;if(lv===1){[c,d]=coprimeFrac(2,9);h=fr(c,d);cv=''}else if(lv===2){do{d=R(2,7);c=R(d+1,3*d)}while(gcd(c,d)!==1);h=fr(c,d);cv=''}else{const [x,y]=coprimeFrac(2,6),w2=R(1,2);c=w2*y+x;d=y;h=`${w2}${fr(x,y)}`;cv=`, ${w2}${fr(x,y)} = ${fr(c,d)}`}
  return prob(`다음을 계산하세요.<div class="big">${w}${fr(a,b)} ÷ ${h}</div>`,F(im*d,b*c),ol([`가분수로: ${w}${fr(a,b)} = ${fr(im,b)}${cv}`,`${fr(im,b)} × ${fr(d,c)} = ${fr(im*d,b*c)}${tail(im*d,b*c)}`]))}}
]);
U('s62','2','소수의 나눗셈',[
{id:'n1',title:'자릿수가 같은 (소수) ÷ (소수)',book:'114단계',key:'두 수의 소수점을 <b>똑같이</b> 오른쪽으로 옮겨 자연수의 나눗셈으로',
ex:()=>`<div class="eg">1.2 ÷ 0.4 → 12 ÷ 4 = <b>3</b> (둘 다 10배)</div><div class="eg">6.25 ÷ 0.25 → 625 ÷ 25 = <b>25</b> (둘 다 100배)</div><div class="eg"><div class="egt">분수로</div>${fr(12,10)} ÷ ${fr(4,10)} = 12 ÷ 4 = 3</div>
<div class="warn">한쪽만 옮기면 몫이 달라져요. 소수점은 <b>함께</b> 옮겨요.</div>`,
gen(lv){const s=lv===1?1:2;const q=R(2,lv===3?40:9);let v;do{v=R(s===1?2:11,s===1?9:99)}while(v%10===0);const dv=v*q;
  return prob(`다음을 계산하세요.<div class="big">${D(dv/P10(s))} ÷ ${D(v/P10(s))}</div>`,num(q),`두 수를 ${P10(s)}배 → ${dv} ÷ ${v} = <b>${q}</b>`)}},
{id:'n2',title:'자릿수가 다른 (소수) ÷ (소수)',book:'115단계',key:'<b>나누는 수</b>가 자연수가 되도록 소수점을 옮기고, 나누어지는 수도 같은 칸만큼 옮겨요',
ex:()=>`<div class="eg">4.32 ÷ 1.2 → 43.2 ÷ 12 = <b>3.6</b><br>(나누는 수 1.2를 12로 만들려고 둘 다 10배)</div><div class="eg"><div class="egt">100배로 해도 돼요</div>432 ÷ 120 = 3.6</div>
<div class="warn">몫의 소수점은 <b>옮긴</b> 소수점 위치에 맞춰 찍어요.</div>`,
gen(lv){let v,q;do{v=R(lv===1?2:12,lv===1?9:45);q=R(11,99)}while(v%10===0||q%10===0);const dv=v*q;const vs=lv===1?D(v/10):D(v/10);
  return prob(`다음을 계산하세요.<div class="big">${D(dv/100)} ÷ ${vs}</div>`,num(q/10),ol([`나누는 수 ${vs}를 자연수로 만들기 위해 둘 다 10배: ${D(dv/10)} ÷ ${v}`,`${D(dv/10)} ÷ ${v} = <b>${D(q/10)}</b>`]))}},
{id:'n3',title:'(자연수) ÷ (소수)',book:'116단계',key:'나누는 수를 자연수로 만들고, 자연수 뒤에 <b>0을 붙여</b> 똑같이 옮겨요',
ex:()=>`<div class="eg">12 ÷ 0.4 → 120 ÷ 4 = <b>30</b></div><div class="eg">9 ÷ 0.36 → 900 ÷ 36 = <b>25</b></div><div class="warn">12 ÷ 0.4를 12 ÷ 4로 계산하면 안 돼요. 12도 10배 해서 120!</div>`,
gen(lv){const s=lv===1?1:2;for(let t=0;t<500;t++){let v=R(s===1?2:11,s===1?9:99);if(v%10===0)continue;const q=R(2,lv===1?50:80);if((q*v)%P10(s)!==0)continue;const k=q*v/P10(s);if(k<2||k>200)continue;
   return prob(`다음을 계산하세요.<div class="big">${k} ÷ ${D(v/P10(s))}</div>`,num(q),`두 수를 ${P10(s)}배: ${k*P10(s)} ÷ ${v} = <b>${q}</b>`)}return this.gen(lv)}},
{id:'n4',title:'몫을 반올림하기 · 나머지 구하기',key:'몫을 소수 ■째 자리까지 → 한 자리 더 구해서 반올림 · 남는 양의 소수점은 <b>원래</b> 위치',
ex:()=>`<div class="eg"><div class="egt">반올림</div>5 ÷ 3 = 1.66… → 소수 둘째 자리 6을 보고 반올림 → <b>1.7</b></div><div class="eg"><div class="egt">나머지</div>끈 13.5 m를 2 m씩 자르면 → 6도막, 남는 끈 <b>1.5 m</b> (13.5 − 2 × 6)</div>
<div class="warn">나머지에 소수점을 잘못 찍기 쉬워요. 확인: 나누는 수 × 몫 + 나머지 = 나누어지는 수</div>`,
gen(lv){if(rnd()<.5){let a,b;do{a=R(2,lv===1?20:60);b=pick([3,6,7,9,11,12])}while(a%b===0);const pl=lv===3?2:1;const res=Math.round(a*P10(pl)/b)/P10(pl);
    return prob(`<b>${a} ÷ ${b}</b>의 몫을 반올림하여 <b>소수 ${pl===1?'첫째':'둘째'} 자리까지</b> 나타내세요.`,num(res),`${a} ÷ ${b} = ${(a/b).toFixed(pl+2).replace(/0+$/,'')}… → 소수 ${pl===1?'둘째':'셋째'} 자리 숫자를 보고 반올림 → <b>${D(res)}</b>`)}
  const x=R(2,lv===1?3:5),cnt=R(3,9),rem=R(1,x*10-1);if(rem%10===0)return this.gen(lv);const L=x*10*cnt+rem;
  return prob(`리본 ${D(L/10)} m를 ${x} m씩 잘라 나누어 주려고 해요. 몇 명에게 줄 수 있고 남는 리본은 몇 m인가요? <b>남는 리본의 길이</b>를 쓰세요.`,num(rem/10,'m'),ol([`${D(L/10)} ÷ ${x} → 몫 ${cnt}(명)`,`남는 리본 = ${D(L/10)} − ${x} × ${cnt} = <b>${D(rem/10)} m</b>`,`확인: ${x} × ${cnt} + ${D(rem/10)} = ${D(L/10)}`]))}}
]);
function genGrid(lv){const rows=lv===1?2:3,cols=lv===1?R(2,3):lv===2?3:R(3,4),mx=lv===1?3:lv===2?3:4;let h;do{h=[];for(let i=0;i<rows;i++){h.push([]);for(let j=0;j<cols;j++)h[i].push(lv===1?R(1,mx):R(0,mx))}}while(h.some(r=>r.every(x=>x===0))||[...Array(cols).keys()].some(j=>h.every(r=>r[j]===0)));return h}
U('s62','3','공간과 입체',[
{id:'o1',title:'쌓기나무의 개수 구하기',key:'위에서 본 모양의 각 칸에 쓴 수를 <b>모두 더해요</b>',
ex:()=>`<p>쌓기나무로 쌓은 모양을 위에서 보고, 각 칸에 그 자리에 쌓인 개수를 써서 나타낼 수 있어요.</p><div class="fig">${svgGrid([[2,1],[3,1]])}</div><div class="eg">2 + 1 + 3 + 1 = <b>7개</b></div>
<div class="warn">앞·옆에서 본 모양만으로는 숨어 있는 쌓기나무를 알 수 없어요. 위에서 본 모양에 수를 쓰면 정확해요.</div>`,
gen(lv){const h=genGrid(lv);const s=h.flat().reduce((a,b)=>a+b,0);return prob(`위에서 본 모양에 쌓은 쌓기나무의 개수를 썼어요. 쌓기나무는 모두 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(s,'개'),`${h.flat().filter(x=>x).join(' + ')} = <b>${s}개</b>`)}},
{id:'o2',title:'층별로 나타내기',key:'■층에 있는 쌓기나무 수 = <b>■ 이상</b>인 수가 쓰인 칸의 수',
ex:()=>`<div class="fig">${svgGrid([[2,1],[3,1]])}</div><table class="t"><tr><th>1층</th><th>2층</th><th>3층</th></tr><tr><td>4개 (1 이상)</td><td>2개 (2 이상)</td><td>1개 (3 이상)</td></tr></table><p>층별 개수를 모두 더해도 전체 개수(7개)가 돼요.</p>`,
gen(lv){const h=genGrid(lv),f=h.flat(),mx=Math.max(...f);if(mx<2)return this.gen(lv);const k=R(2,mx);
  if(lv===3&&rnd()<.5){const s=f.reduce((a,x)=>a+Math.max(0,x-1),0);return prob(`<b>2층 이상</b>에 쌓인 쌓기나무는 모두 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(s,'개'),`각 칸에서 1층을 뺀 개수를 더해요: ${f.filter(x=>x>1).map(x=>x-1).join(' + ')} = <b>${s}개</b>`)}
  const c=f.filter(x=>x>=k).length;return prob(`<b>${k}층</b>에 있는 쌓기나무는 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(c,'개'),`${k} 이상이 쓰인 칸을 세요: ${f.filter(x=>x>=k).join(', ')} → <b>${c}개</b>`)}},
{id:'o3',title:'앞에서 본 모양',key:'앞에서 보면 각 줄(세로줄)에서 <b>가장 높은 수</b>만큼 보여요',
ex:()=>`<div class="fig">${svgGrid([[2,1,1],[1,3,2]],true)}</div><p>앞에서 보면 같은 세로줄에 있는 쌓기나무는 겹쳐 보여서, 그 줄에서 <b>가장 큰 수</b>만큼의 높이로 보여요.</p><div class="eg">1번째 줄: 2, 1 중 큰 수 → 2층 · 2번째 줄: 1, 3 → 3층 · 3번째 줄: 1, 2 → 2층</div>`,
gen(lv){const h=genGrid(Math.max(2,lv)),cols=h[0].length;const mxs=[...Array(cols).keys()].map(j=>Math.max(...h.map(r=>r[j])));
  if(lv===3&&rnd()<.5){const s=mxs.reduce((a,b)=>a+b,0);return prob(`앞에서 본 모양을 그리면 정사각형은 모두 몇 개 보이나요?<div class="fig">${svgGrid(h,true)}</div>`,num(s,'개'),`각 줄의 가장 큰 수: ${mxs.join(', ')} → ${mxs.join(' + ')} = <b>${s}개</b>`)}
  const j=R(0,cols-1);return prob(`앞에서 보았을 때, 왼쪽에서 <b>${j+1}번째 줄</b>은 몇 층으로 보이나요?<div class="fig">${svgGrid(h,true)}</div>`,num(mxs[j],'층'),`${j+1}번째 줄의 수: ${h.map(r=>r[j]).join(', ')} → 가장 큰 수 <b>${mxs[j]}층</b>`)}}
]);
U('s62','4','비례식과 비례배분',[
{id:'q1',title:'간단한 자연수의 비로 나타내기',book:'117단계',key:'비의 전항과 후항에 0이 아닌 같은 수를 곱하거나 나누어도 비율은 같아요',
ex:()=>`<div class="eg"><div class="egt">자연수</div>12 : 18 → 둘 다 6으로 나누면 → <b>2 : 3</b></div><div class="eg"><div class="egt">소수</div>0.6 : 0.8 → 둘 다 10배 → 6 : 8 → <b>3 : 4</b></div><div class="eg"><div class="egt">분수</div>${fr(1,2)} : ${fr(1,3)} → 분모의 최소공배수 6을 곱해요 → <b>3 : 2</b></div>
<div class="warn">한쪽에만 곱하면 안 돼요. 전항·후항 <b>둘 다</b> 같은 수를!</div>`,
gen(lv){let x,y;do{x=R(1,9);y=R(1,9)}while(x===y||gcd(x,y)!==1);
  if(lv===1){const g=R(2,9);return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${x*g} : ${y*g}</div>`,{t:'ratio',a:x,b:y},`두 수를 최대공약수 ${g}(으)로 나눠요 → <b>${x} : ${y}</b>`)}
  if(lv===2){let g;do{g=R(1,5)}while((x*g)%10===0||(y*g)%10===0);return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${D(x*g/10)} : ${D(y*g/10)}</div>`,{t:'ratio',a:x,b:y},ol([`둘 다 10배: ${x*g} : ${y*g}`,`${g>1?`${g}(으)로 나누면 `:''}<b>${x} : ${y}</b>`]))}
  let a,b,c,d;do{[a,b]=coprimeFrac(2,9);[c,d]=coprimeFrac(2,9)}while(b===d||a*d===b*c);const L=lcm(b,d);const [p,q]=red(a*L/b,c*L/d);
  return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${fr(a,b)} : ${fr(c,d)}</div>`,{t:'ratio',a:p,b:q},ol([`분모 ${b}, ${d}의 최소공배수 ${L}을 곱해요: ${a*L/b} : ${c*L/d}`,(p===a*L/b?`→ <b>${p} : ${q}</b>`:`최대공약수로 나눠 더 간단히 → <b>${p} : ${q}</b>`)]))}},
{id:'q2',title:'비례식',book:'118단계',key:'비례식에서 <b>외항의 곱 = 내항의 곱</b>',
ex:()=>`<p>비율이 같은 두 비를 등호로 나타낸 식을 <b>비례식</b>이라고 해요.</p><div class="eg">2 : 3 = 8 : 12 → 바깥쪽 2, 12는 <b>외항</b>, 안쪽 3, 8은 <b>내항</b><br>2 × 12 = 24, 3 × 8 = 24 (같아요!)</div>
<div class="eg"><div class="egt">□ 구하기</div>3 : 5 = □ : 20 → 3 × 20 = 5 × □ → 60 = 5 × □ → □ = <b>12</b></div>`,
gen(lv){let x,y;do{x=R(1,9);y=R(1,9)}while(x===y||gcd(x,y)!==1);const m=lv===1?1:R(1,4),n=lv===1?R(2,9):R(2,12);if(m===n)return this.gen(lv);
  const t=[x*m,y*m,x*n,y*n],k=R(0,3),ans=t[k];const s=t.map((v,i)=>i===k?'□':v);
  return prob(`□ 안에 알맞은 수를 구하세요.<div class="big">${s[0]} : ${s[1]} = ${s[2]} : ${s[3]}</div>`,num(ans),ol([`외항의 곱 = 내항의 곱: ${s[0]} × ${s[3]} = ${s[1]} × ${s[2]}`,k===0||k===3?`□ × ${k===0?t[3]:t[0]} = ${t[1]*t[2]} → □ = ${t[1]*t[2]} ÷ ${k===0?t[3]:t[0]} = <b>${ans}</b>`:`${t[0]*t[3]} = □ × ${k===1?t[2]:t[1]} → □ = ${t[0]*t[3]} ÷ ${k===1?t[2]:t[1]} = <b>${ans}</b>`]))}},
{id:'q3',title:'비례배분',book:'119단계',key:'전체를 ■ : ●로 나누면 → 전체 × <span class="fr"><span class="nu">■</span><span class="de">■+●</span></span>, 전체 × <span class="fr"><span class="nu">●</span><span class="de">■+●</span></span>',
ex:()=>`<p>전체를 주어진 비로 나누는 것을 <b>비례배분</b>이라고 해요.</p><div class="eg">사탕 20개를 2 : 3으로 나누면<br>형: 20 × ${fr(2,5)} = <b>8개</b>, 동생: 20 × ${fr(3,5)} = <b>12개</b></div><div class="warn">분모는 비의 <b>합</b>(2 + 3 = 5)이에요. 확인: 8 + 12 = 20</div>`,
gen(lv){const parts=lv===3?3:2;let r;do{r=[];for(let i=0;i<parts;i++)r.push(R(1,lv===1?5:9))}while(new Set(r).size<parts||r.reduce(gcd)!==1);const S=r.reduce((a,b)=>a+b,0),T=S*R(2,lv===1?8:15),i=R(0,parts-1);
  const who=parts===2?['형','동생']:['가','나','다'];const v=T*r[i]/S;
  return prob(`구슬 ${T}개를 ${parts===2?'형과 동생이':'가, 나, 다 세 사람이'} <b>${r.join(' : ')}</b>로 나누어 가지려고 해요. <b>${who[i]}</b>의 구슬은 몇 개인가요?`,num(v,'개'),`${who[i]}: ${T} × ${fr(r[i],r.join('+'))} = ${T} × ${fr(r[i],S)} = <b>${v}개</b>`)}},
{id:'q4',title:'비례식 활용',key:'모르는 양을 □로 두고 비례식을 세워요',
ex:()=>`<div class="eg">3분 동안 물이 12 L 나와요. 15분 동안은?<br>3 : 12 = 15 : □ → 3 × □ = 12 × 15 → □ = <b>60 L</b></div><div class="eg"><div class="egt">축척</div>지도에서 1 cm가 실제 5 km → 지도에서 7 cm는 1 : 5 = 7 : □ → <b>35 km</b></div>`,
gen(lv){const t=R(0,2);if(t===0){const a=R(2,6),b=a*R(2,6),k=R(2,lv===1?4:9);const c=a*k;return prob(`수도에서 ${a}분 동안 물이 ${b} L 나와요. 같은 빠르기로 <b>${c}분</b> 동안 나오는 물은 몇 L인가요?`,num(b*k,'L'),ol([`${a} : ${b} = ${c} : □`,`${a} × □ = ${b} × ${c} → □ = ${b*c} ÷ ${a} = <b>${b*k} L</b>`]))}
  if(t===1){let x,y;do{x=R(2,9);y=R(2,9)}while(x===y||gcd(x,y)!==1);const k=R(2,lv===1?5:12);return prob(`가로와 세로의 비가 <b>${x} : ${y}</b>인 직사각형이 있어요. 가로가 ${x*k} cm일 때 <b>세로</b>는 몇 cm인가요?`,num(y*k,'cm'),ol([`${x} : ${y} = ${x*k} : □`,`${x} × □ = ${y} × ${x*k} → □ = <b>${y*k} cm</b>`]))}
  const s=R(2,9),m=R(2,lv===1?9:25);return prob(`지도에서 1 cm는 실제 거리 ${s} km예요. 지도에서 ${m} cm인 두 마을 사이의 실제 거리는 몇 km인가요?`,num(s*m,'km'),`1 : ${s} = ${m} : □ → □ = ${s} × ${m} = <b>${s*m} km</b>`)}}
]);
function c314(x){return Math.round(x*314)/100}
U('s62','5','원의 넓이',[
{id:'r1',title:'원주와 원주율',key:'원주 = 지름 × 원주율(3.14) = 반지름 × 2 × 3.14',
ex:()=>`<div class="fig">${svgCircleFig('basic')}</div><p>원의 둘레를 <b>원주</b>라고 해요. 원의 크기와 상관없이 (원주) ÷ (지름)은 항상 약 3.14로 같아요. 이 값을 <b>원주율</b>이라고 해요.</p>
<div class="eg">지름 10 cm → 원주 10 × 3.14 = <b>31.4 cm</b><br>반지름 4 cm → 원주 4 × 2 × 3.14 = <b>25.12 cm</b></div><div class="warn">반지름이 주어지면 <b>× 2</b>를 먼저 해서 지름을 구해요.</div>`,
gen(lv){if(lv===1||rnd()<.5){const d=R(2,lv===1?20:40);return prob(`지름이 ${d} cm인 원의 <b>원주</b>는 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(d),'cm'),`${d} × 3.14 = <b>${D(c314(d))} cm</b>`)}
  const r=R(2,25);return prob(`반지름이 ${r} cm인 원의 <b>원주</b>는 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(2*r),'cm'),`${r} × 2 × 3.14 = <b>${D(c314(2*r))} cm</b>`)}},
{id:'r2',title:'원주로 지름·반지름 구하기',key:'지름 = 원주 ÷ 3.14',
ex:()=>`<div class="eg">원주 37.68 cm → 지름 = 37.68 ÷ 3.14 = <b>12 cm</b> → 반지름 <b>6 cm</b></div>`,
gen(lv){const d=lv===3?R(2,20)*2:R(2,30);const C=c314(d);if(lv<3)return prob(`원주가 ${D(C)} cm인 원의 <b>지름</b>은 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(d,'cm'),`${D(C)} ÷ 3.14 = <b>${d} cm</b>`);
  return prob(`원주가 ${D(C)} cm인 원의 <b>반지름</b>은 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(d/2,'cm'),ol([`지름 = ${D(C)} ÷ 3.14 = ${d} cm`,`반지름 = ${d} ÷ 2 = <b>${d/2} cm</b>`]))}},
{id:'r3',title:'원의 넓이',key:'원의 넓이 = 반지름 × 반지름 × 3.14',
ex:()=>`<p>원을 잘게 잘라 이어 붙이면 직사각형에 가까워져요. 가로 = 원주의 반(반지름 × 3.14), 세로 = 반지름</p><div class="eg">반지름 5 cm → 5 × 5 × 3.14 = <b>78.5 cm²</b></div><div class="warn">반지름 × 2 × 3.14는 원주예요! 넓이는 반지름을 <b>두 번</b> 곱해요.</div>`,
gen(lv){if(lv===1){const r=R(2,15);return prob(`반지름이 ${r} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`)}
  if(lv===2){const r=R(2,15);return prob(`지름이 ${2*r} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),ol([`반지름 = ${2*r} ÷ 2 = ${r} cm`,`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`]))}
  const r=R(2,12);return prob(`원주가 ${D(c314(2*r))} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),ol([`지름 = ${D(c314(2*r))} ÷ 3.14 = ${2*r} cm → 반지름 ${r} cm`,`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`]))}},
{id:'r4',title:'여러 가지 모양의 넓이',key:'큰 넓이에서 빼거나, 원의 일부(반, ¼)만 구해요',
ex:()=>`<div class="eg"><div class="egt">반원</div>반지름 4 cm → 4 × 4 × 3.14 ÷ 2 = <b>25.12 cm²</b></div><div class="eg"><div class="egt">고리 모양</div>큰 원 넓이 − 작은 원 넓이</div><div class="eg"><div class="egt">정사각형 안의 원</div>정사각형 넓이 − 원 넓이 (원의 지름 = 정사각형 한 변)</div>`,
gen(lv){if(lv===1){const r=R(2,12);return prob(`반지름이 ${r} cm인 <b>반원</b>의 넓이는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span><div class="fig">${svgCircleFig('half',r+' cm')}</div>`,num(c314(r*r)/2,'cm²'),`${r} × ${r} × 3.14 ÷ 2 = <b>${D(c314(r*r)/2)} cm²</b>`)}
  if(lv===2){const a=R(5,12),b=R(2,a-2);return prob(`색칠한 고리 모양의 넓이는 몇 cm²인가요? (큰 원 반지름 ${a} cm, 작은 원 반지름 ${b} cm) <span class="muted small">(${PI_TXT})</span><div class="fig">${svgCircleFig('ring',[a+' cm',b+' cm'])}</div>`,num(c314(a*a-b*b),'cm²'),ol([`큰 원: ${a} × ${a} × 3.14 = ${D(c314(a*a))}`,`작은 원: ${b} × ${b} × 3.14 = ${D(c314(b*b))}`,`${D(c314(a*a))} − ${D(c314(b*b))} = <b>${D(c314(a*a-b*b))} cm²</b>`]))}

function starN(st){if(!st||!st.t)return 0;const acc=st.c/st.t;return st.lv>=3&&acc>=.8?3:st.lv>=2&&acc>=.6?2:acc>=.5?1:0}
const CHL={};CHAPTERS.forEach(c=>{CHL[c.id]=c.u.flatMap(u=>UNITS.find(x=>x.id===u).lessons)});
function chStat(d,ch){let c=0,s=0;CHL[ch].forEach(l=>{const x=d.ls[l.id];if(x){c+=x.c||0;s+=starN(x)}});return {c,s,max:CHL[ch].length*3}}
const HATCH=5,STAGE_FR=[0,0,.3,.6,.85];
function petStage(d,pet){const t=chStat(d,pet.ch);if(t.c<HATCH)return 0;for(let i=4;i>=2;i--)if(t.s>=Math.ceil(t.max*STAGE_FR[i]))return i;return 1}
function petNext(d,pet){const t=chStat(d,pet.ch),g=petStage(d,pet);if(g===0)return {p:t.c/HATCH,txt:`이 챕터 문제를 ${HATCH-t.c}개 더 맞히면 알이 깨져요`};if(g===4)return {p:1,txt:'최고 단계! 전설의 친구가 되었어요'};
  const need=Math.ceil(t.max*STAGE_FR[g+1]),prev=g===1?0:Math.ceil(t.max*STAGE_FR[g]);return {p:Math.max(0,(t.s-prev)/Math.max(1,need-prev)),txt:`이 챕터에서 별을 ${need-t.s}개 더 모으면 '${PSTAGE[g+1]}' 단계로 자라요`}}
function chName(ch){return CHAPTERS.find(c=>c.id===ch).n}
function petTitle(d,pet){const g=petStage(d,pet);if(g===0)return '비밀 알';const base=ANIMALS[pet.sp].n;return pet.name?`${pet.name} <span class="muted small">(${PSTAGE[g]} ${base})</span>`:`${PSTAGE[g]} ${base}`}
function totalCorrect(d){let c=0;Object.entries(d.ls).forEach(([id,x])=>{if(LESSONS[id])c+=x.c||0});return c}
function gameInit(d){if(!d.pets)d.pets=[];if(!d.snacks)d.snacks={};if(!d.room)d.room={};if(!d.lim)d.lim={};if(d.snackGiven==null)d.snackGiven=Math.floor(totalCorrect(d)/5);return d}


/* ===================== 채점 ===================== */
function parseNum(s){s=String(s||'').replace(/[,\s]/g,'').replace(/[^\d.\-]/g,'');if(s===''||s==='.'||s==='-')return NaN;return Number(s)}
function ansHTML(a){if(a.t==='num')return N(a.v)+(a.unit?' '+a.unit:'');if(a.t==='frac')return mix(a.n,a.d);if(a.t==='ratio')return `${a.a} : ${a.b}`;return a.opts[a.a]}
function check(a,inp){
  if(a.t==='num'){const x=parseNum(inp);if(isNaN(x))return {empty:true};return {ok:Math.abs(x-a.v)<1e-6}}
  if(a.t==='mc'){if(inp==null)return {empty:true};return {ok:inp===a.a}}
  if(a.t==='ratio'){const x=parseNum(inp[0]),y=parseNum(inp[1]);if(isNaN(x)||isNaN(y))return {empty:true};if(a.any)return {ok:x*a.b===y*a.a&&x>0};if(x===a.a&&y===a.b)return {ok:true};if(x*a.b===y*a.a)return {retry:'비율은 맞아요! 더 간단한 자연수의 비로 나타내 보세요.'};return {ok:false}}
  // frac
  const w=inp[0].trim()===''?0:parseNum(inp[0]),n=inp[1].trim()===''?null:parseNum(inp[1]),d=inp[2].trim()===''?null:parseNum(inp[2]);
  if(isNaN(w))return {empty:true};if(n===null&&d===null){if(inp[0].trim()==='')return {empty:true};return {ok:a.d===1&&w===a.n}}
  if(n===null||d===null||isNaN(n)||isNaN(d)||d===0)return {empty:true,msg:'분자와 분모를 모두 써 주세요.'};
  const tn=w*d+n;if(tn*a.d!==a.n*d)return {ok:false};
  if(gcd(n,d)!==1||a.d===1)return {retry:'값은 맞아요! 약분해서 기약분수(가장 간단한 분수)로 써 보세요.'};
  if(w>0&&n>=d)return {retry:'값은 맞아요! 분수 부분이 1보다 작게 대분수로 고쳐 써 보세요.'};return {ok:true}}

    case 'sheetset':{if(!V.opt||V.optU!==id){V={view:'sheetset',id,optU:id}}else V={...V,view:'sheetset',id};window.scrollTo(0,0);return render()}
    case 'wsopt':{V.opt[b.dataset.k]=b.dataset.k==='n'?+b.dataset.v:b.dataset.v;readWsChecks();return render()}
    case 'wsmake':{if(V.view==='sheetset')readWsChecks();if(!V.opt.ls.length)return toast('범위를 하나 이상 골라 주세요');const ws=makeSheet(id);V={...V,view:'sheet',ws};window.scrollTo(0,0);return render()}
    case 'wsprint':{try{window.print()}catch(e){toast('이 화면에서는 인쇄할 수 없어요')}return}
    case 'wall':me().wall=b.dataset.k;save();return render();
    case 'wlock':{const un=UNITS.find(x=>x.id===b.dataset.u);return toast(`'${un.title}' 단원평가 100점이면 열려요`)}
    case 'room':V={view:'room'};window.scrollTo(0,0);return render();
    case 'petsel':V.pet=+b.dataset.i;return render();
    case 'snack':V.snack=+b.dataset.k;return render();
    case 'feed':{const d=me(),i=+b.dataset.i,pet=d.pets[i];let k=V.snack!=null&&d.snacks[V.snack]?V.snack:+Object.keys(d.snacks).find(x=>d.snacks[x]>0);if(isNaN(k))return toast('간식이 없어요. 문제를 맞히면 받아요!');
      d.snacks[k]--;if(!d.snacks[k]){delete d.snacks[k];if(V.snack===k)V.snack=null}pet.fed=(pet.fed||0)+1;save();V.eat=i;V.pet=i;render();toast(`${SNACKS[k][0]} 냠냠! ${pet.name||ANIMALS[pet.sp].n}(이)가 좋아해요 💕`);setTimeout(()=>{if(V.eat===i){V.eat=null;if(V.view==='room')render()}},1600);return}
    case 'rename':{const i=+b.dataset.i,pet=me().pets[i];const m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="card"><h3>이름 짓기</h3><input class="namein" id="pn" maxlength="8" value="${pet.name||''}" placeholder="${ANIMALS[pet.sp].n}"><div class="row"><button class="btn ghost" id="pnNo">취소</button><button class="btn" id="pnOk">저장</button></div></div></div>`;
      document.getElementById('pnNo').onclick=()=>m.innerHTML='';document.getElementById('pnOk').onclick=()=>{pet.name=document.getElementById('pn').value.trim().replace(/[<>&"]/g,'');save();m.innerHTML='';render()};return}
    case 'reset':return modalConfirm('이 학생의 학습 기록과 오답노트를 모두 지울까요?',()=>{const s=me().sem;S.data[S.cur]={ls:{},wrong:[],sem:s};save();go({view:'stats'})});
  }});
/* ----- 클라우드 동기화 ----- */
const SY={ref:null,st:'wait',writing:false,pending:false,timer:null};
function syncText(){return SY.st==='ok'?(FB.on&&FB.user?`☁ 기록이 저장되고 있어요 (아이디: ${shownId(FB.user)}). 어느 기기에서든 같은 아이디로 로그인하면 이어져요.`:'☁ 기록이 Claude 계정에 저장돼요. 같은 계정으로 로그인하면 어느 브라우저·기기에서든 이어서 할 수 있어요.'):SY.st==='wait'?'☁ 저장소에 연결하는 중…':SY.st==='err'?'⚠ 지금은 서버에 저장하지 못했어요. 이 브라우저에 임시로 저장하고, 연결되면 다시 올려요.':'💾 기록은 이 기기에 저장돼요. 혹시 모를 상황에 대비해 가끔 \'기록\' 화면에서 백업 파일을 저장해 두세요.'}
function setSync(st){SY.st=st;['syncline','syncline2'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=syncText()})}
function payload(){return {v:1,updatedAt:S.updatedAt||Date.now(),learners:S.learners,data:S.data}}
pushHook=()=>schedulePush();
function schedulePush(){if(!SY.ref)return;clearTimeout(SY.timer);SY.timer=setTimeout(pushNow,700)}
async function pushNow(){if(!SY.ref)return;if(SY.writing){SY.pending=true;return}SY.writing=true;
  try{await SY.ref.set(JSON.parse(JSON.stringify(payload())));S.synced=true;saveLocal();setSync('ok')}catch(e){setSync('err');if(e&&e.code==='unavailable'){setTimeout(schedulePush,3000+Math.random()*2000)}}
  SY.writing=false;if(SY.pending){SY.pending=false;pushNow()}}
function mergeInto(r){ // 처음 동기화하는 브라우저: 양쪽 기록을 합쳐요
  const ids=new Set(S.learners.map(l=>l.id));(r.learners||[]).forEach(l=>{if(!ids.has(l.id))S.learners.push(l)});
  Object.entries(r.data||{}).forEach(([id,rd])=>{const ld=S.data[id];if(!ld){S.data[id]=rd;return}
    Object.entries(rd.ls||{}).forEach(([k,v])=>{if(!ld.ls[k]||(v.t||0)>(ld.ls[k].t||0))ld.ls[k]=v});
    gameInit(ld);gameInit(rd);rd.pets.forEach(p=>{if(!ld.pets.some(x=>x.ch===p.ch))ld.pets.push(p)});Object.entries(rd.snacks).forEach(([k,v])=>{ld.snacks[k]=Math.max(ld.snacks[k]||0,v)});Object.assign(ld.room,rd.room);Object.assign(ld.lim,rd.lim);ld.snackGiven=Math.max(ld.snackGiven,rd.snackGiven);
    const seen=new Set((ld.wrong||[]).map(w=>w.lid+':'+(w.seed||w.at)));(rd.wrong||[]).forEach(w=>{if(!seen.has(w.lid+':'+(w.seed||w.at)))ld.wrong.push(w)});ld.wrong.sort((a,b)=>(b.at||0)-(a.at||0));ld.wrong=ld.wrong.slice(0,80)})}
function adopt(r){const cur=S.cur;S.learners=r.learners||[];S.data=r.data||{};S.updatedAt=r.updatedAt||0;S.cur=S.learners.some(l=>l.id===cur)?cur:(S.learners[0]?S.learners[0].id:null);S.synced=true;saveLocal()}
function softRender(){if(V.view==='practice')return;render()}
async function initSync(){try{if(!window.claude||!window.claude.use)return setSync('local');
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return setSync('local');
  const uid=await user.id();if(!uid)return setSync('local');await connect(db.doc('data/users/'+uid+'/state'));
 }catch(e){setSync(SY.ref?'err':'local')}}
async function connect(ref){try{SY.ref=ref;
  let snap;try{snap=await SY.ref.get()}catch(e){await new Promise(r=>setTimeout(r,1500));snap=await SY.ref.get()}
  const r=snap.exists?snap.data():null;
  if(r&&r.v===1){if(!S.synced){mergeInto(r);if(!S.cur&&S.learners[0])S.cur=S.learners[0].id;S.updatedAt=Date.now();saveLocal();await pushNow()}
    else if((r.updatedAt||0)>(S.updatedAt||0))adopt(r);else if((S.updatedAt||0)>(r.updatedAt||0))await pushNow()}
  else if(S.learners.length)await pushNow();
  if(SY.st!=='err')setSync('ok');softRender();
  SY.unsub=SY.ref.onSnapshot(sn=>{if(!sn.exists||sn.metadata.hasPendingWrites)return;const d=sn.data();if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)){adopt(d);softRender()}},()=>{});
 }catch(e){setSync('err')}}
function disconnect(){if(SY.unsub)SY.unsub();SY.unsub=null;SY.ref=null}

/* ----- Firebase (GitHub 버전) ----- */
const FB={on:false,auth:null,fs:null,user:undefined,msg:''};
const ID_DOMAIN='@mathgil.app';
function idToEmail(id){id=id.trim();if(id.includes('@'))return id;if(/^[a-z0-9_]+$/i.test(id))return id.toLowerCase()+ID_DOMAIN;return 'x-'+[...new TextEncoder().encode(id)].map(b=>b.toString(16).padStart(2,'0')).join('')+ID_DOMAIN}
function idPw(id,pw){return id.includes('@')?pw:pw+'#mg'}
function shownId(u){const e=(u&&u.email)||'';if(!e.endsWith(ID_DOMAIN))return e;const l=e.slice(0,-ID_DOMAIN.length);if(l.startsWith('x-')){try{const h=l.slice(2);return new TextDecoder().decode(new Uint8Array(h.match(/../g).map(x=>parseInt(x,16))))}catch(_){return l}}return l}
function idCheck(id){if(id.includes('@'))return '';if(id.length<2||id.length>12)return '아이디는 2~12글자로 해 주세요.';if(!/^[a-z0-9_가-힣]+$/i.test(id))return '아이디는 한글, 영어, 숫자만 쓸 수 있어요.';return ''}
function fbConfigured(){const c=window.FIREBASE_CONFIG;return !!(window.firebase&&c&&c.apiKey&&c.projectId)}
function fbErr(e){const c=(e&&e.code)||'';return c.includes('invalid-credential')||c.includes('wrong-password')||c.includes('user-not-found')||c.includes('invalid-login')?'아이디 또는 비밀번호가 맞지 않아요.':c.includes('email-already-in-use')?'이미 있는 아이디예요. 다른 아이디를 쓰거나 로그인을 눌러 주세요.':c.includes('weak-password')?'비밀번호는 4글자 이상으로 해 주세요.':c.includes('invalid-email')?'아이디는 한글, 영어, 숫자만 쓸 수 있어요.':c.includes('network')?'인터넷 연결을 확인해 주세요.':c.includes('operation-not-allowed')?'Firebase 콘솔에서 이메일/비밀번호 로그인을 켜 주세요.':c.includes('too-many-requests')?'시도가 너무 많아요. 잠시 후 다시 해 주세요.':'로그인하지 못했어요. ('+c+')'}
function renderLogin(){app.innerHTML=`<div class="card" style="margin-top:20px;text-align:center"><div style="display:flex;justify-content:center;gap:2px">${[1,9,6].map(i=>petSVG(i,2,92)).join('')}</div><h2>수학 길잡이에 어서 와요!</h2><p class="small muted">아이디와 비밀번호로 로그인해요. 어느 기기에서든 같은 아이디로 들어오면 내 기록과 동물 친구들이 그대로 있어요.</p>
  <input class="namein" id="em" type="text" placeholder="아이디 (한글·영어·숫자 2~12글자)" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"><input class="namein" id="pw" type="password" placeholder="비밀번호 (4글자 이상)" autocomplete="current-password">
  ${FB.msg?`<div class="fb no">${FB.msg}</div>`:''}<div class="row"><button class="btn" data-act="login">로그인</button><button class="btn ghost" data-act="signup">처음이면 가입하기</button></div><p class="mini-note">비밀번호를 잊으면 찾을 수 없으니 선생님께 꼭 알려 두세요.</p></div>`}
function fbCred(){return [document.getElementById('em').value.trim(),document.getElementById('pw').value]}
function startFirebase(){FB.on=true;try{firebase.initializeApp(window.FIREBASE_CONFIG);FB.auth=firebase.auth();FB.fs=firebase.firestore();}catch(e){FB.on=false;return false}
  FB.auth.onAuthStateChanged(u=>{FB.user=u||null;FB.msg='';if(u){if(S.owner&&S.owner!==u.uid){S={learners:[],cur:null,data:{},updatedAt:0}}S.owner=u.uid;saveLocal();setSync('wait');render();connect(FB.fs.collection('mathgil').doc(u.uid)).then(()=>{if(!S.learners.length){const nid='L'+Date.now();S.learners.push({id:nid,name:shownId(u)||'나'});S.cur=nid;me();save();if(V.view!=='practice')go({view:'home'})}})}else{disconnect();render()}});return true}
if(fbConfigured()&&startFirebase()){render()}else{FB.on=false;render();initSync()}
}
</script>
