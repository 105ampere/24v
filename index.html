<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수학 길잡이 · 5학년 2학기~6학년</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학 길잡이">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5ef">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5ef;--card:#fff;--ink:#23272d;--sub:#6a6f77;--line:#e3e1d8;
  --g5:#5f8f24;--g5l:#edf4e0;--g6:#7442a0;--g6l:#f1e9f8;--pre:#c9711e;--prel:#fbefe1;
  --ok:#17905a;--okl:#e2f5ea;--no:#cf3f3f;--nol:#fde9e9;--acc:#5f8f24;--accl:#edf4e0;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
header.top{position:sticky;top:0;z-index:5;background:rgba(246,245,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-family:'Jua',sans-serif;font-size:22px;letter-spacing:-.5px;flex:1;cursor:pointer;white-space:nowrap}
.logo span{color:var(--g6)}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.iconbtn{border:0;background:transparent;font-size:14px;color:var(--sub);padding:6px 8px;border-radius:8px}
.iconbtn:hover{background:#ebe9e1}
h1,h2,h3{font-family:'Jua',sans-serif;font-weight:400;letter-spacing:-.3px;margin:0}
h1{font-size:26px}h2{font-size:22px}h3{font-size:19px}
.muted{color:var(--sub)}
.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.tabs{display:flex;gap:6px;margin:14px 0 4px;overflow-x:auto;padding-bottom:2px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;white-space:nowrap;color:var(--sub)}
.tab.on{color:#fff;border-color:transparent}
.tab.on.pre{background:var(--pre)}.tab.on.g5{background:var(--g5)}.tab.on.g6{background:var(--g6)}
.unit{display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .1s}
.unit:active{transform:scale(.99)}
.unum{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Jua';font-size:20px;color:#fff;background:var(--acc)}
.unit .t{font-weight:700;font-size:17px}
.bar{height:7px;background:#ecebe4;border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.lesson{display:flex;align-items:center;gap:10px;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.lesson:first-child{border-top:0}
.lesson .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accl);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:14px}
.lesson .t{flex:1;font-weight:500}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:#f0efe8;color:var(--sub);font-weight:500;white-space:nowrap}
.badge.acc{background:var(--accl);color:var(--acc)}
.stars{color:#e3a521;letter-spacing:1px;font-size:14px;white-space:nowrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--acc);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.back{border:0;background:none;color:var(--sub);padding:12px 0 2px;font-size:15px}
.seg{display:flex;background:#ebe9e1;border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* explanation */
.ex p{margin:8px 0}
.key{background:var(--accl);border-left:5px solid var(--acc);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:500}
.key b{color:var(--acc)}
.eg{background:#faf9f4;border:1px dashed #cfccbf;border-radius:12px;padding:12px 14px;margin:12px 0}
.egt{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.warn{background:#fff6e6;border-radius:12px;padding:10px 14px;margin:12px 0;font-size:15px}
.warn:before{content:"⚠ 자주 하는 실수  ";font-weight:700;color:#b76b00}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.steps div{flex:1;min-width:120px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px}
.steps b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:13px;margin-right:4px}
.fig{text-align:center;margin:10px 0}
.fig svg{max-width:100%;height:auto}
table.t{border-collapse:collapse;margin:8px 0;font-size:15px}
table.t td,table.t th{border:1px solid var(--line);padding:5px 10px;text-align:center}
table.t th{background:#f4f3ec;font-weight:500}
/* fractions */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 .12em;font-size:.92em}
.fr>span{padding:0 .22em}
.fr>.nu{border-bottom:1.6px solid currentColor}
.big{font-size:26px;font-weight:500;text-align:center;margin:14px 0;line-height:1.9}
.big .fr{font-size:.8em}
/* problem */
.pq{font-size:18px}
.lv{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--sub)}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#dcdad0;margin-right:3px}
.dots i.on{background:var(--acc)}
.ansrow{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 6px;flex-wrap:wrap;font-size:20px}
.ansrow input{font-size:22px;text-align:center;border:2px solid #cfcdc3;border-radius:10px;padding:6px;width:150px;background:#fff;color:var(--ink)}
.ansrow input:focus{outline:none;border-color:var(--acc)}
.fin{display:flex;align-items:center;gap:6px}
.fin .w{width:64px!important}
.fst{display:flex;flex-direction:column;align-items:center;gap:4px}
.fst input{width:72px!important;padding:4px!important}
.fst hr{width:84px;border:0;border-top:2.5px solid var(--ink);margin:0}
.rat input{width:84px!important}
.mc{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
.mc.one{grid-template-columns:1fr}
.mc button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 10px;font-size:17px;min-height:54px}
.mc button.sel{border-color:var(--acc);background:var(--accl)}
.mc button.right{border-color:var(--ok);background:var(--okl)}
.mc button.wrong{border-color:var(--no);background:var(--nol)}
.hintbox{font-size:14px;color:var(--sub);text-align:center;margin-top:2px}
.fb{border-radius:12px;padding:12px 14px;margin:12px 0;font-weight:500}
.fb.ok{background:var(--okl);color:var(--ok)}
.fb.no{background:var(--nol);color:var(--no)}
.fb.mid{background:#fff6e0;color:#a26300}
.sol{background:#faf9f4;border-radius:12px;padding:12px 14px;margin:10px 0;border:1px solid var(--line)}
.sol .h{font-weight:700;margin-bottom:4px}
.sol ol{margin:4px 0;padding-left:22px}
.sol li{margin:3px 0}
.ladder{font-family:ui-monospace,Menlo,monospace;font-size:16px;line-height:1.5;margin:6px 0}
.ladder td{padding:0 8px;text-align:right}
.ladder td.p{border-right:2px solid var(--ink);color:var(--acc);font-weight:700}
.ladder tr.l td:not(.p){border-bottom:2px solid var(--ink)}
.numset{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.numset span{border:1.5px solid var(--line);border-radius:8px;padding:2px 10px;background:#fff;font-weight:500}
.letter{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:64px;line-height:1;text-align:center;margin:8px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23272d;color:#fff;padding:10px 18px;border-radius:99px;font-weight:500;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.score{display:flex;gap:10px;margin:10px 0}
.score div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.score b{display:block;font-size:22px;font-family:'Jua'}
.rec{border:2px solid var(--acc);background:linear-gradient(0deg,#fff,var(--accl))}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:30;padding:20px}
.modal .card{max-width:420px;width:100%}
.namein{width:100%;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;margin:8px 0}
.lrn{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lrn:first-child{border-top:0}
.lrn .nm{flex:1;font-weight:700}
.statrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.statrow .nm{flex:1}
.statrow .pct{width:52px;text-align:right;font-weight:700}
.statrow .bar{width:90px;margin:0}
.syncline{font-size:13px;color:var(--sub);margin:8px 2px 0}
.sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0;color:#111}
.ws-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}
.ws-head b{font-family:'Jua';font-size:22px;font-weight:400}.ws-name{font-size:13px;text-align:right;line-height:1.9}
.ws-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.ws-item{display:flex;gap:8px;break-inside:avoid;page-break-inside:avoid;padding:8px 0 14px;border-bottom:1px dashed #ccc;font-size:15px}
.ws-no{flex:none;width:24px;height:24px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.ws-q{flex:1;min-width:0}.ws-q .big{font-size:20px;margin:8px 0}.ws-q .fig svg{max-width:100%;height:auto}.ws-q .letter{font-size:44px}
.ws-opts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:14px}.ws-ans{margin-top:10px;font-size:14px;text-align:right}
.ws-key{padding:6px 0;border-bottom:1px dashed #ddd;font-size:14px;break-inside:avoid;page-break-inside:avoid}.ws-keyans{font-weight:700}
.ws-sol{font-size:13px;color:#444;margin-top:2px}.ws-sol ol{margin:2px 0;padding-left:18px}.ws-sol .fig,.ws-sol svg{display:none}
.ws-code{text-align:right;font-size:11px;color:#999;margin-top:8px}
@media (max-width:600px){.ws-grid{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:12mm}header.top,.noprint,.toast,#modal{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}
 .sheet{border:0;border-radius:0;padding:0;margin:0}.anskey{break-before:page;page-break-before:always}.ws-grid{grid-template-columns:1fr 1fr!important}
 .fr>.nu{border-bottom-color:#000}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.pop{text-align:center}.pop-t{font-family:'Jua';font-size:24px;margin-bottom:4px}
.minis{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.room{display:block;border-radius:10px}
.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom;cursor:pointer}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.hop{display:inline-block;animation:hop .55s ease-in-out 3}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.wob svg{animation:wob 1s ease-in-out infinite;transform-origin:center bottom}@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.heart{animation:up 1.4s ease-out forwards}@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.petcard{display:flex;gap:12px;align-items:center}.pc-img{flex:none}@media(max-width:480px){.petcard{flex-direction:column;text-align:center}.petcard .row{justify-content:center}}.petcard .t{font-weight:700;font-size:17px}.petcard.focus{border:2px solid var(--acc)}
.btn.sm{padding:7px 12px;font-size:14px;flex:none!important}
.snacks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.snack{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;font-size:24px}.snack b{font-size:13px;margin-left:3px;color:var(--sub)}.snack.on{border-color:var(--acc);background:var(--accl)}
.furn{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin:6px 0}.furn div{text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px}.furn span{font-size:28px;display:block}.furn small{font-size:11px;color:var(--sub);line-height:1.3;display:block}.furn .lock{opacity:.55}
.walls{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 4px 4px}.wallbtn{border:2px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px 3px 4px;font-size:13px;display:flex;align-items:center;gap:5px}.wallbtn i{width:18px;height:18px;border-radius:50%;border:1px solid #ddd;display:inline-block}.wallbtn.on{border-color:var(--acc)}
.wallbtn.locked{opacity:.55}.wallbtn.lim{border-style:dashed}.limown{border-color:#ffd34d!important;background:#fffbe8}.wsw{display:inline-block;width:34px;height:28px;border-radius:6px;border:1px solid #ddd}
.twinkle{animation:tw 1.6s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.iconbtn{white-space:nowrap}@media(max-width:430px){.iconbtn{padding:6px 3px;font-size:13px}.logo{font-size:19px}header.top .in{gap:4px}}
.mini-note{font-size:13px;color:var(--sub);margin-top:6px}
@media (max-width:420px){.big{font-size:23px}.mc button{font-size:16px}.ansrow input{width:130px}}
</style>
</head>

<header class="top"><div class="in">

<!-- Firebase: firebase-config.js에 내 프로젝트 값을 넣으면 기록이 Firebase에 저장돼요 -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ===================== 공통 도구 ===================== */
let rnd=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newSeed(){return Math.floor(Math.random()*2147483646)+1}
function genS(lid,lv,seed){const l=LESSONS[lid];const old=rnd;rnd=mulberry(seed);try{return l.gen(lv||1)}finally{rnd=old}}
const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};
const lcm=(a,b)=>a/gcd(a,b)*b;
const red=(n,d)=>{const g=gcd(n,d)||1;return [n/g,d/g]};
const P10=k=>Math.pow(10,k);
function D(x){return String(+(+x).toFixed(6))}
function N(x){const s=D(x);const [i,f]=s.split('.');return i.replace(/\B(?=(\d{3})+(?!\d))/g,',')+(f!==undefined?'.'+f:'')}
function fr(n,d){return `<span class="fr"><span class="nu">${n}</span><span class="de">${d}</span></span>`}
function mix(n,d){if(d===1)return `${n}`;if(n>=d){const w=Math.floor(n/d),r=n%d;return r?`${w}${fr(r,d)}`:`${w}`}return fr(n,d)}
function mixR(n,d){[n,d]=red(n,d);return mix(n,d)}
function F(n,d){[n,d]=red(n,d);return {t:'frac',n,d}}
function num(v,unit){return {t:'num',v:+(+v).toFixed(9),unit:unit||''}}
function coprimeFrac(minD,maxD){let a,b;do{b=R(minD,maxD);a=R(1,b-1)}while(gcd(a,b)!==1);return [a,b]}
// 약분해서 끝까지 이어 쓰기: (N/D 다음) = 기약분수 = 대분수
function tail(n,d){const out=[];const [rn,rd]=red(n,d);if(rd===1)out.push(String(rn));else{if(rn!==n)out.push(fr(rn,rd));if(rn>rd)out.push(mix(rn,rd))}return out.map(x=>' = '+x).join('')}
function fx(f){return f[1]===1?String(f[0]):fr(f[0],f[1])}
function mulLine(fs){const nN=fs.map(f=>f[0]),dN=fs.map(f=>f[1]).filter(d=>d!==1);const Nn=nN.reduce((a,b)=>a*b,1),Dd=fs.reduce((a,f)=>a*f[1],1);
  const top=nN.join(' × '),bot=dN.length?dN.join(' × '):'1';return `${fs.map(fx).join(' × ')} = ${fr(top,bot)} = ${Dd===1?Nn:fr(Nn,Dd)}${Dd===1?'':tail(Nn,Dd)}`}
function mc(correct,wrongs,one){const opts=shuffle([correct,...wrongs]);return {t:'mc',opts,a:opts.indexOf(correct),one:!!one}}
function ol(arr){return `<ol>${arr.map(s=>`<li>${s}</li>`).join('')}</ol>`}
function prob(q,ans,sol){return {q,ans,sol}}
const PI_TXT='원주율은 3.14로 계산해요.';

/* ===================== 그림(SVG) ===================== */
const COLORS=['#8fbf4d','#9a6cc2','#f2b544','#5aa6d6','#e57b6a'];
function svgArea(a,b,c,d){const W=240,H=150,cw=W/b,ch=H/d;let s=`<svg viewBox="-2 -2 ${W+4} ${H+40}" width="${W+4}"><g>`;
  for(let i=0;i<b;i++)for(let j=0;j<d;j++){const ic=i<a,ir=j<c;const f=ic&&ir?'#7aa83f':ic?'#f3e3a0':ir?'#d6e6f5':'#fff';s+=`<rect x="${i*cw}" y="${j*ch}" width="${cw}" height="${ch}" fill="${f}" stroke="#555" stroke-width="1"/>`}
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="none" stroke="#222" stroke-width="2"/></g><text x="${W/2}" y="${H+26}" text-anchor="middle" font-size="14">초록색 칸: 전체 ${b*d}칸 중 ${a*c}칸</text></svg>`;return s}
function svgFracBar(n,d,label){const W=260,cw=W/d;let s=`<svg viewBox="-2 -2 ${W+4} 56" width="${W+4}">`;for(let i=0;i<d;i++)s+=`<rect x="${i*cw}" y="0" width="${cw}" height="34" fill="${i<n?'#9a6cc2':'#fff'}" fill-opacity="${i<n?.55:1}" stroke="#444"/>`;

function svgCuboid(a,b,c,unit){unit=unit||'cm';const x0=20,y0=58,W=160,H=92,dx=56,dy=-40;const P=(x,y)=>`${x},${y}`;

function ladder(a,b){let x=a,y=b;const rows=[];while(true){let p=0;for(let k=2;k<=Math.min(x,y);k++){if(x%k===0&&y%k===0){p=k;break}}if(!p)break;rows.push([p,x,y]);x/=p;y/=p}
  const html=`<table class="ladder">${rows.map((r,i)=>`<tr class="l"><td class="p">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}<tr><td></td><td>${x}</td><td>${y}</td></tr></table>`;
  return {html,ps:rows.map(r=>r[0]),x,y}}

ex:()=>`<p>+, −, ×, ÷가 섞인 식은 계산하는 <b>순서</b>가 정해져 있어요.</p>
<div class="steps"><div><b>1</b>( ) 괄호 안</div><div><b>2</b>곱셈·나눗셈<br><small>앞에서부터</small></div><div><b>3</b>덧셈·뺄셈<br><small>앞에서부터</small></div></div>
<div class="eg"><div class="egt">예시</div>20 + 6 × 3 − 8 ÷ 2<br>① 6 × 3 = 18 &nbsp; ② 8 ÷ 2 = 4<br>③ 20 + 18 − 4 = <b>34</b></div>
<div class="warn">무조건 앞에서부터 계산하면 틀려요. 먼저 계산할 부분에 밑줄을 긋고 시작해요.</div>`,
gen(lv){const k=lv===1?R(0,2):lv===2?R(1,4):R(3,5);let q,res,st;
  if(k===0){const a=R(10,60),b=R(2,9),c=R(2,9);res=a+b*c;q=`${a} + ${b} × ${c}`;st=[`곱셈 먼저: ${b} × ${c} = ${b*c}`,`${a} + ${b*c} = ${res}`]}
  else if(k===1){const c=R(2,9),qq=R(2,9),b=c*qq,a=R(qq+5,60);res=a-qq;q=`${a} − ${b} ÷ ${c}`;st=[`나눗셈 먼저: ${b} ÷ ${c} = ${qq}`,`${a} − ${qq} = ${res}`]}
  else if(k===2){const a=R(5,30),b=R(2,20),c=R(2,6);res=(a+b)*c;q=`(${a} + ${b}) × ${c}`;st=[`괄호 먼저: ${a} + ${b} = ${a+b}`,`${a+b} × ${c} = ${res}`]}
  else if(k===3){const a=R(3,12),b=R(3,9),d=R(2,6),q2=R(2,8),c=d*q2;res=a*b-q2;q=`${a} × ${b} − ${c} ÷ ${d}`;st=[`${a} × ${b} = ${a*b}`,`${c} ÷ ${d} = ${q2}`,`${a*b} − ${q2} = ${res}`]}
  else if(k===4){const c=R(2,9),q3=R(2,9),b=R(2,30),a=b+c*q3,d=R(2,30);res=q3+d;q=`(${a} − ${b}) ÷ ${c} + ${d}`;st=[`괄호 먼저: ${a} − ${b} = ${a-b}`,`${a-b} ÷ ${c} = ${q3}`,`${q3} + ${d} = ${res}`]}
  else{const e=R(2,6),m=R(1,6),df=e*m,c=R(1,20),b=c+df,d=R(2,9),a=R(5,40);res=a+m*d;q=`${a} + (${b} − ${c}) × ${d} ÷ ${e}`;st=[`괄호 먼저: ${b} − ${c} = ${df}`,`곱셈·나눗셈은 앞에서부터: ${df} × ${d} = ${df*d}`,`${df*d} ÷ ${e} = ${m*d}`,`${a} + ${m*d} = ${res}`]}
  return prob(`다음을 계산하세요.<div class="big">${q}</div>`,num(res),ol(st))}},

ex:()=>{const L=ladder(12,18);return `<p><b>약수</b>: 어떤 수를 나누어떨어지게 하는 수 (12의 약수: 1, 2, 3, 4, 6, 12)<br><b>배수</b>: 어떤 수를 1배, 2배, 3배… 한 수 (4의 배수: 4, 8, 12, …)</p>
<div class="key">두 수를 <b>공약수로 계속 나누어요</b>. 1 말고 더 나눌 수 없을 때까지!</div>
<div class="eg"><div class="egt">12와 18</div>${L.html}최대공약수 = 왼쪽 수의 곱 = 2 × 3 = <b>6</b><br>최소공배수 = 왼쪽 수 × 아래 수 = 2 × 3 × 2 × 3 = <b>36</b></div>
<div class="warn">최소공배수를 구할 때 맨 아래에 남은 두 수(2, 3)를 곱하는 것을 빼먹지 마세요.</div>`},
gen(lv){const g=lv===1?R(2,6):lv===2?R(2,12):R(4,18);let x,y;do{x=R(1,lv===3?9:6);y=R(2,lv===3?9:7)}while(x===y||gcd(x,y)!==1);
  const a=g*x,b=g*y,ask=pick(['gcd','lcm']);const L=ladder(a,b);const G=L.ps.reduce((p,c)=>p*c,1);
  return prob(`두 수 <b>${a}</b>, <b>${b}</b>의 <b>${ask==='gcd'?'최대공약수':'최소공배수'}</b>를 구하세요.`,num(ask==='gcd'?G:G*L.x*L.y),
   `공약수로 나누면:${L.html}${ask==='gcd'?`최대공약수 = ${L.ps.join(' × ')} = <b>${G}</b>`:`최소공배수 = ${[...L.ps,L.x,L.y].join(' × ')} = <b>${G*L.x*L.y}</b>`}`)}},
{id:'pre3',title:'약분과 통분',book:'88~89단계',key:'분모·분자를 같은 수로 나누면 약분, 분모를 같게 만들면 통분',
ex:()=>`<p><b>약분</b>: 분모와 분자를 공약수로 나누어 간단하게 만들어요. 더 이상 나눌 수 없는 분수를 <b>기약분수</b>라고 해요.</p>

gen(lv){const mode=lv===1?'r':lv===2?pick(['r','l']):pick(['l','c','r']);
  if(mode==='r'){const [a,b]=coprimeFrac(2,lv===1?9:12),k=R(2,lv===1?5:9);return prob(`<div class="big">${fr(a*k,b*k)}</div>를 기약분수로 나타내세요.`,F(a,b),`분모와 분자의 최대공약수는 ${k}이에요.<br>${fr(a*k+' ÷ '+k,b*k+' ÷ '+k)} = <b>${fr(a,b)}</b>`)}
  if(mode==='l'){let d1,d2;do{d1=R(2,12);d2=R(2,12)}while(d1===d2||d1%d2===0||d2%d1===0);let a1,c1;do{a1=R(1,d1-1)}while(gcd(a1,d1)!==1);do{c1=R(1,d2-1)}while(gcd(c1,d2)!==1);const L=lcm(d1,d2);
    return prob(`<div class="big">${fr(a1,d1)} , ${fr(c1,d2)}</div>를 분모의 최소공배수로 통분할 때 <b>공통분모</b>는 얼마인가요?`,num(L),`${d1}과(와) ${d2}의 최소공배수는 ${L}이에요.<br>${fr(a1,d1)} = ${fr(a1*L/d1,L)}, ${fr(c1,d2)} = ${fr(c1*L/d2,L)}`)}
  let a,b,c,d;do{[a,b]=coprimeFrac(3,12);[c,d]=coprimeFrac(3,12)}while(a*d===b*c||b===d);const L=lcm(b,d);const big=a*d>c*b?fr(a,b):fr(c,d),small=a*d>c*b?fr(c,d):fr(a,b);
  return prob(`두 분수 중 <b>더 큰 수</b>를 고르세요.`,mc(big,[small]),`통분해서 비교해요: ${fr(a,b)} = ${fr(a*L/b,L)}, ${fr(c,d)} = ${fr(c*L/d,L)}<br>분자가 큰 쪽이 더 커요 → <b>${big}</b>`)}},

ex:()=>`<p>분모가 다르면 조각의 크기가 달라서 바로 더할 수 없어요. 먼저 <b>통분</b>해서 조각 크기를 같게 만들어요.</p>
<div class="eg"><div class="egt">진분수의 덧셈</div>${fr(1,2)} + ${fr(1,3)} = ${fr(3,6)} + ${fr(2,6)} = <b>${fr(5,6)}</b></div>
<div class="eg"><div class="egt">받아내림이 있는 대분수의 뺄셈</div>3${fr(1,4)} − 1${fr(2,3)} = 3${fr(3,12)} − 1${fr(8,12)}<br>분수끼리 뺄 수 없으니 1을 빌려와요: 3${fr(3,12)} = 2${fr(15,12)}<br>2${fr(15,12)} − 1${fr(8,12)} = <b>1${fr(7,12)}</b></div>
<div class="warn">분모끼리 더하면 안 돼요! ${fr(1,2)} + ${fr(1,3)} ≠ ${fr(2,5)}</div>`,
gen(lv){let d1,d2;do{d1=R(2,lv===1?8:10);d2=R(2,lv===1?8:10)}while(d1===d2);const L=lcm(d1,d2);
  const cp=d=>{let x;do{x=R(1,d-1)}while(gcd(x,d)!==1);return x};
  if(lv===1){let a,c;do{a=cp(d1);c=cp(d2)}while(a*d2===c*d1);const op=pick(['+','−']);let A=a,C=c,D1=d1,D2=d2;if(op==='−'&&a*d2<=c*d1){[A,C,D1,D2]=[c,a,d2,d1]}
    const n1=A*L/D1,n2=C*L/D2,res=op==='+'?n1+n2:n1-n2;return prob(`다음을 계산하세요.<div class="big">${fr(A,D1)} ${op} ${fr(C,D2)}</div>`,F(res,L),
    `통분: ${fr(A,D1)} ${op} ${fr(C,D2)} = ${fr(n1,L)} ${op} ${fr(n2,L)} = ${fr(res,L)}${tail(res,L)}`)}
  let w1,a,w2,c,n1,n2,op=lv===2?pick(['+','−']):'−';
  for(let t=0;t<200;t++){w1=R(2,6);w2=R(1,w1-1);a=cp(d1);c=cp(d2);n1=a*L/d1;n2=c*L/d2;if(op==='+')break;if(lv===2&&n1>n2)break;if(lv===3&&n1<n2)break}
  if(lv===3&&n1>=n2)op='+';
  const v1=w1*L+n1,v2=w2*L+n2,res=op==='+'?v1+v2:v1-v2;
  let st=[`통분: ${w1}${fr(a,d1)} ${op} ${w2}${fr(c,d2)} = ${w1}${fr(n1,L)} ${op} ${w2}${fr(n2,L)}`];
  if(op==='+'){st.push(`자연수끼리 ${w1} + ${w2} = ${w1+w2}, 분수끼리 ${fr(n1,L)} + ${fr(n2,L)} = ${fr(n1+n2,L)}`)}
  else if(n1>=n2){st.push(`자연수끼리 ${w1} − ${w2} = ${w1-w2}, 분수끼리 ${fr(n1,L)} − ${fr(n2,L)} = ${fr(n1-n2,L)}`)}
  else{st.push(`${fr(n1,L)}에서 ${fr(n2,L)}를 뺄 수 없으니 1을 빌려와요: ${w1}${fr(n1,L)} = ${w1-1}${fr(n1+L,L)}`);st.push(`${w1-1}${fr(n1+L,L)} − ${w2}${fr(n2,L)} = ${w1-1-w2}${fr(n1+L-n2,L)}`)}
  st.push(`답: <b>${mixR(res,L)}</b>`);
  return prob(`다음을 계산하세요.<div class="big">${w1}${fr(a,d1)} ${op} ${w2}${fr(c,d2)}</div>`,F(res,L),ol(st))}}
]);

U('s52','1','수의 범위와 어림하기',[
{id:'a1',title:'이상, 이하, 초과, 미만',key:'이상·이하는 그 수를 <b>포함</b>, 초과·미만은 <b>포함하지 않아요</b>',
ex:()=>`<table class="t"><tr><th>말</th><th>뜻</th><th>예 (10)</th></tr><tr><td>10 이상</td><td>10과 같거나 큰 수</td><td>10, 11, 12…</td></tr><tr><td>10 이하</td><td>10과 같거나 작은 수</td><td>10, 9, 8…</td></tr><tr><td>10 초과</td><td>10보다 큰 수</td><td>11, 12…</td></tr><tr><td>10 미만</td><td>10보다 작은 수</td><td>9, 8…</td></tr></table>
<p>수직선에는 포함하면 <b>●(색칠한 점)</b>, 포함하지 않으면 <b>○(빈 점)</b>으로 나타내요.</p>
<div class="eg"><div class="egt">예시</div>15 이상 20 미만인 자연수 → 15, 16, 17, 18, 19 (20은 빠져요)</div>
<div class="warn">'미만'과 '이하'를 헷갈리기 쉬워요. 경계에 있는 수가 들어가는지 꼭 따져 보세요.</div>`,
gen(lv){const lo=R(20,60),hi=lo+R(4,9);const LO=[['이상',x=>x>=lo],['초과',x=>x>lo]],HI=[['이하',x=>x<=hi],['미만',x=>x<hi]];
  let desc,f;if(lv===1){if(rnd()<.5){const k=pick(LO);desc=`${lo} ${k[0]}`;f=k[1]}else{const k=pick(HI);desc=`${hi} ${k[0]}`;f=k[1]}}
  else{const a=pick(LO),b=pick(HI);desc=`${lo} ${a[0]} ${hi} ${b[0]}`;f=x=>a[1](x)&&b[1](x)}
  const set=new Set([lo,hi]);while(set.size<(lv===3?10:8))set.add(R(lo-5,hi+5));const arr=shuffle([...set]);const ok=arr.filter(f).sort((x,y)=>x-y);
  return prob(`다음 수 중에서 <b>${desc}</b>인 수는 몇 개인가요?<div class="numset">${arr.map(x=>`<span>${x}</span>`).join('')}</div>`,num(ok.length,'개'),
   `이상·이하는 경계의 수를 포함하고, 초과·미만은 포함하지 않아요.<br>${desc}인 수: ${ok.length?ok.join(', '):'없음'} → <b>${ok.length}개</b>`)}},
{id:'a2',title:'올림, 버림, 반올림',key:'올림: 아래 수를 올려요 · 버림: 아래 수를 0으로 · 반올림: 바로 아래 숫자가 0~4면 버리고 5~9면 올려요',
ex:()=>`<p>구하려는 자리 <b>아래</b>를 보고 정해요. (예: 3427을 백의 자리까지)</p>
<table class="t"><tr><th>방법</th><th>하는 법</th><th>3427 →</th></tr><tr><td>올림</td><td>아래 수가 0이 아니면 백의 자리를 1 크게</td><td>3500</td></tr><tr><td>버림</td><td>아래 수를 모두 0으로</td><td>3400</td></tr><tr><td>반올림</td><td>바로 아래 숫자(십의 자리 2)가 0~4 → 버림</td><td>3400</td></tr></table>
<div class="eg"><div class="egt">소수도 똑같아요</div>2.765를 반올림하여 소수 첫째 자리까지 → 바로 아래 숫자 6 → 올려서 <b>2.8</b></div>
<div class="warn">반올림할 때 아래 <b>모든</b> 숫자가 아니라 <b>바로 아래 한 자리</b>만 봐요.</div>`,
gen(lv){const how=pick(['올림','버림','반올림']);
  if(lv<3){let n,p;const places=lv===1?[10,100]:[10,100,1000];do{n=lv===1?R(101,9999):R(1001,99999);p=pick(places)}while(n%p===0||n<p);
    const nm={10:'십의 자리',100:'백의 자리',1000:'천의 자리'}[p];const res=how==='올림'?Math.ceil(n/p)*p:how==='버림'?Math.floor(n/p)*p:Math.round(n/p)*p;const dg=Math.floor((n%p)/(p/10));
    return prob(`<b>${N(n)}</b>을(를) <b>${how}</b>하여 <b>${nm}까지</b> 나타내세요.`,num(res),
     how==='반올림'?`${nm} 바로 아래 숫자는 <b>${dg}</b> → ${dg>=5?'5 이상이라 올려요':'4 이하라 버려요'} → <b>${N(res)}</b>`:how==='올림'?`${nm} 아래 수 ${n%p}이(가) 0이 아니므로 ${nm}를 1 올리고 아래는 0 → <b>${N(res)}</b>`:`${nm} 아래 수를 모두 0으로 → <b>${N(res)}</b>`)}
  let n;do{n=R(1001,9999)}while(n%10===0);const p=pick([100,10]);const nm=p===100?'소수 첫째 자리':'소수 둘째 자리';
  const r=how==='올림'?Math.ceil(n/p)*p:how==='버림'?Math.floor(n/p)*p:Math.round(n/p)*p;const dg=Math.floor((n%p)/(p/10));
  return prob(`<b>${D(n/1000)}</b>을(를) <b>${how}</b>하여 <b>${nm}까지</b> 나타내세요.`,num(r/1000),
   how==='반올림'?`${nm} 바로 아래 숫자는 <b>${dg}</b> → ${dg>=5?'올려요':'버려요'} → <b>${D(r/1000)}</b>`:how==='올림'?`${nm} 아래가 0이 아니므로 ${nm}를 1 올려요 → <b>${D(r/1000)}</b>`:`${nm} 아래를 버려요 → <b>${D(r/1000)}</b>`)}},
{id:'a3',title:'어림하기 활용',key:'모자라면 안 될 때는 <b>올림</b>, 다 채운 것만 셀 때는 <b>버림</b>',
ex:()=>`<p>생활 속 문제에서는 어떤 어림 방법이 맞는지 <b>상황</b>을 보고 골라요.</p>
<div class="eg"><div class="egt">올림을 쓰는 경우</div>4370원짜리 물건을 1000원짜리 지폐로만 산다면? 4000원은 모자라요 → 올림 → <b>5000원</b></div>
<div class="eg"><div class="egt">버림을 쓰는 경우</div>귤 247개를 10개씩 상자에 담아 팔면? 7개는 상자를 못 채워요 → 버림 → <b>240개</b></div>`,
gen(lv){const k=R(0,2);
  if(k===0){const n=R(lv===1?1100:10100,lv===1?9900:49900);const p=lv===1?1000:pick([1000,10000]);if(n%p===0)return this.gen(lv);const res=Math.ceil(n/p)*p;
    return prob(`${N(n)}원짜리 물건을 <b>${N(p)}원짜리 지폐로만</b> 산다면 최소 얼마를 내야 하나요?`,num(res,'원'),`${N(p)}원짜리 지폐로 ${N(Math.floor(n/p)*p)}원을 내면 모자라요. 모자라면 안 되니 <b>올림</b> → <b>${N(res)}원</b>`)}
  if(k===1){const box=lv===3?100:10,n=R(box+1,box*60);if(n%box===0)return this.gen(lv);const res=Math.floor(n/box)*box;
    return prob(`귤 ${N(n)}개를 한 상자에 ${box}개씩 담아서 판다면, 최대 몇 개까지 팔 수 있나요?`,num(res,'개'),`${box}개가 안 되는 나머지는 상자를 채울 수 없어요 → <b>버림</b> → <b>${N(res)}개</b>`)}
  const n=R(lv===1?120:1200,lv===1?990:9900),p=lv===1?100:1000;if(n%p===0)return this.gen(lv);const res=Math.floor(n/p)*p;
  return prob(`동전 ${N(n)}원을 ${N(p)}원짜리 지폐로 바꾸려고 해요. 최대 얼마까지 바꿀 수 있나요?`,num(res,'원'),`${N(p)}원이 안 되는 나머지 동전은 바꿀 수 없어요 → <b>버림</b> → <b>${N(res)}원</b>`)}}
]);

function mixedImp(w,a,b){return w*b+a}
U('s52','2','분수의 곱셈',[
{id:'b1',title:'(분수) × (자연수)',book:'95단계',key:'분자에 자연수를 곱해요. 약분할 수 있으면 먼저 약분하면 편해요',
ex:()=>`<p>${fr(2,5)} × 3은 ${fr(2,5)}를 3번 더한 것과 같아요.</p><div class="fig">${svgFracBar(6,5,'')}</div>
<div class="eg">${fr(2,5)} × 3 = ${fr('2 × 3',5)} = ${fr(6,5)} = <b>1${fr(1,5)}</b></div>
<div class="eg"><div class="egt">대분수 × 자연수</div>1${fr(1,4)} × 2 = ${fr(5,4)} × 2 = ${fr(10,4)} = <b>2${fr(1,2)}</b> &nbsp;<small>(대분수는 가분수로 바꿔서)</small></div>
<div class="warn">분모에는 곱하지 않아요! ${fr(2,5)} × 3 ≠ ${fr(6,15)}</div>`,
gen(lv){const [a,b]=coprimeFrac(2,lv===1?9:12),k=R(2,lv===1?9:15);
  if(lv===1)return prob(`다음을 계산하세요.<div class="big">${fr(a,b)} × ${k}</div>`,F(a*k,b),`분자에 자연수를 곱해요: ${fr(a,b)} × ${k} = ${fr(a+' × '+k,b)} = ${fr(a*k,b)}${tail(a*k,b)}`);
  const w=R(1,lv===2?3:5),im=mixedImp(w,a,b);
  return prob(`다음을 계산하세요.<div class="big">${w}${fr(a,b)} × ${k}</div>`,F(im*k,b),ol([`대분수를 가분수로: ${w}${fr(a,b)} = ${fr(im,b)}`,`${fr(im,b)} × ${k} = ${fr(im+' × '+k,b)} = ${fr(im*k,b)}${tail(im*k,b)}`]))}},
{id:'b2',title:'(자연수) × (분수)',book:'95단계',key:'자연수와 분자를 곱해요. 자연수 × 진분수는 원래 자연수보다 작아져요',
ex:()=>`<p>6 × ${fr(2,3)}은 '6의 ${fr(2,3)}'이라는 뜻이에요. 6을 3묶음으로 나눈 것 중 2묶음 → 4</p>
<div class="eg">6 × ${fr(2,3)} = ${fr('6 × 2',3)} = ${fr(12,3)} = <b>4</b></div>
<div class="eg"><div class="egt">약분 먼저 하기</div>6과 3을 3으로 약분하면 → 2 × 2 = <b>4</b> (수가 작아져서 편해요)</div>
<div class="warn">진분수를 곱하면 결과가 원래 수보다 <b>작아져요</b>. 답이 더 커졌다면 다시 확인!</div>`,
gen(lv){const [a,b]=coprimeFrac(2,lv===1?9:12);let k=R(2,lv===1?12:20);if(lv===1&&rnd()<.5)k=b*R(1,4);
  if(lv<3)return prob(`다음을 계산하세요.<div class="big">${k} × ${fr(a,b)}</div>`,F(k*a,b),`${k} × ${fr(a,b)} = ${fr(k+' × '+a,b)} = ${fr(k*a,b)}${tail(k*a,b)}`);
  const w=R(1,4),im=mixedImp(w,a,b);return prob(`다음을 계산하세요.<div class="big">${k} × ${w}${fr(a,b)}</div>`,F(k*im,b),ol([`${w}${fr(a,b)} = ${fr(im,b)}`,`${k} × ${fr(im,b)} = ${fr(k+' × '+im,b)} = ${fr(k*im,b)}${tail(k*im,b)}`]))}},
{id:'b3',title:'(진분수) × (진분수)',book:'96~97단계',key:'분자는 분자끼리, 분모는 분모끼리 곱해요',
ex:()=>`<p>${fr(2,3)} × ${fr(3,4)}은 '${fr(3,4)}의 ${fr(2,3)}'이에요. 넓이 그림으로 보면:</p><div class="fig">${svgArea(2,3,3,4)}</div>
<div class="eg">${fr(2,3)} × ${fr(3,4)} = ${fr('2 × 3','3 × 4')} = ${fr(6,12)} = <b>${fr(1,2)}</b></div>
<div class="eg"><div class="egt">단위분수끼리</div>${fr(1,3)} × ${fr(1,5)} = ${fr(1,15)} (분모끼리만 곱하면 돼요)</div>
<div class="warn">곱셈은 통분하지 않아요! 통분은 덧셈·뺄셈에서만.</div>`,
gen(lv){if(lv===1){const b=R(2,9),d=R(2,9);return prob(`다음을 계산하세요.<div class="big">${fr(1,b)} × ${fr(1,d)}</div>`,F(1,b*d),mulLine([[1,b],[1,d]]))}
  const n=lv===2?2:3;const fs=[];for(let i=0;i<n;i++)fs.push(coprimeFrac(2,lv===2?10:9));
  const Nn=fs.reduce((p,f)=>p*f[0],1),Dd=fs.reduce((p,f)=>p*f[1],1);return prob(`다음을 계산하세요.<div class="big">${fs.map(fx).join(' × ')}</div>`,F(Nn,Dd),mulLine(fs)+`<div class="mini-note">곱하기 전에 분자와 분모를 서로 약분하면 계산이 쉬워져요.</div>`)}},
{id:'b4',title:'대분수의 곱셈, 세 분수의 곱셈',book:'96~97단계',key:'대분수는 꼭 가분수로 바꾼 뒤 곱해요',
ex:()=>`<div class="eg">1${fr(1,2)} × 2${fr(2,3)} = ${fr(3,2)} × ${fr(8,3)} = ${fr(24,6)} = <b>4</b></div>
<div class="warn">자연수끼리, 분수끼리 따로 곱하면 틀려요! 1${fr(1,2)} × 2${fr(2,3)} ≠ 2${fr(2,6)}</div>
<div class="eg"><div class="egt">세 분수의 곱셈</div>${fr(1,2)} × ${fr(3,5)} × ${fr(5,6)} = ${fr('1 × 3 × 5','2 × 5 × 6')} = ${fr(15,60)} = <b>${fr(1,4)}</b></div>`,
gen(lv){const m=()=>{const [a,b]=coprimeFrac(2,7),w=R(1,3);return {h:`${w}${fr(a,b)}`,f:[w*b+a,b],c:`${w}${fr(a,b)} = ${fr(w*b+a,b)}`}};const p=()=>{const [a,b]=coprimeFrac(2,9);return {h:fr(a,b),f:[a,b]}};
  const items=lv===1?shuffle([m(),p()]):lv===2?[m(),m()]:[m(),p(),m()];const fs=items.map(i=>i.f);const Nn=fs.reduce((x,f)=>x*f[0],1),Dd=fs.reduce((x,f)=>x*f[1],1);
  return prob(`다음을 계산하세요.<div class="big">${items.map(i=>i.h).join(' × ')}</div>`,F(Nn,Dd),ol([`대분수를 가분수로: ${items.filter(i=>i.c).map(i=>i.c).join(', ')}`,mulLine(fs)]))}}
]);

function symKind(l,p){return l&&p?2:l?0:p?1:3}
U('s52','3','합동과 대칭',[
{id:'c1',title:'합동인 도형의 성질',key:'포개었을 때 완전히 겹치는 두 도형 → <b>대응변의 길이</b>와 <b>대응각의 크기</b>가 같아요',
ex:()=>`<p>모양과 크기가 같아서 포개었을 때 완전히 겹치는 두 도형을 <b>서로 합동</b>이라고 해요. 겹치는 점·변·각을 대응점·대응변·대응각이라고 해요.</p><div class="fig">${svgTri()}</div>
<div class="eg">삼각형 ㄱㄴㄷ과 삼각형 ㄹㅁㅂ이 합동이면<br>ㄱ↔ㄹ, ㄴ↔ㅁ, ㄷ↔ㅂ (이름을 쓴 <b>순서대로</b> 대응해요)<br>변 ㄴㄷ = 변 ㅁㅂ, 각 ㄱㄴㄷ = 각 ㄹㅁㅂ</div>
<div class="warn">그림이 뒤집혀 있거나 돌아가 있으면 위치로 찾지 말고 <b>이름 순서</b>로 대응점을 찾아요.</div>`,
gen(lv){const t=lv===1?R(0,1):lv===2?R(1,2):R(2,3);const fig=`<div class="fig">${svgTri()}</div>`,head=`삼각형 ㄱㄴㄷ과 삼각형 ㄹㅁㅂ은 서로 합동이에요.`;
  if(t===0){const sides=[['ㄱㄴ','ㄹㅁ'],['ㄴㄷ','ㅁㅂ'],['ㄷㄱ','ㅂㄹ']];const s=pick(sides),v=R(4,15);return prob(`${head}${fig}변 ${s[0]}의 길이가 ${v} cm일 때, <b>변 ${s[1]}</b>의 길이는 몇 cm인가요?`,num(v,'cm'),`변 ${s[0]}과(와) 변 ${s[1]}은(는) 대응변이에요. 대응변의 길이는 같아요 → <b>${v} cm</b>`)}
  if(t===1){const a=R(30,80),b=R(30,150-a);const c=180-a-b;return prob(`${head}${fig}각 ㄱㄴㄷ = ${a}°, 각 ㄴㄷㄱ = ${b}°일 때, <b>각 ㅂㄹㅁ</b>은 몇 도인가요?`,num(c,'°'),ol([`각 ㅂㄹㅁ의 대응각은 각 ㄷㄱㄴ이에요.`,`삼각형 세 각의 합은 180°: 180° − ${a}° − ${b}° = <b>${c}°</b>`]))}
  if(t===2){const p=R(5,14),q=R(6,15),r=R(5,14);return prob(`${head}${fig}변 ㄱㄴ = ${p} cm, 변 ㅁㅂ = ${q} cm, 변 ㄷㄱ = ${r} cm예요. <b>삼각형 ㄹㅁㅂ의 둘레</b>는 몇 cm인가요?`,num(p+q+r,'cm'),ol([`변 ㄹㅁ = 변 ㄱㄴ = ${p} cm, 변 ㅂㄹ = 변 ㄷㄱ = ${r} cm`,`둘레 = ${p} + ${q} + ${r} = <b>${p+q+r} cm</b>`]))}
  let a,b,c;do{a=R(60,130);b=R(60,130);c=R(50,130)}while(360-a-b-c<40||360-a-b-c>150);const d=360-a-b-c;
  return prob(`사각형 ㄱㄴㄷㄹ과 사각형 ㅁㅂㅅㅇ은 서로 합동이에요. 각 ㄱ = ${a}°, 각 ㄴ = ${b}°, 각 ㄷ = ${c}°일 때, <b>각 ㅇ</b>은 몇 도인가요?`,num(d,'°'),ol([`각 ㅇ의 대응각은 각 ㄹ이에요 (ㄱ↔ㅁ, ㄴ↔ㅂ, ㄷ↔ㅅ, ㄹ↔ㅇ).`,`사각형 네 각의 합은 360°: 360° − ${a}° − ${b}° − ${c}° = <b>${d}°</b>`]))}},
{id:'c2',title:'선대칭도형과 점대칭도형',key:'선대칭: 한 직선으로 접어서 겹쳐요 · 점대칭: 한 점을 중심으로 180° 돌려서 겹쳐요',
ex:()=>`<p><b>선대칭도형</b>: 한 직선을 따라 접었을 때 완전히 겹치는 도형. 그 직선을 <b>대칭축</b>이라고 해요.<br><b>점대칭도형</b>: 한 점을 중심으로 180° 돌렸을 때 처음 도형과 완전히 겹치는 도형. 그 점을 <b>대칭의 중심</b>이라고 해요.</p>
<table class="t"><tr><th>도형</th><th>대칭축 수</th><th>점대칭?</th></tr>${SHAPES.map(s=>`<tr><td>${s.n}</td><td>${s.l===Infinity?'셀 수 없이 많아요':s.l+'개'}</td><td>${s.p?'○':'×'}</td></tr>`).join('')}</table>
<div class="warn">평행사변형은 선대칭도형이 <b>아니에요</b>(접어서 안 겹쳐요). 하지만 점대칭도형이에요.</div>`,
gen(lv){if(lv===1||rnd()<.4){const s=pick(SHAPES.filter(x=>x.l!==Infinity));return prob(`<b>${s.n}</b>의 대칭축은 모두 몇 개인가요? <span class="muted small">(없으면 0)</span>`,num(s.l,'개'),`${s.n}의 대칭축은 <b>${s.l}개</b>예요.${s.n.startsWith('정')?` 정다각형의 대칭축 수는 변의 수와 같아요.`:''}`)}
  if(rnd()<.5){const s=pick(SHAPES);const k=symKind(s.l,s.p);return prob(`<b>${s.n}</b>은(는) 어떤 도형인가요?`,mc(SYM_OPTS[k],SYM_OPTS.filter((_,i)=>i!==k),true),`${s.n}: 대칭축 ${s.l===Infinity?'무수히 많음':s.l+'개'}, 점대칭도형 ${s.p?'맞음':'아님'} → <b>${SYM_OPTS[k]}</b>`)}
  const L=pick(Object.keys(LETTERS)),[l,p]=LETTERS[L],k=symKind(l,p);return prob(`알파벳 모양을 보고 고르세요.<div class="letter">${L}</div>`,mc(SYM_OPTS[k],SYM_OPTS.filter((_,i)=>i!==k),true),`'${L}'은(는) ${l?'접어서 겹치는 선이 있어요':'접어서 겹치는 선이 없어요'}. 180° 돌리면 ${p?'겹쳐요':'겹치지 않아요'}. → <b>${SYM_OPTS[k]}</b>`)}},
{id:'c3',title:'대칭도형의 성질',key:'대응점끼리 이은 선분을 대칭축은 <b>수직으로 반</b>으로, 대칭의 중심은 <b>반</b>으로 나눠요',
ex:()=>`<div class="eg"><div class="egt">선대칭도형</div>대칭축은 대응점끼리 이은 선분과 <b>수직</b>으로 만나고, 그 선분을 <b>둘로 똑같이</b> 나눠요.<br>점 ㄱ에서 대칭축까지 3 cm → 점 ㄱ과 대응점 사이는 <b>6 cm</b></div>
<div class="eg"><div class="egt">점대칭도형</div>대칭의 중심은 대응점끼리 이은 선분을 <b>둘로 똑같이</b> 나눠요.<br>중심에서 점 ㄴ까지 4 cm → 점 ㄴ과 대응점 사이는 <b>8 cm</b></div>
<p>대응변의 길이와 대응각의 크기는 서로 같아요.</p>`,
gen(lv){const t=lv===1?R(0,1):R(0,3);const v=lv===3?R(5,95)/10:R(2,15);
  if(t===0)return prob(`선대칭도형에서 점 ㄱ과 대칭축 사이의 거리가 ${D(v)} cm예요. 점 ㄱ과 <b>그 대응점 사이의 거리</b>는 몇 cm인가요?`,num(v*2,'cm'),`대칭축은 대응점을 이은 선분을 반으로 나눠요 → ${D(v)} × 2 = <b>${D(v*2)} cm</b>`);
  if(t===1)return prob(`점대칭도형에서 대칭의 중심 ㅇ과 점 ㄴ 사이의 거리가 ${D(v)} cm예요. 점 ㄴ과 <b>그 대응점을 이은 선분</b>의 길이는 몇 cm인가요?`,num(v*2,'cm'),`대칭의 중심은 대응점을 이은 선분을 반으로 나눠요 → ${D(v)} × 2 = <b>${D(v*2)} cm</b>`);
  if(t===2){const s=R(4,20)*2;return prob(`점대칭도형에서 점 ㄷ과 그 대응점을 이은 선분의 길이가 ${s} cm예요. <b>대칭의 중심에서 점 ㄷ까지</b>는 몇 cm인가요?`,num(s/2,'cm'),`선분을 반으로 나누면 ${s} ÷ 2 = <b>${s/2} cm</b>`)}
  const a=R(4,15),b=R(4,15);return prob(`평행사변형은 점대칭도형이에요. 이웃한 두 변의 길이가 ${a} cm, ${b} cm일 때 <b>둘레</b>는 몇 cm인가요?`,num(2*(a+b),'cm'),`대응변의 길이가 같으므로 둘레 = (${a} + ${b}) × 2 = <b>${2*(a+b)} cm</b>`)}}
]);

function rdec(s,minI,maxI){let m;do{m=R(minI,maxI)}while(m%10===0);return m} // 소수 자리수 s, 정수 m (끝자리 0 아님)
U('s52','4','소수의 곱셈',[
{id:'d1',title:'(소수) × (자연수)',book:'98단계',key:'자연수처럼 곱한 뒤, 소수점 아래 자리 수만큼 소수점을 찍어요',
ex:()=>`<p>0.3 × 4는 0.3을 4번 더한 것 → 0.1이 3 × 4 = 12개 → <b>1.2</b></p>
<div class="eg"><div class="egt">세로셈 방법</div>1.25 × 3 → 125 × 3 = 375 → 1.25는 소수 두 자리이므로 → <b>3.75</b></div>
<div class="eg"><div class="egt">분수 방법</div>1.25 × 3 = ${fr(125,100)} × 3 = ${fr(375,100)} = 3.75</div>
<div class="warn">소수점은 곱하는 소수의 소수점 아래 자리 수만큼 <b>오른쪽 끝에서부터</b> 세어 찍어요.</div>`,
gen(lv){const s=lv===1?1:2;const m=s===1?rdec(1,2,99):rdec(2,101,999),k=lv===3?R(11,30):R(2,9);const x=m/P10(s);
  return prob(`다음을 계산하세요.<div class="big">${D(x)} × ${k}</div>`,num(m*k/P10(s)),ol([`자연수처럼 곱해요: ${m} × ${k} = ${m*k}`,`${D(x)}는 소수 ${s}자리 → 소수점을 ${s}자리 왼쪽으로: <b>${D(m*k/P10(s))}</b>`]))}},
{id:'d2',title:'(자연수) × (소수)',book:'98단계',key:'곱셈은 순서를 바꿔도 같아요. 자연수처럼 곱하고 소수점을 찍어요',
ex:()=>`<p>5 × 0.7은 '5의 0.7배' → 5보다 작아져요.</p><div class="eg">5 × 0.7 → 5 × 7 = 35 → 소수 한 자리 → <b>3.5</b></div>
<div class="eg">12 × 1.4 → 12 × 14 = 168 → <b>16.8</b> (1보다 큰 소수를 곱하면 커져요)</div>
<div class="warn">1보다 작은 소수를 곱하면 원래 수보다 작아져요. 답의 크기를 어림해서 확인해요.</div>`,
gen(lv){const s=lv===1?1:2;const m=s===1?rdec(1,2,99):rdec(2,11,999),k=lv===3?R(11,40):R(2,15);const x=m/P10(s);
  return prob(`다음을 계산하세요.<div class="big">${k} × ${D(x)}</div>`,num(m*k/P10(s)),ol([`${k} × ${m} = ${m*k}`,`소수 ${s}자리 → <b>${D(m*k/P10(s))}</b>`]))}},
{id:'d3',title:'(소수) × (소수)',book:'99단계',key:'곱의 소수점 아래 자리 수 = 두 수의 소수점 아래 자리 수의 <b>합</b>',
ex:()=>`<div class="eg">0.3 × 0.4 → 3 × 4 = 12 → 1자리 + 1자리 = 2자리 → <b>0.12</b></div>
<div class="eg">2.4 × 1.35 → 24 × 135 = 3240 → 1자리 + 2자리 = 3자리 → 3.240 = <b>3.24</b></div>
<div class="warn">자리가 모자라면 앞에 0을 채워요: 0.2 × 0.3 = 0.06 (0.6이 아니에요)</div>`,
gen(lv){let m1,s1,m2,s2;if(lv===1){m1=R(1,9);m2=R(1,9);s1=s2=1}else if(lv===2){m1=rdec(1,11,99);m2=rdec(1,11,99);s1=s2=1}else{m1=rdec(2,101,999);s1=2;m2=rdec(1,11,59);s2=1}
  const pr=m1*m2,s=s1+s2;return prob(`다음을 계산하세요.<div class="big">${D(m1/P10(s1))} × ${D(m2/P10(s2))}</div>`,num(pr/P10(s)),ol([`자연수처럼: ${m1} × ${m2} = ${pr}`,`소수점 아래 자리 수: ${s1} + ${s2} = ${s}자리 → <b>${D(pr/P10(s))}</b>`]))}},
{id:'d4',title:'곱의 소수점 위치',book:'98~99단계',key:'× 10, 100, 1000 → 소수점이 오른쪽으로 · × 0.1, 0.01 → 왼쪽으로',
ex:()=>`<table class="t"><tr><td>3.14 × 10 = 31.4</td><td>3.14 × 0.1 = 0.314</td></tr><tr><td>3.14 × 100 = 314</td><td>3.14 × 0.01 = 0.0314</td></tr><tr><td>3.14 × 1000 = 3140</td><td>3.14 × 0.001 = 0.00314</td></tr></table>
<div class="eg"><div class="egt">곱셈식 이용하기</div>23 × 47 = 1081이면 2.3 × 0.47은? 소수 1자리 + 2자리 = 3자리 → <b>1.081</b></div>`,
gen(lv){if(lv===1||rnd()<.4){const s=R(1,2),m=rdec(s,s===1?11:101,s===1?999:9999),x=m/P10(s);const mul=pick(lv===1?[10,100,1000]:[10,100,1000,0.1,0.01]);const res=mul>=1?m*mul/P10(s):m/(P10(s)*Math.round(1/mul));
    return prob(`다음을 계산하세요.<div class="big">${D(x)} × ${D(mul)}</div>`,num(res),mul>=1?`× ${D(mul)}이면 소수점을 오른쪽으로 ${String(mul).length-1}칸 옮겨요 → <b>${D(res)}</b>`:`× ${D(mul)}이면 소수점을 왼쪽으로 ${mul===0.1?1:2}칸 옮겨요 → <b>${D(res)}</b>`)}
  const A=R(12,98),B=R(12,98),Pd=A*B;let s1,s2;do{s1=R(0,2);s2=R(0,2)}while(s1+s2===0);const a=A/P10(s1),b=B/P10(s2);
  return prob(`${A} × ${B} = ${Pd}이에요. 이것을 이용하여 계산하세요.<div class="big">${D(a)} × ${D(b)}</div>`,num(Pd/P10(s1+s2)),`소수점 아래 자리 수가 ${s1} + ${s2} = ${s1+s2}자리 → ${Pd}에서 소수점을 왼쪽으로 ${s1+s2}칸 → <b>${D(Pd/P10(s1+s2))}</b>`)}}
]);

const CUBE_FACTS=[['직육면체의 <b>면</b>은 모두 몇 개인가요?',6,'개'],['직육면체의 <b>모서리</b>는 모두 몇 개인가요?',12,'개'],['직육면체의 <b>꼭짓점</b>은 모두 몇 개인가요?',8,'개'],
 ['직육면체의 겨냥도에서 <b>보이지 않는 모서리</b>는 몇 개인가요?',3,'개'],['직육면체의 겨냥도에서 <b>보이는 모서리</b>는 몇 개인가요?',9,'개'],['직육면체의 겨냥도에서 <b>보이지 않는 꼭짓점</b>은 몇 개인가요?',1,'개'],['직육면체의 겨냥도에서 <b>보이는 면</b>은 몇 개인가요?',3,'개'],
 ['직육면체에서 한 면과 <b>평행한 면</b>은 몇 개인가요?',1,'개'],['직육면체에서 한 면과 <b>수직인 면</b>은 몇 개인가요?',4,'개'],['직육면체에서 한 꼭짓점에서 만나는 <b>면</b>은 몇 개인가요?',3,'개']];
const CUBE_MC=[['옳은 것을 고르세요.','정육면체는 직육면체라고 할 수 있어요.',['직육면체는 정육면체라고 할 수 있어요.','직육면체의 면은 모두 정사각형이에요.','정육면체의 모서리 길이는 서로 달라요.']],
 ['겨냥도에서 보이지 않는 모서리는 어떻게 그리나요?','점선으로 그려요.',['실선으로 그려요.','그리지 않아요.','두꺼운 선으로 그려요.']],
 ['직육면체의 전개도에 대한 설명으로 옳은 것은?','접었을 때 서로 겹치는 면이 없어야 해요.',['면이 5개예요.','마주 보는 면의 모양과 크기가 달라요.','잘린 모서리도 실선으로 그려요.']]];
U('s52','5','직육면체',[
{id:'e1',title:'직육면체와 정육면체',key:'직육면체: 직사각형 6개 · 정육면체: 정사각형 6개 · 면 6, 모서리 12, 꼭짓점 8',
ex:()=>`<div class="fig">${svgCuboid(null,null,null)}</div><p>직사각형 6개로 둘러싸인 도형을 <b>직육면체</b>, 정사각형 6개로 둘러싸인 도형을 <b>정육면체</b>라고 해요.</p>
<table class="t"><tr><th>면</th><th>모서리</th><th>꼭짓점</th></tr><tr><td>6개</td><td>12개</td><td>8개</td></tr></table>
<div class="key">겨냥도: 보이는 모서리는 <b>실선</b>(9개), 보이지 않는 모서리는 <b>점선</b>(3개)</div>
<p>마주 보는 면은 <b>평행</b>해요(3쌍). 한 면과 만나는 면 4개는 그 면과 <b>수직</b>이에요.</p>
<div class="warn">정육면체는 직육면체예요. 하지만 직육면체는 정육면체가 아닐 수도 있어요.</div>`,
gen(lv){if(lv>=2&&rnd()<.4){const [q,a,w]=pick(CUBE_MC);return prob(q,mc(a,w,true),`정답: <b>${a}</b>`)}const [q,a,u]=pick(CUBE_FACTS);return prob(q,num(a,u),`정답은 <b>${a}${u}</b>예요. 그림을 떠올리며 하나씩 세어 보세요.`)}},
{id:'e2',title:'모서리 길이의 합',key:'직육면체: (가로 + 세로 + 높이) × 4 · 정육면체: 한 모서리 × 12',
ex:()=>`<div class="fig">${svgCuboid(5,3,4)}</div><p>직육면체에는 같은 길이의 모서리가 <b>4개씩</b> 3종류 있어요.</p>
<div class="eg">(5 + 3 + 4) × 4 = 12 × 4 = <b>48 cm</b></div><div class="eg"><div class="egt">정육면체</div>모서리 12개 길이가 모두 같아요: 한 모서리 6 cm → 6 × 12 = <b>72 cm</b></div>`,
gen(lv){const a=R(3,15),b=R(2,12),c=R(2,12);const t=lv===1?R(0,1):lv===2?R(0,2):R(2,3);
  if(t===0)return prob(`다음 직육면체의 <b>모든 모서리 길이의 합</b>은 몇 cm인가요?<div class="fig">${svgCuboid(a,b,c)}</div>`,num(4*(a+b+c),'cm'),`(${a} + ${b} + ${c}) × 4 = ${a+b+c} × 4 = <b>${4*(a+b+c)} cm</b>`);
  if(t===1)return prob(`한 모서리의 길이가 ${a} cm인 <b>정육면체</b>의 모든 모서리 길이의 합은 몇 cm인가요?`,num(12*a,'cm'),`정육면체 모서리는 12개 → ${a} × 12 = <b>${12*a} cm</b>`);
  if(t===2)return prob(`모든 모서리 길이의 합이 ${12*a} cm인 <b>정육면체</b>의 한 모서리는 몇 cm인가요?`,num(a,'cm'),`${12*a} ÷ 12 = <b>${a} cm</b>`);
  return prob(`가로 ${a} cm, 세로 ${b} cm인 직육면체의 모든 모서리 길이의 합이 ${4*(a+b+c)} cm예요. <b>높이</b>는 몇 cm인가요?`,num(c,'cm'),ol([`가로+세로+높이 = ${4*(a+b+c)} ÷ 4 = ${a+b+c}`,`높이 = ${a+b+c} − ${a} − ${b} = <b>${c} cm</b>`]))}},
{id:'e3',title:'정육면체의 전개도',key:'한 줄로 이어진 4개의 면에서는 <b>한 칸 건너</b> 있는 면끼리 마주 봐요',
ex:()=>`<div class="fig">${svgNet(['가','나','다','라','마','바'],1,1)}</div><p>전개도를 접으면 <b>서로 마주 보는(평행한) 면</b>은 만나지 않아요.</p>
<div class="eg">가로로 이어진 가·나·다·라에서 가↔다, 나↔라가 마주 봐요.<br>위의 마와 아래의 바도 서로 마주 봐요.</div>
<div class="warn">바로 옆에 붙어 있는 면은 마주 보는 면이 될 수 없어요(접으면 수직으로 만나요).</div>`,
gen(lv){if(lv===1&&rnd()<.3){const [q,a,w]=pick(CUBE_MC);return prob(q,mc(a,w,true),`정답: <b>${a}</b>`)}
  const lab=shuffle(['가','나','다','라','마','바']),tc=R(0,3),bc=R(0,3);const opp={};const pairs=[[0,2],[1,3],[4,5]];pairs.forEach(([x,y])=>{opp[lab[x]]=lab[y];opp[lab[y]]=lab[x]});
  const ask=pick(lab);return prob(`전개도를 접어서 정육면체를 만들 때, 면 <b>${ask}</b>와(과) <b>마주 보는 면</b>은?<div class="fig">${svgNet(lab,tc,bc)}</div>`,mc(opp[ask],lab.filter(x=>x!==ask&&x!==opp[ask])),
   `가로로 이어진 네 면에서는 한 칸 건너 있는 면끼리, 위·아래에 붙은 두 면끼리 마주 봐요. → <b>${opp[ask]}</b>`)}}
]);

const LIKELY=['불가능하다','~아닐 것 같다','반반이다','~일 것 같다','확실하다'];
const EVENTS=[['주사위를 굴렸을 때 7의 눈이 나올 가능성',0],['동전을 던졌을 때 그림 면이 나올 가능성',2],['1월 다음에 2월이 올 가능성',4],['주사위를 굴렸을 때 1보다 큰 눈이 나올 가능성',3],['주사위를 굴렸을 때 6의 눈이 나올 가능성',1],['주사위를 굴렸을 때 짝수의 눈이 나올 가능성',2],['오늘이 화요일이면 내일이 수요일일 가능성',4],['계산기에 2 × 3 =을 눌렀을 때 7이 나올 가능성',0]];
U('s52','6','평균과 가능성',[
{id:'f1',title:'평균 구하기',key:'평균 = (자료 값을 모두 더한 수) ÷ (자료의 수)',
ex:()=>`<p>자료의 값을 고르게 하여 대표하는 값을 <b>평균</b>이라고 해요.</p><div class="eg">줄넘기 기록 12회, 15회, 9회, 16회<br>(12 + 15 + 9 + 16) ÷ 4 = 52 ÷ 4 = <b>13회</b></div>
<div class="key">높은 쪽에서 낮은 쪽으로 <b>옮겨서 고르게</b> 만든 값이라고 생각해도 돼요.</div><div class="warn">나누는 수는 '자료의 수'예요. 기록이 0인 날도 자료의 수에 포함해요.</div>`,
gen(lv){const n=lv===1?R(3,4):lv===2?R(4,5):R(5,6),A=R(lv===3?40:8,lv===3?95:30);let v;do{v=[];for(let i=0;i<n-1;i++)v.push(A+R(-7,7));v.push(n*A-v.reduce((a,b)=>a+b,0))}while(v[n-1]<1||Math.abs(v[n-1]-A)>12||(lv===3&&v.some(x=>x>100)));
  const ctx=pick([['독서 시간','분'],['줄넘기 기록','회'],['수학 점수','점'],['키 자란 길이','mm']]);if(lv<3&&ctx[0]==='수학 점수')ctx[0]='윗몸 일으키기 기록',ctx[1]='회';
  return prob(`${ctx[0]}의 <b>평균</b>을 구하세요.<table class="t" style="margin:10px auto"><tr>${v.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr><tr>${v.map(x=>`<td>${x}</td>`).join('')}</tr></table>`,num(A,ctx[1]),
   `(${v.join(' + ')}) ÷ ${n} = ${n*A} ÷ ${n} = <b>${A}${ctx[1]}</b>`)}},
{id:'f2',title:'평균 이용하기',key:'(모든 값의 합) = 평균 × 자료의 수',
ex:()=>`<div class="eg"><div class="egt">모르는 값 찾기</div>4회의 평균이 80점, 3회까지 75, 82, 79점이면 4회는?<br>합계 = 80 × 4 = 320 → 320 − (75 + 82 + 79) = <b>84점</b></div>
<div class="eg"><div class="egt">두 모둠 비교</div>평균이 같아도 사람 수가 다르면 합계가 달라요. 비교할 때는 평균을 써요.</div>`,
gen(lv){const n=lv===1?3:lv===2?4:5,A=R(lv===1?10:60,lv===1?40:90);let v;do{v=[];for(let i=0;i<n;i++)v.push(A+R(-9,9))}while(v.reduce((a,b)=>a+b,0)!==n*A?(v[n-1]+=n*A-v.reduce((a,b)=>a+b,0),v[n-1]<1||v[n-1]>100):false);
  const miss=v[n-1],known=v.slice(0,n-1),s=known.reduce((a,b)=>a+b,0);const u=lv===1?'회':'점';
  if(lv===3&&rnd()<.5)return prob(`${n-1}번의 시험 점수가 ${known.join('점, ')}점이에요. ${n}번 시험의 평균이 <b>${A}점 이상</b>이 되려면 마지막 시험에서 최소 몇 점을 받아야 하나요?`,num(miss,'점'),ol([`필요한 합계 = ${A} × ${n} = ${n*A}`,`${n*A} − ${s} = <b>${miss}점</b> 이상`]));
  return prob(`${n}명의 평균 기록이 <b>${A}${u}</b>일 때, <b>나머지 한 명</b>의 기록을 구하세요.<br>알고 있는 ${n-1}명의 기록: ${known.join(u+', ')}${u}`,num(miss,u),ol([`전체 합 = ${A} × ${n} = ${n*A}`,`나머지 = ${n*A} − (${known.join(' + ')}) = ${n*A} − ${s} = <b>${miss}${u}</b>`]))}},
{id:'f3',title:'일이 일어날 가능성',key:'불가능하다 = 0 · 반반이다 = ½ · 확실하다 = 1',
ex:()=>`<p>어떤 일이 일어날 가능성을 말이나 수로 나타낼 수 있어요.</p><table class="t"><tr>${LIKELY.map(x=>`<th>${x}</th>`).join('')}</tr><tr><td>0</td><td></td><td>${fr(1,2)}</td><td></td><td>1</td></tr></table>
<div class="eg">빨간 공만 4개 든 주머니에서 공 1개를 꺼낼 때<br>빨간 공일 가능성: <b>확실하다(1)</b> · 파란 공일 가능성: <b>불가능하다(0)</b></div>`,
gen(lv){if(rnd()<.5){const [e,k]=pick(EVENTS);return prob(`<b>${e}</b>을 말로 나타내면?`,mc(LIKELY[k],LIKELY.filter((_,i)=>i!==k)),`정답: <b>${LIKELY[k]}</b>`)}
  const r=R(0,6),b=r===0?R(1,6):pick([0,r,R(1,8)]);const k=b===0?4:r===0?0:r===b?2:r>b?3:1;
  if(lv>=2&&(k===0||k===2||k===4)){const vals=['0',fr(1,2),'1'];const ans=k===0?0:k===2?1:2;return prob(`빨간 공 ${r}개, 파란 공 ${b}개가 든 주머니에서 공 1개를 꺼낼 때, <b>빨간 공</b>이 나올 가능성을 <b>수</b>로 나타내면?`,mc(vals[ans],vals.filter((_,i)=>i!==ans)),`빨간 공 ${r}개, 파란 공 ${b}개 → ${LIKELY[k]} → <b>${vals[ans]}</b>`)}
  return prob(`빨간 공 ${r}개, 파란 공 ${b}개가 든 주머니에서 공 1개를 꺼낼 때, <b>빨간 공</b>이 나올 가능성은?`,mc(LIKELY[k],LIKELY.filter((_,i)=>i!==k)),`빨간 공 ${r}개, 파란 공 ${b}개 → <b>${LIKELY[k]}</b>`)}}
]);

U('s61','1','분수의 나눗셈',[
{id:'g1',title:'(자연수) ÷ (자연수)의 몫을 분수로',book:'101, 106단계',key:'■ ÷ ● = <span class="fr"><span class="nu">■</span><span class="de">●</span></span> (나누어지는 수가 분자, 나누는 수가 분모)',
ex:()=>`<p>1 ÷ 3은 1을 똑같이 3으로 나눈 하나 → ${fr(1,3)}<br>2 ÷ 3은 ${fr(1,3)}이 2개 → ${fr(2,3)}</p><div class="fig">${svgFracBar(2,3,'2 ÷ 3 = 2/3')}</div>
<div class="eg">7 ÷ 3 = ${fr(7,3)} = <b>2${fr(1,3)}</b> &nbsp; 6 ÷ 8 = ${fr(6,8)} = <b>${fr(3,4)}</b></div><div class="warn">분자와 분모 자리를 바꾸지 않게 조심! 3 ÷ 5 = ${fr(3,5)} (${fr(5,3)} 아님)</div>`,
gen(lv){let a,b;if(lv===1){b=R(2,9);a=R(1,b-1)}else if(lv===2){do{b=R(2,9);a=R(b+1,40)}while(a%b===0)}else{do{b=R(4,24);a=R(2,30)}while(a%b===0||gcd(a,b)===1)}
  return prob(`나눗셈의 몫을 분수로 나타내세요.<div class="big">${a} ÷ ${b}</div>`,F(a,b),`${a} ÷ ${b} = ${fr(a,b)}${tail(a,b)}`)}},
{id:'g2',title:'(분수) ÷ (자연수)',book:'102, 107단계',key:'÷ 자연수는 × <span class="fr"><span class="nu">1</span><span class="de">자연수</span></span>로 바꿔요',
ex:()=>`<div class="eg"><div class="egt">분자가 나누어떨어질 때</div>${fr(6,7)} ÷ 3 = ${fr('6 ÷ 3',7)} = <b>${fr(2,7)}</b></div>
<div class="eg"><div class="egt">나누어떨어지지 않을 때</div>${fr(3,4)} ÷ 2 = ${fr(3,4)} × ${fr(1,2)} = <b>${fr(3,8)}</b></div><div class="fig">${svgFracBar(3,8,'3/4을 반으로 나누면 3/8')}</div>
<div class="warn">÷ 2를 × 2로 착각하지 마세요. 나누면 더 작아져야 해요.</div>`,
gen(lv){const k=R(2,9);if(lv===1){let m,d;do{[m,d]=coprimeFrac(2,11)}while(gcd(m*k,d)!==1);return prob(`다음을 계산하세요.<div class="big">${fr(m*k,d)} ÷ ${k}</div>`,F(m,d),`분자를 자연수로 나눠요: ${fr(m*k+' ÷ '+k,d)} = <b>${fr(m,d)}</b>`)}
  let a,b;if(lv===2)[a,b]=coprimeFrac(2,11);else{do{b=R(2,9);a=R(b+1,3*b)}while(gcd(a,b)!==1)}
  return prob(`다음을 계산하세요.<div class="big">${fr(a,b)} ÷ ${k}</div>`,F(a,b*k),`${fr(a,b)} ÷ ${k} = ${fr(a,b)} × ${fr(1,k)} = ${fr(a,b*k)}${tail(a,b*k)}`)}},
{id:'g3',title:'(대분수) ÷ (자연수)',book:'107단계',key:'대분수를 가분수로 바꾼 뒤 × <span class="fr"><span class="nu">1</span><span class="de">자연수</span></span>',
ex:()=>`<div class="eg">2${fr(2,5)} ÷ 3 = ${fr(12,5)} ÷ 3 = ${fr('12 ÷ 3',5)} = <b>${fr(4,5)}</b></div><div class="eg">1${fr(1,3)} ÷ 5 = ${fr(4,3)} × ${fr(1,5)} = <b>${fr(4,15)}</b></div>
<div class="warn">가분수로 바꿀 때: (자연수 × 분모) + 분자. 2${fr(2,5)} = ${fr('2×5+2',5)} = ${fr(12,5)}</div>`,
gen(lv){const [a,b]=coprimeFrac(2,lv===1?6:9),w=R(1,lv===3?5:3),im=w*b+a;let k;if(lv===1){const ds=[];for(let i=2;i<=9;i++)if(im%i===0)ds.push(i);k=ds.length?pick(ds):R(2,6)}else k=R(2,9);
  return prob(`다음을 계산하세요.<div class="big">${w}${fr(a,b)} ÷ ${k}</div>`,F(im,b*k),ol([`가분수로: ${w}${fr(a,b)} = ${fr(im,b)}`,im%k===0?`분자를 나눠요: ${fr(im+' ÷ '+k,b)} = ${fr(im/k,b)}${tail(im/k,b)}`:`${fr(im,b)} × ${fr(1,k)} = ${fr(im,b*k)}${tail(im,b*k)}`]))}}
]);
const KN=['','','','삼','사','오','육','칠','팔','구','십','십일','십이'];
U('s61','2','각기둥과 각뿔',[
{id:'h1',title:'각기둥의 구성 요소',key:'■각기둥 → 면 ■+2 · 모서리 ■×3 · 꼭짓점 ■×2',
ex:()=>`<div class="fig">${SVG_SOLIDS}</div><p>위아래에 있는 면이 서로 평행하고 합동인 다각형인 입체도형을 <b>각기둥</b>이라고 해요. 서로 평행한 두 면이 <b>밑면</b>, 나머지 면이 <b>옆면</b>(직사각형)이에요.</p>
<table class="t"><tr><th></th><th>면</th><th>모서리</th><th>꼭짓점</th></tr><tr><td>삼각기둥</td><td>5</td><td>9</td><td>6</td></tr><tr><td>사각기둥</td><td>6</td><td>12</td><td>8</td></tr><tr><td>■각기둥</td><td>■ + 2</td><td>■ × 3</td><td>■ × 2</td></tr></table>
<div class="warn">이름은 <b>밑면</b>의 모양으로 정해요. 밑면이 오각형이면 오각기둥!</div>`,
gen(lv){const n=R(3,lv===1?8:12),nm=KN[n]+'각기둥';const t=lv<3?R(0,2):R(0,4);const f=n+2,e=3*n,v=2*n;
  if(t<3){const q=[['면',f,`${n} + 2 = ${f}`],['모서리',e,`${n} × 3 = ${e}`],['꼭짓점',v,`${n} × 2 = ${v}`]][t];return prob(`<b>${nm}</b>의 <b>${q[0]}</b>의 수는 모두 몇 개인가요?`,num(q[1],'개'),`밑면이 ${KN[n]}각형 → ${q[0]}: ${q[2]} → <b>${q[1]}개</b>`)}
  if(t===3)return prob(`<b>모서리가 ${e}개</b>인 각기둥이 있어요. 밑면은 몇 각형인가요? <span class="muted small">(숫자만)</span>`,num(n,'각형'),`각기둥의 모서리 수 = 한 밑면의 변의 수 × 3 → ${e} ÷ 3 = <b>${n}</b> → ${nm}`);
  return prob(`<b>${nm}</b>의 꼭짓점 수와 면 수의 <b>합</b>은?`,num(v+f,'개'),`꼭짓점 ${v}개 + 면 ${f}개 = <b>${v+f}개</b>`)}},
{id:'h2',title:'각뿔의 구성 요소',key:'■각뿔 → 면 ■+1 · 모서리 ■×2 · 꼭짓점 ■+1',
ex:()=>`<p>밑면이 다각형이고 옆면이 모두 <b>삼각형</b>인 입체도형을 <b>각뿔</b>이라고 해요. 옆면이 모두 만나는 점이 <b>각뿔의 꼭짓점</b>, 그 점에서 밑면에 수직인 선분의 길이가 <b>높이</b>예요.</p>
<table class="t"><tr><th></th><th>면</th><th>모서리</th><th>꼭짓점</th></tr><tr><td>삼각뿔</td><td>4</td><td>6</td><td>4</td></tr><tr><td>사각뿔</td><td>5</td><td>8</td><td>5</td></tr><tr><td>■각뿔</td><td>■ + 1</td><td>■ × 2</td><td>■ + 1</td></tr></table>
<div class="warn">각뿔의 밑면은 <b>1개</b>, 각기둥의 밑면은 <b>2개</b>예요.</div>`,
gen(lv){const n=R(3,lv===1?8:12),nm=KN[n]+'각뿔';const t=lv<3?R(0,2):R(0,4);const f=n+1,e=2*n,v=n+1;
  if(t<3){const q=[['면',f,`${n} + 1 = ${f}`],['모서리',e,`${n} × 2 = ${e}`],['꼭짓점',v,`${n} + 1 = ${v}`]][t];return prob(`<b>${nm}</b>의 <b>${q[0]}</b>의 수는 모두 몇 개인가요?`,num(q[1],'개'),`밑면이 ${KN[n]}각형 → ${q[0]}: ${q[2]} → <b>${q[1]}개</b>`)}
  if(t===3)return prob(`<b>모서리가 ${e}개</b>인 각뿔이 있어요. 밑면은 몇 각형인가요? <span class="muted small">(숫자만)</span>`,num(n,'각형'),`각뿔의 모서리 수 = 밑면의 변의 수 × 2 → ${e} ÷ 2 = <b>${n}</b> → ${nm}`);
  return prob(`<b>${nm}</b>의 모서리 수와 <b>${KN[n]}각기둥</b>의 모서리 수의 <b>차</b>는?`,num(n,'개'),`${KN[n]}각기둥 ${3*n}개 − ${nm} ${2*n}개 = <b>${n}개</b>`)}},
{id:'h3',title:'각기둥과 각뿔 비교',key:'옆면: 각기둥은 직사각형, 각뿔은 삼각형',
ex:()=>`<table class="t"><tr><th></th><th>각기둥</th><th>각뿔</th></tr><tr><td>밑면 수</td><td>2개</td><td>1개</td></tr><tr><td>옆면 모양</td><td>직사각형</td><td>삼각형</td></tr><tr><td>옆면 수</td><td>밑면 변의 수</td><td>밑면 변의 수</td></tr></table>
<p>각기둥의 전개도는 밑면 2개 + 옆면(직사각형) ■개, 각뿔의 전개도는 밑면 1개 + 옆면(삼각형) ■개로 이루어져요.</p>`,
gen(lv){const B=[['각기둥의 옆면은 어떤 모양인가요?','직사각형',['삼각형','원','오각형']],['각뿔의 옆면은 어떤 모양인가요?','삼각형',['직사각형','정사각형','원']],['각뿔에서 밑면은 몇 개인가요?','1개',['2개','3개','없어요']],['각기둥에서 밑면은 몇 개인가요?','2개',['1개','3개','없어요']],
  ['각기둥의 이름은 무엇으로 정하나요?','밑면의 모양',['옆면의 모양','높이','모서리의 길이']],['각뿔에서 옆면이 모두 만나는 점을 무엇이라고 하나요?','각뿔의 꼭짓점',['밑면','모서리','대칭의 중심']],['육각기둥의 옆면은 몇 개인가요?','6개',['8개','12개','2개']],['오각뿔의 옆면은 몇 개인가요?','5개',['6개','10개','1개']]];
  const [q,a,w]=pick(B);return prob(q,mc(a,w),`정답: <b>${a}</b>`)}}
]);
U('s61','3','소수의 나눗셈',[
{id:'i1',title:'(소수) ÷ (자연수)',book:'103~104단계',key:'자연수의 나눗셈처럼 계산하고, 몫의 소수점은 나누어지는 수의 소수점 <b>바로 위</b>에 찍어요',
ex:()=>`<div class="eg">6.48 ÷ 3 → 648 ÷ 3 = 216 → 소수 두 자리 → <b>2.16</b></div><div class="eg"><div class="egt">분수로 바꾸어 계산</div>6.48 ÷ 3 = ${fr(648,100)} ÷ 3 = ${fr(216,100)} = 2.16</div>
<div class="warn">세로셈에서 몫의 소수점을 빠뜨리지 마세요. 어림하면 6 ÷ 3 = 2쯤이니 216이 아니라 2.16!</div>`,
gen(lv){let q,k,s;if(lv===1){s=1;q=rdec(1,11,99);k=R(2,9)}else if(lv===2){s=2;q=rdec(2,101,999);k=R(2,9)}else{s=2;q=rdec(2,101,499);k=R(11,25)}
  const dv=q*k;return prob(`다음을 계산하세요.<div class="big">${D(dv/P10(s))} ÷ ${k}</div>`,num(q/P10(s)),ol([`자연수처럼: ${dv} ÷ ${k} = ${q}`,`나누어지는 수가 소수 ${D(dv/P10(s)).split('.')[1]?D(dv/P10(s)).split('.')[1].length:0}자리 → 몫 <b>${D(q/P10(s))}</b>`]))}},
{id:'i2',title:'몫이 1보다 작은 소수 · 0을 내려 계산',book:'104~105단계',key:'몫의 자연수 자리에 <b>0</b>을 쓰고, 나누어떨어지지 않으면 끝에 <b>0을 내려</b> 계산해요',
ex:()=>`<div class="eg"><div class="egt">몫이 1보다 작을 때</div>2.45 ÷ 7 = <b>0.35</b> (2는 7로 나눌 수 없으니 일의 자리 몫은 0)</div>
<div class="eg"><div class="egt">0을 내려 계산</div>3.4 ÷ 4 = 3.40 ÷ 4 = <b>0.85</b></div><div class="eg"><div class="egt">몫 중간에 0</div>6.24 ÷ 6 = <b>1.04</b> (2는 6으로 못 나누니 0을 쓰고 다음 자리로)</div>
<div class="warn">1.04를 1.4로 쓰는 실수가 많아요. 나눌 수 없는 자리에는 꼭 0을 써요.</div>`,
gen(lv){let q,k,dv,s=2,st;if(lv===1){q=rdec(2,11,99);k=R(2,9);dv=q*k;st=`몫의 일의 자리는 0이에요.`}
  else if(lv===2){do{k=pick([2,4,5,6,8]);q=R(5,99)}while((q*k)%10!==0||q%10===0);dv=q*k;st=`나누어지는 수 끝에 0을 붙여 ${D(dv/100)}0으로 생각하고 계산해요.`}
  else{q=R(1,9)*100+R(1,9);k=R(2,9);dv=q*k;st=`나눌 수 없는 자리에는 몫에 0을 써요.`}
  return prob(`다음을 계산하세요.<div class="big">${D(dv/100)} ÷ ${k}</div>`,num(q/100),ol([`${D(dv/100)} = ${fr(dv,100)} → ${dv} ÷ ${k} = ${q}`,st,`몫: <b>${D(q/100)}</b>`]))}},
{id:'i3',title:'(자연수) ÷ (자연수)의 몫을 소수로',book:'106~107단계',key:'나누어떨어질 때까지 소수점 아래에 0을 붙여 계속 나눠요',
ex:()=>`<div class="eg">7 ÷ 4 = 7.00 ÷ 4 = <b>1.75</b></div><div class="eg">3 ÷ 8 = 3.000 ÷ 8 = <b>0.375</b></div><div class="eg"><div class="egt">분수로 생각하기</div>7 ÷ 4 = ${fr(7,4)} = ${fr(175,100)} = 1.75</div>`,
gen(lv){const k=lv===1?pick([2,4,5]):lv===2?pick([4,5,8,20]):pick([8,16,25,40]);let a;do{a=R(1,lv===1?20:60)}while(a%k===0||((a*1000)%k!==0));
  return prob(`나눗셈의 몫을 <b>소수</b>로 나타내세요.<div class="big">${a} ÷ ${k}</div>`,num(a/k),`${a} 뒤에 소수점과 0을 붙여 나누어떨어질 때까지 나눠요 → ${a} ÷ ${k} = <b>${D(a/k)}</b>`)}}
]);
U('s61','4','비와 비율',[
{id:'j1',title:'비 알아보기',book:'108단계',key:'■ : ● → ●에 대한 ■의 비 · ■의 ●에 대한 비 · <b>●가 기준량</b>',
ex:()=>`<p>두 수를 나눗셈으로 비교하기 위해 기호 <b>:</b>를 써서 나타낸 것을 <b>비</b>라고 해요.</p><div class="eg">사과 3개, 배 5개 → 사과 수와 배 수의 비 <b>3 : 5</b><br>읽기: 3 대 5, 5에 대한 3의 비, 3의 5에 대한 비</div>
<div class="key">3 : 5에서 <b>기호 : 오른쪽(5)</b>이 기준량, <b>왼쪽(3)</b>이 비교하는 양</div><div class="warn">'■에 대한' 쪽이 기준량이에요. 순서가 바뀌면 다른 비가 돼요 (3 : 5 ≠ 5 : 3).</div>`,
gen(lv){const a=R(2,15),b=R(2,15);if(a===b)return this.gen(lv);const t=lv===1?R(0,1):R(0,3);const ctx=pick([['남학생 수','여학생 수','명'],['사과 수','귤 수','개'],['파란 구슬 수','빨간 구슬 수','개']]);
  if(t===0)return prob(`${ctx[0]} ${a}${ctx[2]}, ${ctx[1]} ${b}${ctx[2]}일 때, <b>${ctx[1]}에 대한 ${ctx[0]}의 비</b>를 쓰세요.`,{t:'ratio',a,b,any:true},`'${ctx[1]}에 대한' → ${ctx[1]}가 기준량(오른쪽) → <b>${a} : ${b}</b>`);
  if(t===1)return prob(`<b>${a} : ${b}</b>에서 <b>기준량</b>은 얼마인가요?`,num(b),`기호 : 오른쪽에 있는 수가 기준량 → <b>${b}</b>`);
  if(t===2)return prob(`${ctx[0]} ${a}${ctx[2]}, ${ctx[1]} ${b}${ctx[2]}일 때, <b>${ctx[1]}의 ${ctx[0]}에 대한 비</b>를 쓰세요.`,{t:'ratio',a:b,b:a,any:true},`'${ctx[0]}에 대한' → ${ctx[0]}가 기준량(오른쪽) → <b>${b} : ${a}</b>`);
  return prob(`<b>${a}에 대한 ${b}의 비</b>에서 <b>비교하는 양</b>은 얼마인가요?`,num(b),`${a}에 대한 ${b}의 비 = ${b} : ${a} → 비교하는 양 <b>${b}</b>`)}},
{id:'j2',title:'비율 (분수·소수)',book:'108단계',key:'비율 = 비교하는 양 ÷ 기준량',
ex:()=>`<div class="eg">3 : 5의 비율 = 3 ÷ 5 = <b>${fr(3,5)}</b> = <b>0.6</b></div><div class="eg"><div class="egt">비율로 비교하는 양 구하기</div>기준량 20, 비율 0.35 → 비교하는 양 = 20 × 0.35 = <b>7</b></div><div class="warn">비율을 구할 때 기준량으로 <b>나눠요</b>. 3 : 5의 비율을 ${fr(5,3)}으로 쓰면 틀려요.</div>`,
gen(lv){if(lv===1){const a=R(1,20),b=R(2,20);return prob(`비 <b>${a} : ${b}</b>를 비율로 나타내세요. <span class="muted small">(기약분수)</span>`,F(a,b),`비율 = ${a} ÷ ${b} = ${fr(a,b)}${tail(a,b)}`)}
  if(lv===2){const b=pick([2,4,5,10,20,25,50]),a=R(1,b*2);return prob(`비 <b>${a} : ${b}</b>의 비율을 <b>소수</b>로 나타내세요.`,num(a/b),`비율 = ${a} ÷ ${b} = <b>${D(a/b)}</b>`)}
  const base=pick([20,40,50,80,200,500]),r=pick([0.15,0.25,0.3,0.35,0.4,0.6,0.75,0.05]);return prob(`기준량이 ${base}이고 비율이 ${D(r)}일 때, <b>비교하는 양</b>은?`,num(base*r),`비교하는 양 = 기준량 × 비율 = ${base} × ${D(r)} = <b>${D(base*r)}</b>`)}},
{id:'j3',title:'백분율',book:'109단계',key:'백분율(%) = 비율 × 100',
ex:()=>`<p>기준량을 100으로 할 때의 비율을 <b>백분율</b>이라고 하고, 기호 <b>%</b>(퍼센트)를 써요.</p><div class="eg">${fr(3,4)} = 0.75 → 0.75 × 100 = <b>75%</b></div>
<div class="eg"><div class="egt">할인 가격</div>10000원짜리 물건을 20% 할인 → 할인 금액 10000 × 0.2 = 2000원 → 판매 가격 <b>8000원</b></div>`,
gen(lv){if(lv===1){if(rnd()<.5){const r=R(1,99)/100;return prob(`비율 <b>${D(r)}</b>를 백분율로 나타내세요.`,num(Math.round(r*100),'%'),`${D(r)} × 100 = <b>${Math.round(r*100)}%</b>`)}const b=pick([2,4,5,10,20,25,50]),a=R(1,b-1);return prob(`비율 <b>${fr(a,b)}</b>를 백분율로 나타내세요.`,num(a*100/b,'%'),`${fr(a,b)} × 100 = <b>${D(a*100/b)}%</b>`)}
  if(lv===2){const t=pick([20,25,40,50]),a=R(1,t-1);return prob(`우리 반 ${t}명 중 ${a}명이 안경을 썼어요. 안경을 쓴 학생은 반 전체의 몇 %인가요?`,num(a*100/t,'%'),`${fr(a,t)} × 100 = <b>${D(a*100/t)}%</b>`)}
  if(rnd()<.5){const P=R(5,60)*1000,x=pick([10,15,20,25,30,40,50]);return prob(`정가 ${N(P)}원인 물건을 <b>${x}% 할인</b>하여 판다면 판매 가격은 얼마인가요?`,num(P*(100-x)/100,'원'),ol([`할인 금액 = ${N(P)} × ${D(x/100)} = ${N(P*x/100)}원`,`판매 가격 = ${N(P)} − ${N(P*x/100)} = <b>${N(P*(100-x)/100)}원</b>`]))}
  const M=pick([200,400,500,800,1000,2000]),up=pick([5,10,15,20,25,30]);const Nw=M*(100+up)/100;return prob(`과자 값이 ${N(M)}원에서 ${N(Nw)}원으로 올랐어요. 몇 % 올랐나요?`,num(up,'%'),ol([`오른 금액 = ${N(Nw)} − ${N(M)} = ${N(Nw-M)}원`,`${fr(N(Nw-M),N(M))} × 100 = <b>${up}%</b>`]))}},
{id:'j4',title:'비율이 사용되는 경우',key:'속력 = 간 거리 ÷ 걸린 시간 · 인구 밀도 = 인구 ÷ 넓이 · 진하기 = 용질 ÷ 용액',
ex:()=>`<table class="t"><tr><th>상황</th><th>비율</th></tr><tr><td>걸린 시간에 대한 간 거리</td><td>거리 ÷ 시간 (속력)</td></tr><tr><td>넓이에 대한 인구</td><td>인구 ÷ 넓이 (인구 밀도)</td></tr><tr><td>소금물 양에 대한 소금 양</td><td>소금 ÷ 소금물 (진하기)</td></tr><tr><td>타수에 대한 안타 수</td><td>안타 ÷ 타수 (타율)</td></tr></table>
<div class="eg">소금 30 g을 녹여 소금물 200 g을 만들면 → ${fr(30,200)} × 100 = <b>15%</b></div><div class="warn">소금물 양 = 물 + 소금이에요. 물 양으로 나누지 않게 조심!</div>`,
gen(lv){const t=R(0,lv===1?1:3);
  if(t===0){const h=R(2,5),v=R(40,90);return prob(`자동차가 ${v*h} km를 ${h}시간 동안 달렸어요. <b>걸린 시간에 대한 간 거리의 비율</b>은?`,num(v),`${v*h} ÷ ${h} = <b>${v}</b> (1시간에 ${v} km를 간 셈)`)}
  if(t===1){const s=pick([20,25,40,50]),n=s*R(1,8);const w=lv===1?n:R(1,s/5)*5;if(lv===1)return prob(`타자가 ${s}타수 중 안타를 ${Math.round(s*0.3)}개 쳤어요. <b>타율</b>을 소수로 나타내세요.`,num(Math.round(s*0.3)/s),`${Math.round(s*0.3)} ÷ ${s} = <b>${D(Math.round(s*0.3)/s)}</b>`);
    const salt=R(1,9)*10,tot=pick([200,250,400,500]);if(salt>=tot)return this.gen(lv);return prob(`소금 ${salt} g을 물에 녹여 <b>소금물 ${tot} g</b>을 만들었어요. 소금물의 진하기는 몇 %인가요?`,num(salt*100/tot,'%'),`${fr(salt,tot)} × 100 = <b>${D(salt*100/tot)}%</b>`)}
  if(t===2){const a=R(2,9),d=R(100,900);return prob(`넓이가 ${a} km²인 마을에 ${N(a*d)}명이 살아요. <b>넓이에 대한 인구의 비율</b>(인구 밀도)은?`,num(d),`${N(a*d)} ÷ ${a} = <b>${d}</b> (1 km²에 ${d}명)`)}
  const water=pick([160,180,240,270,300,360]),salt=pick([40,60,90]),tot=water+salt;if((salt*100)%tot!==0)return this.gen(lv);return prob(`물 ${water} g에 소금 ${salt} g을 녹였어요. 소금물의 진하기는 몇 %인가요?`,num(salt*100/tot,'%'),ol([`소금물 = ${water} + ${salt} = ${tot} g`,`${fr(salt,tot)} × 100 = <b>${D(salt*100/tot)}%</b>`]))}}
]);
const ITEMS_SETS=[['사과','포도','딸기','바나나','귤'],['축구','야구','농구','배구','수영'],['버스','지하철','도보','자전거','자동차'],['과학','수학','체육','미술','음악']];
function makeData(nItems,total){let c;do{c=[];let left=total;for(let i=0;i<nItems-1;i++){const v=R(1,Math.max(1,Math.floor(left/(nItems-i)*1.7)));c.push(v);left-=v}c.push(left)}while(c.some(x=>x<1)||new Set(c).size<c.length);return c.sort((a,b)=>b-a)}
U('s61','5','여러 가지 그래프',[
{id:'k1',title:'띠그래프와 원그래프 (백분율 구하기)',key:'각 항목의 백분율 = (항목 수 ÷ 전체 수) × 100 · 백분율의 합은 100%',
ex:()=>{const it=[{name:'사과',p:40},{name:'포도',p:30},{name:'딸기',p:20},{name:'귤',p:10}];return `<p>전체에 대한 각 부분의 비율을 띠 모양에 나타내면 <b>띠그래프</b>, 원 모양에 나타내면 <b>원그래프</b>예요.</p><div class="fig">${svgBand(it)}</div><div class="fig">${svgPie(it)}</div>
<div class="eg">좋아하는 과일: 전체 20명 중 사과 8명 → ${fr(8,20)} × 100 = <b>40%</b></div><div class="warn">백분율을 다 더하면 꼭 100%가 되는지 확인해요.</div>`},
gen(lv){const total=pick(lv===1?[20,25,50]:[20,25,40,50]),names=pick(ITEMS_SETS).slice(0,4);let c;do{c=makeData(4,total)}while(c.some(x=>(x*100)%total!==0));
  const i=R(0,3);const tbl=`<table class="t" style="margin:8px auto"><tr><th>항목</th>${names.map(n=>`<th>${n}</th>`).join('')}<th>합계</th></tr><tr><td>학생 수(명)</td>${c.map(x=>`<td>${x}</td>`).join('')}<td>${total}</td></tr></table>`;
  if(lv<3)return prob(`좋아하는 것을 조사한 표예요. <b>${names[i]}</b>은(는) 전체의 몇 %인가요?${tbl}`,num(c[i]*100/total,'%'),`${fr(c[i],total)} × 100 = <b>${c[i]*100/total}%</b>`);
  const L=pick([10,20]);return prob(`표를 길이 ${L} cm인 띠그래프로 나타내려고 해요. <b>${names[i]}</b>이(가) 차지하는 길이는 몇 cm인가요?${tbl}`,num(L*c[i]/total,'cm'),ol([`${names[i]}: ${fr(c[i],total)} × 100 = ${c[i]*100/total}%`,`${L} × ${D(c[i]/total)} = <b>${D(L*c[i]/total)} cm</b>`]))}},
{id:'k2',title:'그래프 해석하기',key:'항목의 수 = 전체 수 × (백분율 ÷ 100)',
ex:()=>`<div class="eg">전체 200명 중 축구를 좋아하는 학생이 35% → 200 × 0.35 = <b>70명</b></div><div class="eg"><div class="egt">몇 배인지 비교</div>사과 40%, 귤 10% → 40 ÷ 10 = <b>4배</b> (전체 수를 몰라도 백분율로 비교할 수 있어요)</div>`,
gen(lv){const names=pick(ITEMS_SETS).slice(0,4);let p;do{p=makeData(4,20).map(x=>x*5)}while(false);const items=names.map((n,i)=>({name:n,p:p[i]}));const g=rnd()<.5?svgBand(items):svgPie(items);
  if(lv===3&&p[0]%p[3]===0&&p[0]!==p[3])return prob(`그래프에서 <b>${names[0]}</b>의 비율은 <b>${names[3]}</b>의 비율의 몇 배인가요?<div class="fig">${g}</div>`,num(p[0]/p[3],'배'),`${p[0]}% ÷ ${p[3]}% = <b>${p[0]/p[3]}배</b>`);
  const total=R(lv===1?1:2,lv===1?5:20)*20,i=R(0,3);return prob(`전체 학생 ${total}명을 조사한 그래프예요. <b>${names[i]}</b>을(를) 고른 학생은 몇 명인가요?<div class="fig">${g}</div>`,num(total*p[i]/100,'명'),`${names[i]}: ${p[i]}% → ${total} × ${D(p[i]/100)} = <b>${total*p[i]/100}명</b>`)}},
{id:'k3',title:'알맞은 그래프 고르기',key:'변화 → 꺾은선 · 크기 비교 → 막대 · 전체에 대한 비율 → 띠·원',
ex:()=>`<table class="t"><tr><th>그래프</th><th>이럴 때 좋아요</th></tr><tr><td>그림그래프</td><td>지역별 수량을 그림으로 한눈에</td></tr><tr><td>막대그래프</td><td>항목끼리 크기 비교</td></tr><tr><td>꺾은선그래프</td><td>시간에 따른 변화</td></tr><tr><td>띠그래프·원그래프</td><td>전체에 대한 각 부분의 비율</td></tr></table>`,
gen(lv){const B=[['하루 동안 교실 온도의 변화','꺾은선그래프'],['반 학생들의 혈액형 비율','원그래프'],['지역별 사과 생산량','그림그래프'],['학생별 줄넘기 횟수 비교','막대그래프'],['한 달 용돈의 쓰임새 비율','띠그래프'],['6개월 동안 내 키의 변화','꺾은선그래프']];
  const [q,a]=pick(B);return prob(`<b>${q}</b>을(를) 나타내기에 가장 알맞은 그래프는?`,mc(a,['꺾은선그래프','원그래프','그림그래프','막대그래프','띠그래프'].filter(x=>x!==a&&!(a==='원그래프'&&x==='띠그래프')&&!(a==='띠그래프'&&x==='원그래프')).slice(0,3)),`정답: <b>${a}</b>`)}}
]);
U('s61','6','직육면체의 부피와 겉넓이',[
{id:'l1',title:'직육면체의 부피',key:'부피 = 가로 × 세로 × 높이 · 정육면체 = 한 모서리 × 한 모서리 × 한 모서리',
ex:()=>`<p>1 cm³는 한 모서리가 1 cm인 정육면체의 부피예요. 부피는 1 cm³ 쌓기나무가 몇 개 들어가는지 세는 것과 같아요.</p><div class="fig">${svgCuboid(5,3,4)}</div><div class="eg">5 × 3 × 4 = <b>60 cm³</b></div>
<div class="warn">부피 단위는 cm³ (세제곱센티미터), 넓이 단위 cm²와 헷갈리지 마세요.</div>`,
gen(lv){if(lv>=2&&rnd()<.35){const a=R(2,lv===3?15:10);return prob(`한 모서리가 ${a} cm인 <b>정육면체</b>의 부피는 몇 cm³인가요?`,num(a*a*a,'cm³'),`${a} × ${a} × ${a} = <b>${a*a*a} cm³</b>`)}const a=R(2,lv===1?9:15),b=R(2,lv===1?8:12),c=R(2,lv===1?8:12);
  return prob(`직육면체의 부피는 몇 cm³인가요?<div class="fig">${svgCuboid(a,b,c)}</div>`,num(a*b*c,'cm³'),`${a} × ${b} × ${c} = <b>${a*b*c} cm³</b>`)}},
{id:'l2',title:'부피의 단위 (m³)',key:'1 m³ = 1,000,000 cm³ (100 × 100 × 100)',
ex:()=>`<p>한 모서리가 1 m인 정육면체의 부피가 1 m³예요. 1 m = 100 cm이므로</p><div class="eg">1 m³ = 100 cm × 100 cm × 100 cm = <b>1,000,000 cm³</b></div><div class="eg">가로 200 cm, 세로 300 cm, 높이 100 cm → 2 m × 3 m × 1 m = <b>6 m³</b></div>
<div class="warn">0이 6개! 1 m³ = 100 cm³ (×)</div>`,
gen(lv){if(lv===1){const x=R(2,9);return rnd()<.5?prob(`<b>${x} m³</b>는 몇 cm³인가요?`,num(x*1e6,'cm³'),`1 m³ = 1,000,000 cm³ → ${x} m³ = <b>${N(x*1e6)} cm³</b>`):prob(`<b>${N(x*1e6)} cm³</b>는 몇 m³인가요?`,num(x,'m³'),`1,000,000 cm³ = 1 m³ → <b>${x} m³</b>`)}
  const a=R(1,6),b=R(1,5),c=R(1,4);if(lv===2)return prob(`가로 ${a*100} cm, 세로 ${b*100} cm, 높이 ${c*100} cm인 직육면체의 부피는 몇 m³인가요?`,num(a*b*c,'m³'),`${a} m × ${b} m × ${c} m = <b>${a*b*c} m³</b>`);
  const x=R(11,95)/10;return prob(`<b>${D(x)} m³</b>는 몇 cm³인가요?`,num(Math.round(x*1e6),'cm³'),`${D(x)} × 1,000,000 = <b>${N(Math.round(x*1e6))} cm³</b>`)}},
{id:'l3',title:'직육면체의 겉넓이',key:'겉넓이 = (세 면의 넓이의 합) × 2 · 정육면체 = 한 면의 넓이 × 6',
ex:()=>`<div class="fig">${svgCuboid(5,3,4)}</div><p>합동인 면이 2개씩 3쌍 있어요.</p><div class="eg">(5×3 + 3×4 + 5×4) × 2 = (15 + 12 + 20) × 2 = <b>94 cm²</b></div><div class="eg"><div class="egt">정육면체</div>한 모서리 3 cm → 3 × 3 × 6 = <b>54 cm²</b></div>
<div class="warn">겉넓이는 넓이이므로 단위가 cm²예요.</div>`,
gen(lv){if(lv===1||rnd()<.3){const a=R(2,12);return prob(`한 모서리가 ${a} cm인 <b>정육면체의 겉넓이</b>는 몇 cm²인가요?`,num(6*a*a,'cm²'),`${a} × ${a} × 6 = <b>${6*a*a} cm²</b>`)}const a=R(2,12),b=R(2,10),c=R(2,10);
  return prob(`직육면체의 <b>겉넓이</b>는 몇 cm²인가요?<div class="fig">${svgCuboid(a,b,c)}</div>`,num(2*(a*b+b*c+a*c),'cm²'),`(${a}×${b} + ${b}×${c} + ${a}×${c}) × 2 = (${a*b} + ${b*c} + ${a*c}) × 2 = <b>${2*(a*b+b*c+a*c)} cm²</b>`)}},
{id:'l4',title:'부피·겉넓이 거꾸로 구하기',key:'높이 = 부피 ÷ (가로 × 세로)',
ex:()=>`<div class="eg">부피 120 cm³, 가로 5 cm, 세로 4 cm → 높이 = 120 ÷ 20 = <b>6 cm</b></div><div class="eg">정육면체 겉넓이 150 cm² → 한 면 150 ÷ 6 = 25 → 5 × 5 = 25 → 한 모서리 <b>5 cm</b></div>`,
gen(lv){const a=R(2,12),b=R(2,10),c=R(2,12);if(lv<3||rnd()<.5)return prob(`부피가 ${a*b*c} cm³인 직육면체의 가로가 ${a} cm, 세로가 ${b} cm예요. <b>높이</b>는 몇 cm인가요?`,num(c,'cm'),`${a*b*c} ÷ (${a} × ${b}) = ${a*b*c} ÷ ${a*b} = <b>${c} cm</b>`);
  const s=R(2,10);return rnd()<.5?prob(`겉넓이가 ${6*s*s} cm²인 <b>정육면체</b>의 한 모서리는 몇 cm인가요?`,num(s,'cm'),ol([`한 면의 넓이 = ${6*s*s} ÷ 6 = ${s*s}`,`${s} × ${s} = ${s*s} → <b>${s} cm</b>`])):prob(`겉넓이가 ${6*s*s} cm²인 정육면체의 <b>부피</b>는 몇 cm³인가요?`,num(s*s*s,'cm³'),ol([`한 면 = ${6*s*s} ÷ 6 = ${s*s} → 한 모서리 ${s} cm`,`부피 = ${s} × ${s} × ${s} = <b>${s*s*s} cm³</b>`]))}}
]);
