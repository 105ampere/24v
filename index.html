U('s62','1','분수의 나눗셈',[
{id:'m1',title:'분모가 같은 (분수) ÷ (분수)',book:'111단계',key:'분모가 같으면 <b>분자끼리 나눠요</b>',
ex:()=>`<p>${fr(6,7)} ÷ ${fr(2,7)}은 ${fr(6,7)} 안에 ${fr(2,7)}이 몇 번 들어가는지 → ${fr(1,7)}이 6개, 2개 → 6 ÷ 2 = <b>3</b></p><div class="eg">${fr(3,8)} ÷ ${fr(5,8)} = 3 ÷ 5 = <b>${fr(3,5)}</b></div>`,
gen(lv){let d,a,b;if(lv===1){do{d=R(5,15);b=R(1,4);a=b*R(2,4)}while(a>=d||gcd(a,d)!==1||gcd(b,d)!==1)}else{do{d=R(5,15);a=R(1,d-1);b=R(1,d-1)}while(a===b||a%b===0||gcd(a,d)!==1||gcd(b,d)!==1)}
  return prob(`다음을 계산하세요.<div class="big">${fr(a,d)} ÷ ${fr(b,d)}</div>`,F(a,b),`분모가 같으니 분자끼리 나눠요: ${a} ÷ ${b} = ${fr(a,b)}${tail(a,b)}`)}},
{id:'m2',title:'분모가 다른 (분수) ÷ (분수)',book:'111~112단계',key:'나누는 분수의 <b>분모와 분자를 바꾸어</b> 곱해요',
ex:()=>`<div class="eg"><div class="egt">통분해서</div>${fr(3,4)} ÷ ${fr(2,5)} = ${fr(15,20)} ÷ ${fr(8,20)} = 15 ÷ 8 = ${fr(15,8)}</div><div class="eg"><div class="egt">곱셈으로 바꾸어 (더 빨라요)</div>${fr(3,4)} ÷ ${fr(2,5)} = ${fr(3,4)} × ${fr(5,2)} = ${fr(15,8)} = <b>1${fr(7,8)}</b></div>
<div class="warn">앞의 분수를 뒤집으면 안 돼요! <b>나누는 수(뒤)</b>만 뒤집어요.</div>`,
gen(lv){let a,b,c,d;do{[a,b]=coprimeFrac(2,lv===1?8:12);[c,d]=coprimeFrac(2,lv===1?8:12)}while(b===d||(a*d===b*c));
  return prob(`다음을 계산하세요.<div class="big">${fr(a,b)} ÷ ${fr(c,d)}</div>`,F(a*d,b*c),`${fr(a,b)} ÷ ${fr(c,d)} = ${fr(a,b)} × ${fr(d,c)} = ${fr(a*d,b*c)}${tail(a*d,b*c)}`)}},
{id:'m3',title:'(자연수) ÷ (분수)',book:'112단계',key:'■ ÷ <span class="fr"><span class="nu">b</span><span class="de">c</span></span> = ■ × <span class="fr"><span class="nu">c</span><span class="de">b</span></span>',
ex:()=>`<div class="eg">6 ÷ ${fr(2,3)} = 6 × ${fr(3,2)} = ${fr(18,2)} = <b>9</b></div><div class="eg"><div class="egt">의미</div>${fr(2,3)}이 6이면 1은? → 6 ÷ 2 × 3 = 9</div><div class="warn">진분수로 나누면 몫이 나누어지는 수보다 <b>커져요</b>.</div>`,
gen(lv){const [b,c]=coprimeFrac(2,lv===1?6:12);let k=lv===1?b*R(1,6):R(2,15);
  return prob(`다음을 계산하세요.<div class="big">${k} ÷ ${fr(b,c)}</div>`,F(k*c,b),`${k} ÷ ${fr(b,c)} = ${k} × ${fr(c,b)} = ${fr(k*c,b)}${tail(k*c,b)}`)}},
{id:'m4',title:'대분수·가분수의 나눗셈',book:'113단계',key:'대분수 → 가분수로 바꾸고 → 나누는 수를 뒤집어 곱해요',
ex:()=>`<div class="eg">2${fr(1,4)} ÷ ${fr(3,5)} = ${fr(9,4)} × ${fr(5,3)} = ${fr(45,12)} = <b>3${fr(3,4)}</b></div><div class="eg">1${fr(1,2)} ÷ 1${fr(1,4)} = ${fr(3,2)} ÷ ${fr(5,4)} = ${fr(3,2)} × ${fr(4,5)} = ${fr(12,10)} = <b>1${fr(1,5)}</b></div>`,
gen(lv){const [a,b]=coprimeFrac(2,7),w=R(1,3),im=w*b+a;let c,d,h,cv;if(lv===1){[c,d]=coprimeFrac(2,9);h=fr(c,d);cv=''}else if(lv===2){do{d=R(2,7);c=R(d+1,3*d)}while(gcd(c,d)!==1);h=fr(c,d);cv=''}else{const [x,y]=coprimeFrac(2,6),w2=R(1,2);c=w2*y+x;d=y;h=`${w2}${fr(x,y)}`;cv=`, ${w2}${fr(x,y)} = ${fr(c,d)}`}
  return prob(`다음을 계산하세요.<div class="big">${w}${fr(a,b)} ÷ ${h}</div>`,F(im*d,b*c),ol([`가분수로: ${w}${fr(a,b)} = ${fr(im,b)}${cv}`,`${fr(im,b)} × ${fr(d,c)} = ${fr(im*d,b*c)}${tail(im*d,b*c)}`]))}}
]);
U('s62','2','소수의 나눗셈',[
{id:'n1',title:'자릿수가 같은 (소수) ÷ (소수)',book:'114단계',key:'두 수의 소수점을 <b>똑같이</b> 오른쪽으로 옮겨 자연수의 나눗셈으로',
ex:()=>`<div class="eg">1.2 ÷ 0.4 → 12 ÷ 4 = <b>3</b> (둘 다 10배)</div><div class="eg">6.25 ÷ 0.25 → 625 ÷ 25 = <b>25</b> (둘 다 100배)</div><div class="eg"><div class="egt">분수로</div>${fr(12,10)} ÷ ${fr(4,10)} = 12 ÷ 4 = 3</div>
<div class="warn">한쪽만 옮기면 몫이 달라져요. 소수점은 <b>함께</b> 옮겨요.</div>`,
gen(lv){const s=lv===1?1:2;const q=R(2,lv===3?40:9);let v;do{v=R(s===1?2:11,s===1?9:99)}while(v%10===0);const dv=v*q;
  return prob(`다음을 계산하세요.<div class="big">${D(dv/P10(s))} ÷ ${D(v/P10(s))}</div>`,num(q),`두 수를 ${P10(s)}배 → ${dv} ÷ ${v} = <b>${q}</b>`)}},
{id:'n2',title:'자릿수가 다른 (소수) ÷ (소수)',book:'115단계',key:'<b>나누는 수</b>가 자연수가 되도록 소수점을 옮기고, 나누어지는 수도 같은 칸만큼 옮겨요',
ex:()=>`<div class="eg">4.32 ÷ 1.2 → 43.2 ÷ 12 = <b>3.6</b><br>(나누는 수 1.2를 12로 만들려고 둘 다 10배)</div><div class="eg"><div class="egt">100배로 해도 돼요</div>432 ÷ 120 = 3.6</div>
<div class="warn">몫의 소수점은 <b>옮긴</b> 소수점 위치에 맞춰 찍어요.</div>`,
gen(lv){let v,q;do{v=R(lv===1?2:12,lv===1?9:45);q=R(11,99)}while(v%10===0||q%10===0);const dv=v*q;const vs=lv===1?D(v/10):D(v/10);
  return prob(`다음을 계산하세요.<div class="big">${D(dv/100)} ÷ ${vs}</div>`,num(q/10),ol([`나누는 수 ${vs}를 자연수로 만들기 위해 둘 다 10배: ${D(dv/10)} ÷ ${v}`,`${D(dv/10)} ÷ ${v} = <b>${D(q/10)}</b>`]))}},
{id:'n3',title:'(자연수) ÷ (소수)',book:'116단계',key:'나누는 수를 자연수로 만들고, 자연수 뒤에 <b>0을 붙여</b> 똑같이 옮겨요',
ex:()=>`<div class="eg">12 ÷ 0.4 → 120 ÷ 4 = <b>30</b></div><div class="eg">9 ÷ 0.36 → 900 ÷ 36 = <b>25</b></div><div class="warn">12 ÷ 0.4를 12 ÷ 4로 계산하면 안 돼요. 12도 10배 해서 120!</div>`,
gen(lv){const s=lv===1?1:2;for(let t=0;t<500;t++){let v=R(s===1?2:11,s===1?9:99);if(v%10===0)continue;const q=R(2,lv===1?50:80);if((q*v)%P10(s)!==0)continue;const k=q*v/P10(s);if(k<2||k>200)continue;
   return prob(`다음을 계산하세요.<div class="big">${k} ÷ ${D(v/P10(s))}</div>`,num(q),`두 수를 ${P10(s)}배: ${k*P10(s)} ÷ ${v} = <b>${q}</b>`)}return this.gen(lv)}},
{id:'n4',title:'몫을 반올림하기 · 나머지 구하기',key:'몫을 소수 ■째 자리까지 → 한 자리 더 구해서 반올림 · 남는 양의 소수점은 <b>원래</b> 위치',
ex:()=>`<div class="eg"><div class="egt">반올림</div>5 ÷ 3 = 1.66… → 소수 둘째 자리 6을 보고 반올림 → <b>1.7</b></div><div class="eg"><div class="egt">나머지</div>끈 13.5 m를 2 m씩 자르면 → 6도막, 남는 끈 <b>1.5 m</b> (13.5 − 2 × 6)</div>
<div class="warn">나머지에 소수점을 잘못 찍기 쉬워요. 확인: 나누는 수 × 몫 + 나머지 = 나누어지는 수</div>`,
gen(lv){if(rnd()<.5){let a,b;do{a=R(2,lv===1?20:60);b=pick([3,6,7,9,11,12])}while(a%b===0);const pl=lv===3?2:1;const res=Math.round(a*P10(pl)/b)/P10(pl);
    return prob(`<b>${a} ÷ ${b}</b>의 몫을 반올림하여 <b>소수 ${pl===1?'첫째':'둘째'} 자리까지</b> 나타내세요.`,num(res),`${a} ÷ ${b} = ${(a/b).toFixed(pl+2).replace(/0+$/,'')}… → 소수 ${pl===1?'둘째':'셋째'} 자리 숫자를 보고 반올림 → <b>${D(res)}</b>`)}
  const x=R(2,lv===1?3:5),cnt=R(3,9),rem=R(1,x*10-1);if(rem%10===0)return this.gen(lv);const L=x*10*cnt+rem;
  return prob(`리본 ${D(L/10)} m를 ${x} m씩 잘라 나누어 주려고 해요. 몇 명에게 줄 수 있고 남는 리본은 몇 m인가요? <b>남는 리본의 길이</b>를 쓰세요.`,num(rem/10,'m'),ol([`${D(L/10)} ÷ ${x} → 몫 ${cnt}(명)`,`남는 리본 = ${D(L/10)} − ${x} × ${cnt} = <b>${D(rem/10)} m</b>`,`확인: ${x} × ${cnt} + ${D(rem/10)} = ${D(L/10)}`]))}}
]);
function genGrid(lv){const rows=lv===1?2:3,cols=lv===1?R(2,3):lv===2?3:R(3,4),mx=lv===1?3:lv===2?3:4;let h;do{h=[];for(let i=0;i<rows;i++){h.push([]);for(let j=0;j<cols;j++)h[i].push(lv===1?R(1,mx):R(0,mx))}}while(h.some(r=>r.every(x=>x===0))||[...Array(cols).keys()].some(j=>h.every(r=>r[j]===0)));return h}
U('s62','3','공간과 입체',[
{id:'o1',title:'쌓기나무의 개수 구하기',key:'위에서 본 모양의 각 칸에 쓴 수를 <b>모두 더해요</b>',
ex:()=>`<p>쌓기나무로 쌓은 모양을 위에서 보고, 각 칸에 그 자리에 쌓인 개수를 써서 나타낼 수 있어요.</p><div class="fig">${svgGrid([[2,1],[3,1]])}</div><div class="eg">2 + 1 + 3 + 1 = <b>7개</b></div>
<div class="warn">앞·옆에서 본 모양만으로는 숨어 있는 쌓기나무를 알 수 없어요. 위에서 본 모양에 수를 쓰면 정확해요.</div>`,
gen(lv){const h=genGrid(lv);const s=h.flat().reduce((a,b)=>a+b,0);return prob(`위에서 본 모양에 쌓은 쌓기나무의 개수를 썼어요. 쌓기나무는 모두 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(s,'개'),`${h.flat().filter(x=>x).join(' + ')} = <b>${s}개</b>`)}},
{id:'o2',title:'층별로 나타내기',key:'■층에 있는 쌓기나무 수 = <b>■ 이상</b>인 수가 쓰인 칸의 수',
ex:()=>`<div class="fig">${svgGrid([[2,1],[3,1]])}</div><table class="t"><tr><th>1층</th><th>2층</th><th>3층</th></tr><tr><td>4개 (1 이상)</td><td>2개 (2 이상)</td><td>1개 (3 이상)</td></tr></table><p>층별 개수를 모두 더해도 전체 개수(7개)가 돼요.</p>`,
gen(lv){const h=genGrid(lv),f=h.flat(),mx=Math.max(...f);if(mx<2)return this.gen(lv);const k=R(2,mx);
  if(lv===3&&rnd()<.5){const s=f.reduce((a,x)=>a+Math.max(0,x-1),0);return prob(`<b>2층 이상</b>에 쌓인 쌓기나무는 모두 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(s,'개'),`각 칸에서 1층을 뺀 개수를 더해요: ${f.filter(x=>x>1).map(x=>x-1).join(' + ')} = <b>${s}개</b>`)}
  const c=f.filter(x=>x>=k).length;return prob(`<b>${k}층</b>에 있는 쌓기나무는 몇 개인가요?<div class="fig">${svgGrid(h)}</div>`,num(c,'개'),`${k} 이상이 쓰인 칸을 세요: ${f.filter(x=>x>=k).join(', ')} → <b>${c}개</b>`)}},
{id:'o3',title:'앞에서 본 모양',key:'앞에서 보면 각 줄(세로줄)에서 <b>가장 높은 수</b>만큼 보여요',
ex:()=>`<div class="fig">${svgGrid([[2,1,1],[1,3,2]],true)}</div><p>앞에서 보면 같은 세로줄에 있는 쌓기나무는 겹쳐 보여서, 그 줄에서 <b>가장 큰 수</b>만큼의 높이로 보여요.</p><div class="eg">1번째 줄: 2, 1 중 큰 수 → 2층 · 2번째 줄: 1, 3 → 3층 · 3번째 줄: 1, 2 → 2층</div>`,
gen(lv){const h=genGrid(Math.max(2,lv)),cols=h[0].length;const mxs=[...Array(cols).keys()].map(j=>Math.max(...h.map(r=>r[j])));
  if(lv===3&&rnd()<.5){const s=mxs.reduce((a,b)=>a+b,0);return prob(`앞에서 본 모양을 그리면 정사각형은 모두 몇 개 보이나요?<div class="fig">${svgGrid(h,true)}</div>`,num(s,'개'),`각 줄의 가장 큰 수: ${mxs.join(', ')} → ${mxs.join(' + ')} = <b>${s}개</b>`)}
  const j=R(0,cols-1);return prob(`앞에서 보았을 때, 왼쪽에서 <b>${j+1}번째 줄</b>은 몇 층으로 보이나요?<div class="fig">${svgGrid(h,true)}</div>`,num(mxs[j],'층'),`${j+1}번째 줄의 수: ${h.map(r=>r[j]).join(', ')} → 가장 큰 수 <b>${mxs[j]}층</b>`)}}
]);
U('s62','4','비례식과 비례배분',[
{id:'q1',title:'간단한 자연수의 비로 나타내기',book:'117단계',key:'비의 전항과 후항에 0이 아닌 같은 수를 곱하거나 나누어도 비율은 같아요',
ex:()=>`<div class="eg"><div class="egt">자연수</div>12 : 18 → 둘 다 6으로 나누면 → <b>2 : 3</b></div><div class="eg"><div class="egt">소수</div>0.6 : 0.8 → 둘 다 10배 → 6 : 8 → <b>3 : 4</b></div><div class="eg"><div class="egt">분수</div>${fr(1,2)} : ${fr(1,3)} → 분모의 최소공배수 6을 곱해요 → <b>3 : 2</b></div>
<div class="warn">한쪽에만 곱하면 안 돼요. 전항·후항 <b>둘 다</b> 같은 수를!</div>`,
gen(lv){let x,y;do{x=R(1,9);y=R(1,9)}while(x===y||gcd(x,y)!==1);
  if(lv===1){const g=R(2,9);return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${x*g} : ${y*g}</div>`,{t:'ratio',a:x,b:y},`두 수를 최대공약수 ${g}(으)로 나눠요 → <b>${x} : ${y}</b>`)}
  if(lv===2){let g;do{g=R(1,5)}while((x*g)%10===0||(y*g)%10===0);return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${D(x*g/10)} : ${D(y*g/10)}</div>`,{t:'ratio',a:x,b:y},ol([`둘 다 10배: ${x*g} : ${y*g}`,`${g>1?`${g}(으)로 나누면 `:''}<b>${x} : ${y}</b>`]))}
  let a,b,c,d;do{[a,b]=coprimeFrac(2,9);[c,d]=coprimeFrac(2,9)}while(b===d||a*d===b*c);const L=lcm(b,d);const [p,q]=red(a*L/b,c*L/d);
  return prob(`가장 간단한 자연수의 비로 나타내세요.<div class="big">${fr(a,b)} : ${fr(c,d)}</div>`,{t:'ratio',a:p,b:q},ol([`분모 ${b}, ${d}의 최소공배수 ${L}을 곱해요: ${a*L/b} : ${c*L/d}`,(p===a*L/b?`→ <b>${p} : ${q}</b>`:`최대공약수로 나눠 더 간단히 → <b>${p} : ${q}</b>`)]))}},
{id:'q2',title:'비례식',book:'118단계',key:'비례식에서 <b>외항의 곱 = 내항의 곱</b>',
ex:()=>`<p>비율이 같은 두 비를 등호로 나타낸 식을 <b>비례식</b>이라고 해요.</p><div class="eg">2 : 3 = 8 : 12 → 바깥쪽 2, 12는 <b>외항</b>, 안쪽 3, 8은 <b>내항</b><br>2 × 12 = 24, 3 × 8 = 24 (같아요!)</div>
<div class="eg"><div class="egt">□ 구하기</div>3 : 5 = □ : 20 → 3 × 20 = 5 × □ → 60 = 5 × □ → □ = <b>12</b></div>`,
gen(lv){let x,y;do{x=R(1,9);y=R(1,9)}while(x===y||gcd(x,y)!==1);const m=lv===1?1:R(1,4),n=lv===1?R(2,9):R(2,12);if(m===n)return this.gen(lv);
  const t=[x*m,y*m,x*n,y*n],k=R(0,3),ans=t[k];const s=t.map((v,i)=>i===k?'□':v);
  return prob(`□ 안에 알맞은 수를 구하세요.<div class="big">${s[0]} : ${s[1]} = ${s[2]} : ${s[3]}</div>`,num(ans),ol([`외항의 곱 = 내항의 곱: ${s[0]} × ${s[3]} = ${s[1]} × ${s[2]}`,k===0||k===3?`□ × ${k===0?t[3]:t[0]} = ${t[1]*t[2]} → □ = ${t[1]*t[2]} ÷ ${k===0?t[3]:t[0]} = <b>${ans}</b>`:`${t[0]*t[3]} = □ × ${k===1?t[2]:t[1]} → □ = ${t[0]*t[3]} ÷ ${k===1?t[2]:t[1]} = <b>${ans}</b>`]))}},
{id:'q3',title:'비례배분',book:'119단계',key:'전체를 ■ : ●로 나누면 → 전체 × <span class="fr"><span class="nu">■</span><span class="de">■+●</span></span>, 전체 × <span class="fr"><span class="nu">●</span><span class="de">■+●</span></span>',
ex:()=>`<p>전체를 주어진 비로 나누는 것을 <b>비례배분</b>이라고 해요.</p><div class="eg">사탕 20개를 2 : 3으로 나누면<br>형: 20 × ${fr(2,5)} = <b>8개</b>, 동생: 20 × ${fr(3,5)} = <b>12개</b></div><div class="warn">분모는 비의 <b>합</b>(2 + 3 = 5)이에요. 확인: 8 + 12 = 20</div>`,
gen(lv){const parts=lv===3?3:2;let r;do{r=[];for(let i=0;i<parts;i++)r.push(R(1,lv===1?5:9))}while(new Set(r).size<parts||r.reduce(gcd)!==1);const S=r.reduce((a,b)=>a+b,0),T=S*R(2,lv===1?8:15),i=R(0,parts-1);
  const who=parts===2?['형','동생']:['가','나','다'];const v=T*r[i]/S;
  return prob(`구슬 ${T}개를 ${parts===2?'형과 동생이':'가, 나, 다 세 사람이'} <b>${r.join(' : ')}</b>로 나누어 가지려고 해요. <b>${who[i]}</b>의 구슬은 몇 개인가요?`,num(v,'개'),`${who[i]}: ${T} × ${fr(r[i],r.join('+'))} = ${T} × ${fr(r[i],S)} = <b>${v}개</b>`)}},
{id:'q4',title:'비례식 활용',key:'모르는 양을 □로 두고 비례식을 세워요',
ex:()=>`<div class="eg">3분 동안 물이 12 L 나와요. 15분 동안은?<br>3 : 12 = 15 : □ → 3 × □ = 12 × 15 → □ = <b>60 L</b></div><div class="eg"><div class="egt">축척</div>지도에서 1 cm가 실제 5 km → 지도에서 7 cm는 1 : 5 = 7 : □ → <b>35 km</b></div>`,
gen(lv){const t=R(0,2);if(t===0){const a=R(2,6),b=a*R(2,6),k=R(2,lv===1?4:9);const c=a*k;return prob(`수도에서 ${a}분 동안 물이 ${b} L 나와요. 같은 빠르기로 <b>${c}분</b> 동안 나오는 물은 몇 L인가요?`,num(b*k,'L'),ol([`${a} : ${b} = ${c} : □`,`${a} × □ = ${b} × ${c} → □ = ${b*c} ÷ ${a} = <b>${b*k} L</b>`]))}
  if(t===1){let x,y;do{x=R(2,9);y=R(2,9)}while(x===y||gcd(x,y)!==1);const k=R(2,lv===1?5:12);return prob(`가로와 세로의 비가 <b>${x} : ${y}</b>인 직사각형이 있어요. 가로가 ${x*k} cm일 때 <b>세로</b>는 몇 cm인가요?`,num(y*k,'cm'),ol([`${x} : ${y} = ${x*k} : □`,`${x} × □ = ${y} × ${x*k} → □ = <b>${y*k} cm</b>`]))}
  const s=R(2,9),m=R(2,lv===1?9:25);return prob(`지도에서 1 cm는 실제 거리 ${s} km예요. 지도에서 ${m} cm인 두 마을 사이의 실제 거리는 몇 km인가요?`,num(s*m,'km'),`1 : ${s} = ${m} : □ → □ = ${s} × ${m} = <b>${s*m} km</b>`)}}
]);
function c314(x){return Math.round(x*314)/100}
U('s62','5','원의 넓이',[
{id:'r1',title:'원주와 원주율',key:'원주 = 지름 × 원주율(3.14) = 반지름 × 2 × 3.14',
ex:()=>`<div class="fig">${svgCircleFig('basic')}</div><p>원의 둘레를 <b>원주</b>라고 해요. 원의 크기와 상관없이 (원주) ÷ (지름)은 항상 약 3.14로 같아요. 이 값을 <b>원주율</b>이라고 해요.</p>
<div class="eg">지름 10 cm → 원주 10 × 3.14 = <b>31.4 cm</b><br>반지름 4 cm → 원주 4 × 2 × 3.14 = <b>25.12 cm</b></div><div class="warn">반지름이 주어지면 <b>× 2</b>를 먼저 해서 지름을 구해요.</div>`,
gen(lv){if(lv===1||rnd()<.5){const d=R(2,lv===1?20:40);return prob(`지름이 ${d} cm인 원의 <b>원주</b>는 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(d),'cm'),`${d} × 3.14 = <b>${D(c314(d))} cm</b>`)}
  const r=R(2,25);return prob(`반지름이 ${r} cm인 원의 <b>원주</b>는 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(2*r),'cm'),`${r} × 2 × 3.14 = <b>${D(c314(2*r))} cm</b>`)}},
{id:'r2',title:'원주로 지름·반지름 구하기',key:'지름 = 원주 ÷ 3.14',
ex:()=>`<div class="eg">원주 37.68 cm → 지름 = 37.68 ÷ 3.14 = <b>12 cm</b> → 반지름 <b>6 cm</b></div>`,
gen(lv){const d=lv===3?R(2,20)*2:R(2,30);const C=c314(d);if(lv<3)return prob(`원주가 ${D(C)} cm인 원의 <b>지름</b>은 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(d,'cm'),`${D(C)} ÷ 3.14 = <b>${d} cm</b>`);
  return prob(`원주가 ${D(C)} cm인 원의 <b>반지름</b>은 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(d/2,'cm'),ol([`지름 = ${D(C)} ÷ 3.14 = ${d} cm`,`반지름 = ${d} ÷ 2 = <b>${d/2} cm</b>`]))}},
{id:'r3',title:'원의 넓이',key:'원의 넓이 = 반지름 × 반지름 × 3.14',
ex:()=>`<p>원을 잘게 잘라 이어 붙이면 직사각형에 가까워져요. 가로 = 원주의 반(반지름 × 3.14), 세로 = 반지름</p><div class="eg">반지름 5 cm → 5 × 5 × 3.14 = <b>78.5 cm²</b></div><div class="warn">반지름 × 2 × 3.14는 원주예요! 넓이는 반지름을 <b>두 번</b> 곱해요.</div>`,
gen(lv){if(lv===1){const r=R(2,15);return prob(`반지름이 ${r} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`)}
  if(lv===2){const r=R(2,15);return prob(`지름이 ${2*r} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),ol([`반지름 = ${2*r} ÷ 2 = ${r} cm`,`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`]))}
  const r=R(2,12);return prob(`원주가 ${D(c314(2*r))} cm인 원의 <b>넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(r*r),'cm²'),ol([`지름 = ${D(c314(2*r))} ÷ 3.14 = ${2*r} cm → 반지름 ${r} cm`,`${r} × ${r} × 3.14 = <b>${D(c314(r*r))} cm²</b>`]))}},
{id:'r4',title:'여러 가지 모양의 넓이',key:'큰 넓이에서 빼거나, 원의 일부(반, ¼)만 구해요',
ex:()=>`<div class="eg"><div class="egt">반원</div>반지름 4 cm → 4 × 4 × 3.14 ÷ 2 = <b>25.12 cm²</b></div><div class="eg"><div class="egt">고리 모양</div>큰 원 넓이 − 작은 원 넓이</div><div class="eg"><div class="egt">정사각형 안의 원</div>정사각형 넓이 − 원 넓이 (원의 지름 = 정사각형 한 변)</div>`,
gen(lv){if(lv===1){const r=R(2,12);return prob(`반지름이 ${r} cm인 <b>반원</b>의 넓이는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span><div class="fig">${svgCircleFig('half',r+' cm')}</div>`,num(c314(r*r)/2,'cm²'),`${r} × ${r} × 3.14 ÷ 2 = <b>${D(c314(r*r)/2)} cm²</b>`)}
  if(lv===2){const a=R(5,12),b=R(2,a-2);return prob(`색칠한 고리 모양의 넓이는 몇 cm²인가요? (큰 원 반지름 ${a} cm, 작은 원 반지름 ${b} cm) <span class="muted small">(${PI_TXT})</span><div class="fig">${svgCircleFig('ring',[a+' cm',b+' cm'])}</div>`,num(c314(a*a-b*b),'cm²'),ol([`큰 원: ${a} × ${a} × 3.14 = ${D(c314(a*a))}`,`작은 원: ${b} × ${b} × 3.14 = ${D(c314(b*b))}`,`${D(c314(a*a))} − ${D(c314(b*b))} = <b>${D(c314(a*a-b*b))} cm²</b>`]))}
  const s=R(2,10)*2,r=s/2;return prob(`한 변이 ${s} cm인 정사각형 안에 꼭 맞는 원을 그렸어요. 색칠한 부분(정사각형에서 원을 뺀 부분)의 넓이는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span><div class="fig">${svgCircleFig('sq',s+' cm')}</div>`,num(s*s-c314(r*r),'cm²'),ol([`정사각형: ${s} × ${s} = ${s*s}`,`원(반지름 ${r}): ${r} × ${r} × 3.14 = ${D(c314(r*r))}`,`${s*s} − ${D(c314(r*r))} = <b>${D(s*s-c314(r*r))} cm²</b>`]))}}
]);
U('s62','6','원기둥, 원뿔, 구',[
{id:'s1',title:'원기둥과 전개도',key:'원기둥 전개도의 옆면(직사각형): 가로 = 밑면의 원주, 세로 = 높이',
ex:()=>`<div class="fig">${SVG_ROUND}</div><p><b>원기둥</b>: 서로 평행하고 합동인 두 원을 밑면으로 하는 기둥 모양. 옆면은 굽은 면이고, 꼭짓점과 모서리가 없어요.</p>
<div class="eg">밑면 반지름 3 cm, 높이 10 cm인 원기둥의 전개도<br>옆면 가로 = 3 × 2 × 3.14 = <b>18.84 cm</b>, 세로 = <b>10 cm</b></div><div class="warn">옆면의 가로는 반지름이 아니라 <b>원주</b>와 같아요.</div>`,
gen(lv){const r=R(2,10),h=R(3,15);const t=lv===1?R(0,1):lv===2?R(0,2):R(2,3);
  if(t===0)return prob(`밑면의 반지름이 ${r} cm, 높이가 ${h} cm인 원기둥의 전개도에서 <b>옆면의 가로</b>는 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(2*r),'cm'),`옆면 가로 = 밑면의 원주 = ${r} × 2 × 3.14 = <b>${D(c314(2*r))} cm</b>`);
  if(t===1)return prob(`밑면의 지름이 ${2*r} cm, 높이가 ${h} cm인 원기둥의 전개도에서 <b>옆면의 세로</b>는 몇 cm인가요?`,num(h,'cm'),`옆면의 세로는 원기둥의 높이와 같아요 → <b>${h} cm</b>`);
  if(t===2)return prob(`원기둥의 전개도에서 옆면의 가로가 ${D(c314(2*r))} cm예요. <b>밑면의 반지름</b>은 몇 cm인가요? <span class="muted small">(${PI_TXT})</span>`,num(r,'cm'),ol([`옆면 가로 = 원주 → 지름 = ${D(c314(2*r))} ÷ 3.14 = ${2*r} cm`,`반지름 = <b>${r} cm</b>`]));
  return prob(`밑면의 반지름이 ${r} cm, 높이가 ${h} cm인 원기둥의 <b>옆면의 넓이</b>는 몇 cm²인가요? <span class="muted small">(${PI_TXT})</span>`,num(c314(2*r*h),'cm²'),ol([`옆면 가로 = ${r} × 2 × 3.14 = ${D(c314(2*r))}`,`${D(c314(2*r))} × ${h} = <b>${D(c314(2*r*h))} cm²</b>`]))}},
{id:'s2',title:'원뿔과 구',key:'원뿔: 밑면 1개, 꼭짓점 1개 · 구: 어느 방향에서 봐도 원',
ex:()=>`<p><b>원뿔</b>: 밑면이 원이고 옆면이 굽은 뿔 모양. 원뿔의 꼭짓점에서 밑면 둘레의 한 점을 이은 선분을 <b>모선</b>이라고 해요(셀 수 없이 많아요).<br><b>구</b>: 공 모양. 가장 안쪽의 점이 <b>구의 중심</b>, 중심에서 겉면까지가 <b>반지름</b>이에요.</p>
<table class="t"><tr><th>돌리는 평면도형</th><th>만들어지는 입체도형</th></tr><tr><td>직사각형 (한 변 기준)</td><td>원기둥</td></tr><tr><td>직각삼각형 (직각을 낀 변 기준)</td><td>원뿔</td></tr><tr><td>반원 (지름 기준)</td><td>구</td></tr></table>`,
gen(lv){if(lv===1||rnd()<.5){const B=[['직각삼각형을 한 변을 기준으로 한 바퀴 돌리면?','원뿔',['원기둥','구','삼각기둥']],['반원을 지름을 기준으로 한 바퀴 돌리면?','구',['원뿔','원기둥','사각뿔']],['직사각형을 한 변을 기준으로 한 바퀴 돌리면?','원기둥',['원뿔','구','사각기둥']],
    ['원뿔에서 꼭짓점과 밑면 둘레의 한 점을 이은 선분을 무엇이라 하나요?','모선',['높이','반지름','지름']],['원뿔의 모선은 몇 개인가요?','셀 수 없이 많아요',['1개','2개','4개']],['원기둥과 각기둥의 차이로 옳은 것은?','원기둥은 꼭짓점이 없어요',['원기둥은 밑면이 1개예요','각기둥의 밑면은 원이에요','원기둥의 옆면은 직사각형이에요']],
    ['어느 방향에서 보아도 모양이 원인 입체도형은?','구',['원기둥','원뿔','정육면체']],['원뿔의 밑면은 몇 개인가요?','1개',['2개','0개','3개']]];const [q,a,w]=pick(B);return prob(q,mc(a,w),`정답: <b>${a}</b>`)}
  const a=R(2,12),b=R(3,15);if(rnd()<.5)return prob(`밑변 ${a} cm, 높이 ${b} cm인 직각삼각형을 <b>높이를 기준으로</b> 한 바퀴 돌려 원뿔을 만들었어요. 원뿔 <b>밑면의 지름</b>은 몇 cm인가요?`,num(2*a,'cm'),`밑변이 밑면의 반지름이 돼요 → 지름 = ${a} × 2 = <b>${2*a} cm</b>`);
  const d=R(2,15)*2;return prob(`지름이 ${d} cm인 반원을 지름을 기준으로 한 바퀴 돌려 구를 만들었어요. <b>구의 반지름</b>은 몇 cm인가요?`,num(d/2,'cm'),`반원의 반지름이 구의 반지름 → ${d} ÷ 2 = <b>${d/2} cm</b>`)}}
]);

const LESSONS={};UNITS.forEach(u=>u.lessons.forEach((l,i)=>{l.unit=u;l.idx=i;LESSONS[l.id]=l}));

/* ===================== 채점 ===================== */
function parseNum(s){s=String(s||'').replace(/[,\s]/g,'').replace(/[^\d.\-]/g,'');if(s===''||s==='.'||s==='-')return NaN;return Number(s)}
function ansHTML(a){if(a.t==='num')return N(a.v)+(a.unit?' '+a.unit:'');if(a.t==='frac')return mix(a.n,a.d);if(a.t==='ratio')return `${a.a} : ${a.b}`;return a.opts[a.a]}
function check(a,inp){
  if(a.t==='num'){const x=parseNum(inp);if(isNaN(x))return {empty:true};return {ok:Math.abs(x-a.v)<1e-6}}
  if(a.t==='mc'){if(inp==null)return {empty:true};return {ok:inp===a.a}}
  if(a.t==='ratio'){const x=parseNum(inp[0]),y=parseNum(inp[1]);if(isNaN(x)||isNaN(y))return {empty:true};if(a.any)return {ok:x*a.b===y*a.a&&x>0};if(x===a.a&&y===a.b)return {ok:true};if(x*a.b===y*a.a)return {retry:'비율은 맞아요! 더 간단한 자연수의 비로 나타내 보세요.'};return {ok:false}}
  // frac
  const w=inp[0].trim()===''?0:parseNum(inp[0]),n=inp[1].trim()===''?null:parseNum(inp[1]),d=inp[2].trim()===''?null:parseNum(inp[2]);
  if(isNaN(w))return {empty:true};if(n===null&&d===null){if(inp[0].trim()==='')return {empty:true};return {ok:a.d===1&&w===a.n}}
  if(n===null||d===null||isNaN(n)||isNaN(d)||d===0)return {empty:true,msg:'분자와 분모를 모두 써 주세요.'};
  const tn=w*d+n;if(tn*a.d!==a.n*d)return {ok:false};
  if(gcd(n,d)!==1||a.d===1)return {retry:'값은 맞아요! 약분해서 기약분수(가장 간단한 분수)로 써 보세요.'};
  if(w>0&&n>=d)return {retry:'값은 맞아요! 분수 부분이 1보다 작게 대분수로 고쳐 써 보세요.'};return {ok:true}}

/* ===================== 저장 ===================== */
const KEY='mathgil_v1';
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.learners))return s}catch(e){}return {learners:[],cur:null,data:{},updatedAt:0}}
let S=load();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let pushHook=null;
function save(){S.updatedAt=Date.now();saveLocal();if(pushHook)pushHook()}
function me(){if(!S.cur)return null;return S.data[S.cur]||(S.data[S.cur]={ls:{},wrong:[],sem:'s52'})}
function lst(id){const d=me();if(!d)return {t:0,c:0,lv:1,s:0,w:0};return d.ls[id]||(d.ls[id]={t:0,c:0,lv:1,s:0,w:0})}
function curName(){const l=S.learners.find(x=>x.id===S.cur);return l?l.name:null}

if(typeof document!=='undefined'){
/* ===================== 화면 ===================== */
const app=document.getElementById('app');let V={view:'home'};let P=null;
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function setAcc(sem){const c=sem==='pre'?['--pre','--prel']:sem==='s52'?['--g5','--g5l']:['--g6','--g6l'];document.documentElement.style.setProperty('--acc',`var(${c[0]})`);document.documentElement.style.setProperty('--accl',`var(${c[1]})`)}
function stars(st){if(!st.t)return '<span class="muted small">아직 안 풀었어요</span>';const acc=st.c/st.t;const n=st.lv>=3&&acc>=.8?3:st.lv>=2&&acc>=.6?2:acc>=.5?1:0;return `<span class="stars">${'★'.repeat(n)}${'☆'.repeat(3-n)}</span>`}
function unitProg(u){const done=u.lessons.filter(l=>{const s=lst(l.id);return s.t>=5&&s.c/s.t>=.7}).length;return done/u.lessons.length}
function go(v){V=v;window.scrollTo(0,0);render()}
function render(){document.getElementById('who').textContent=curName()?'👤 '+curName():'학생 선택';
  if(!S.cur&&V.view!=='learners'){return renderLearners(true)}
  ({home:renderHome,unit:renderUnit,lesson:renderLesson,practice:renderPractice,wrong:renderWrong,stats:renderStats,learners:()=>renderLearners(false)})[V.view]()}

function recommend(){const d=me();const arr=[];Object.entries(d.ls).forEach(([id,s])=>{if(LESSONS[id]&&s.t>=5&&s.c/s.t<.7)arr.push({l:LESSONS[id],why:`정답률 ${Math.round(s.c/s.t*100)}% — 한 번 더 연습해요`,acc:s.c/s.t})});arr.sort((a,b)=>a.acc-b.acc);
  if(arr.length)return arr[0];for(const u of UNITS.filter(u=>u.sem===d.sem))for(const l of u.lessons){const s=lst(l.id);if(s.t<5)return {l,why:s.t?'이어서 풀어요':'다음 진도예요'}}return null}
function renderHome(){const d=me();setAcc(d.sem);const rc=recommend();
  app.innerHTML=`<div class="tabs">${SEMS.map(s=>`<button class="tab ${s.cls} ${d.sem===s.id?'on':''}" data-act="sem" data-id="${s.id}">${s.name}</button>`).join('')}</div>
  <div class="syncline" id="syncline">${syncText()}</div>
  ${rc?`<div class="card rec unit" data-act="lesson" data-id="${rc.l.id}"><div class="unum">✦</div><div style="flex:1"><div class="small muted">오늘의 추천 · ${rc.l.unit.title}</div><div class="t">${rc.l.title}</div><div class="small">${rc.why}</div></div></div>`:''}
  ${d.wrong.length?`<div class="card unit" data-act="wrongnote"><div class="unum" style="background:var(--no)">${d.wrong.length}</div><div style="flex:1"><div class="t">오답노트 다시 풀기</div><div class="small muted">틀린 문제를 다시 맞히면 목록에서 빠져요</div></div></div>`:''}
  ${UNITS.filter(u=>u.sem===d.sem).map(u=>`<div class="card unit" data-act="unit" data-id="${u.id}"><div class="unum">${u.sem==='pre'?'★':u.no}</div><div style="flex:1"><div class="t">${u.title}</div><div class="small muted">${u.lessons.map(l=>l.title).join(' · ')}</div><div class="bar"><i style="width:${Math.round(unitProg(u)*100)}%"></i></div></div></div>`).join('')}
  <p class="mini-note">문제는 풀 때마다 숫자가 새로 만들어져요. 연속으로 맞히면 레벨이 올라가고, 연속으로 틀리면 쉬운 문제로 돌아가요. 단원 순서는 출판사 교과서마다 조금 다를 수 있어요.</p>`}
function renderUnit(){const u=UNITS.find(x=>x.id===V.id);setAcc(u.sem);
  app.innerHTML=`<button class="back" data-act="home">← 단원 목록</button><h2 style="margin-top:6px">${u.sem==='pre'?'':u.no+'. '}${u.title}</h2><div class="small muted">${SEMS.find(s=>s.id===u.sem).name}</div>
  <div class="card">${u.lessons.map((l,i)=>{const s=lst(l.id);return `<div class="lesson" data-act="lesson" data-id="${l.id}"><div class="n">${i+1}</div><div class="t">${l.title}<div>${l.book?`<span class="badge acc">계산 교재 ${l.book}</span> `:''}${s.t?`<span class="badge">${s.c}/${s.t} · 레벨 ${s.lv}</span>`:''}</div></div>${stars(s)}</div>`}).join('')}</div>
  <button class="btn block" data-act="test" data-id="${u.id}">단원평가 10문제 풀기</button>`}
function renderLesson(){const l=LESSONS[V.id];setAcc(l.unit.sem);const tab=V.tab||'ex';
  let body='';if(tab==='ex'){body=`<div class="card ex">${typeof l.ex==='function'?l.ex():l.ex}<div class="key">핵심: ${l.key}</div></div><button class="btn block" data-act="practice" data-id="${l.id}">문제 풀러 가기 →</button>`}
  else{const p=V.sample||(V.sample=l.gen(1));body=`<div class="card"><div class="pq">${p.q}</div><div class="sol"><div class="h">정답: ${ansHTML(p.ans)}</div>${p.sol}</div></div><div class="row"><button class="btn ghost" data-act="sample">다른 예제</button><button class="btn" data-act="practice" data-id="${l.id}">직접 풀기 →</button></div>`}
  app.innerHTML=`<button class="back" data-act="unit" data-id="${l.unit.id}">← ${l.unit.title}</button><h2 style="margin-top:6px">${l.title}</h2>${l.book?`<span class="badge acc">계산 교재 ${l.book}</span>`:''}
  <div class="seg"><button class="${tab==='ex'?'on':''}" data-act="ltab" data-id="ex">개념 설명</button><button class="${tab==='sample'?'on':''}" data-act="ltab" data-id="sample">예제와 풀이</button></div>${body}`}

/* ----- 문제 풀이 ----- */
function startPractice(id){const s=lst(id);P={mode:'practice',lid:id,lv:s.lv,c:0,t:0};nextProblem();go({view:'practice'})}
function startTest(uid){const u=UNITS.find(x=>x.id===uid);const list=[];for(let i=0;i<10;i++){const l=u.lessons[i%u.lessons.length],lv=i<4?1:i<8?2:3,seed=newSeed();list.push({lid:l.id,lv,seed,p:genS(l.id,lv,seed)})}P={mode:'test',uid,list:shuffle(list),idx:0,c:0,t:0,res:[]};loadTest();go({view:'practice'})}
function loadTest(){const it=P.list[P.idx];P.lid=it.lid;P.prob=it.p;P.plv=it.lv;P.seed=it.seed;P.lv=null;P.done=false;P.sel=null;P.tries=0}
function nextProblem(){P.seed=newSeed();P.plv=P.lv;P.prob=genS(P.lid,P.lv,P.seed);P.done=false;P.sel=null;P.tries=0}
function inputHTML(a){if(a.t==='mc')return `<div class="mc ${a.one||a.opts.some(o=>String(o).length>14)?'one':''}">${a.opts.map((o,i)=>`<button data-act="pick" data-i="${i}" class="${P.sel===i?'sel':''}">${o}</button>`).join('')}</div>`;
  if(a.t==='frac')return `<div class="ansrow"><div class="fin"><input class="w" id="i0" inputmode="numeric" autocomplete="off" aria-label="자연수"><div class="fst"><input id="i1" inputmode="numeric" autocomplete="off" aria-label="분자"><hr><input id="i2" inputmode="numeric" autocomplete="off" aria-label="분모"></div></div></div><div class="hintbox">대분수는 왼쪽 칸에 자연수를, 자연수 답은 왼쪽 칸에만 써요</div>`;
  if(a.t==='ratio')return `<div class="ansrow rat"><input id="i0" inputmode="numeric" autocomplete="off"> <b>:</b> <input id="i1" inputmode="numeric" autocomplete="off"></div>`;
  return `<div class="ansrow"><input id="i0" inputmode="decimal" autocomplete="off" aria-label="답">${a.unit?`<span>${a.unit}</span>`:''}</div>`}
function getInput(a){if(a.t==='mc')return P.sel;const v=i=>{const e=document.getElementById('i'+i);return e?e.value:''};if(a.t==='frac')return [v(0),v(1),v(2)];if(a.t==='ratio')return [v(0),v(1)];return v(0)}
function renderPractice(){const l=LESSONS[P.lid];setAcc(l.unit.sem);const p=P.prob;const isTest=P.mode==='test',isWrong=P.mode==='wrong';
  const head=isTest?`<button class="back" data-act="unit" data-id="${P.uid}">← 그만하기</button><div class="lv" style="justify-content:space-between"><span><b>${l.unit.title}</b> 단원평가</span><span>${P.idx+1} / ${P.list.length}</span></div>`
   :isWrong?`<button class="back" data-act="wrongnote">← 오답노트</button><div class="lv"><b>${l.title}</b></div>`
   :`<button class="back" data-act="lesson" data-id="${l.id}">← 개념 다시 보기</button><div class="lv" style="justify-content:space-between"><b>${l.title}</b><span class="dots">${[1,2,3].map(i=>`<i class="${i<=P.lv?'on':''}"></i>`).join('')} 레벨 ${P.lv}</span></div>`;
  app.innerHTML=`${head}<div class="card"><div class="pq">${p.q}</div>${inputHTML(p.ans)}<div id="fb"></div>
   <div class="row" id="btns" style="margin-top:12px"><button class="btn ghost" data-act="hint">힌트</button><button class="btn" data-act="submit">확인</button></div></div>
   ${P.mode==='practice'?`<div class="score" id="score"><div>푼 문제<b>${P.t}</b></div><div>맞힌 문제<b>${P.c}</b></div><div>연속 정답<b>${lst(P.lid).s}</b></div></div>`:''}`;
  const f=document.getElementById('i0');if(f&&!('ontouchstart' in window))f.focus();
  app.querySelectorAll('.ansrow input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();P.done?advance():submit()}}))}
function submit(){if(P.done)return;const a=P.prob.ans,inp=getInput(a);const r=check(a,inp);const fb=document.getElementById('fb');
  if(r.empty){fb.innerHTML=`<div class="fb mid">${r.msg||'답을 입력해 주세요.'}</div>`;return}
  if(r.retry&&P.tries<1){P.tries++;fb.innerHTML=`<div class="fb mid">${r.retry}</div>`;return}
  const ok=!!r.ok;P.done=true;P.t++;if(ok)P.c++;const s=lst(P.lid);s.t++;s.at=Date.now();if(ok)s.c++;let msg='';
  if(P.mode==='practice'){if(ok){s.s++;s.w=0;if(s.s>=3&&s.lv<3){s.lv++;s.s=0;P.lv=s.lv;msg=' 🎉 레벨 업!'}}else{s.s=0;s.w++;if(s.w>=2&&s.lv>1){s.lv--;s.w=0;P.lv=s.lv;msg=' 쉬운 문제로 다시 연습해요.'}}}
  const d=me();if(!ok&&P.mode!=='wrong'){d.wrong.unshift({lid:P.lid,lv:P.plv,seed:P.seed,at:Date.now()});d.wrong=d.wrong.slice(0,80)}
  if(ok&&P.mode==='wrong'){const k=d.wrong.findIndex(w=>w.seed===P.seed&&w.lid===P.lid);if(k>=0)d.wrong.splice(k,1)}
  if(P.mode==='test')P.res.push({lid:P.lid,ok,p:P.prob});save();
  if(a.t==='mc')app.querySelectorAll('.mc button').forEach((b,i)=>{b.disabled=true;if(i===a.a)b.classList.add('right');else if(i===P.sel)b.classList.add('wrong')});
  app.querySelectorAll('.ansrow input').forEach(i=>i.readOnly=true);
  fb.innerHTML=`<div class="fb ${ok?'ok':'no'}">${ok?'정답이에요!':'아쉬워요. 정답은 '+ansHTML(a)+'예요.'}${msg}</div><div class="sol"><div class="h">풀이</div>${P.prob.sol}</div>`;
  const last=P.mode==='test'&&P.idx===P.list.length-1;document.getElementById('btns').innerHTML=`<button class="btn block" data-act="next">${P.mode==='wrong'?'오답노트로':last?'결과 보기':'다음 문제 →'}</button>`;
  const sc=document.getElementById('score');if(sc)sc.innerHTML=`<div>푼 문제<b>${P.t}</b></div><div>맞힌 문제<b>${P.c}</b></div><div>연속 정답<b>${s.s}</b></div>`;
  if(msg.includes('레벨 업'))toast('레벨 업! 이제 레벨 '+P.lv)}
function advance(){if(P.mode==='wrong')return go({view:'wrong'});if(P.mode==='test'){if(P.idx<P.list.length-1){P.idx++;loadTest();return go({view:'practice'})}return showResult()}nextProblem();go({view:'practice'})}
function showResult(){const u=UNITS.find(x=>x.id===P.uid);const sc=P.res.filter(r=>r.ok).length;
  app.innerHTML=`<button class="back" data-act="unit" data-id="${u.id}">← ${u.title}</button><div class="card" style="text-align:center"><h2>단원평가 결과</h2><div style="font-family:Jua;font-size:54px;color:var(--acc)">${sc*10}점</div><div class="muted">${P.res.length}문제 중 ${sc}문제 정답</div></div>
  ${P.res.filter(r=>!r.ok).length?`<h3>틀린 문제 다시 보기</h3>${P.res.filter(r=>!r.ok).map(r=>`<div class="card"><div class="small muted">${LESSONS[r.lid].title}</div><div class="pq">${r.p.q}</div><div class="sol"><div class="h">정답: ${ansHTML(r.p.ans)}</div>${r.p.sol}</div></div>`).join('')}`:'<div class="card empty">모두 맞혔어요! 다음 단원으로 가 볼까요?</div>'}
  <div class="row"><button class="btn ghost" data-act="test" data-id="${u.id}">다시 풀기</button><button class="btn" data-act="home">단원 목록</button></div>`;window.scrollTo(0,0)}

/* ----- 오답노트 / 기록 / 학생 ----- */
function wprob(w){if(w.p)return w.p;if(!w._p)Object.defineProperty(w,'_p',{value:genS(w.lid,w.lv,w.seed),enumerable:false});return w._p}
function renderWrong(){const d=me();d.wrong=d.wrong.filter(w=>LESSONS[w.lid]);setAcc(d.sem);app.innerHTML=`<button class="back" data-act="home">← 처음으로</button><h2 style="margin-top:6px">오답노트</h2><p class="small muted">틀린 문제가 모여 있어요. 다시 풀어서 맞히면 목록에서 지워져요.</p>
  ${d.wrong.length?d.wrong.map((w,i)=>`<div class="card"><div class="small muted">${LESSONS[w.lid]?LESSONS[w.lid].unit.title+' · '+LESSONS[w.lid].title:''}</div><div class="pq">${wprob(w).q}</div><div class="row" style="margin-top:8px"><button class="btn ghost" data-act="wdel" data-i="${i}">지우기</button><button class="btn" data-act="wretry" data-i="${i}">다시 풀기</button></div></div>`).join(''):'<div class="card empty">오답노트가 비어 있어요 👏</div>'}`}
function renderStats(){const d=me();setAcc(d.sem);let tt=0,cc=0;Object.values(d.ls).forEach(s=>{tt+=s.t;cc+=s.c});
  app.innerHTML=`<button class="back" data-act="home">← 처음으로</button><h2 style="margin-top:6px">${curName()}의 학습 기록</h2>
  <div class="score"><div>푼 문제<b>${tt}</b></div><div>정답률<b>${tt?Math.round(cc/tt*100):0}%</b></div><div>오답노트<b>${d.wrong.length}</b></div></div>
  <div class="card"><h3>기록 백업</h3><p class="small muted">모든 학생의 기록·오답노트를 파일 하나로 저장하고, 다른 기기나 브라우저에서 불러올 수 있어요. 불러오면 지금 기록과 합쳐져요.</p>
  <div class="row"><button class="btn" data-act="backup">백업 파일 저장</button><button class="btn ghost" data-act="restore">백업 불러오기</button></div><input type="file" id="restoreFile" accept=".json,application/json" style="display:none"></div>
  ${SEMS.map(sm=>{const us=UNITS.filter(u=>u.sem===sm.id);return `<div class="card"><h3>${sm.name}</h3>${us.map(u=>u.lessons.map(l=>{const s=lst(l.id);const p=s.t?Math.round(s.c/s.t*100):0;return `<div class="statrow" data-act="lesson" data-id="${l.id}" style="cursor:pointer"><span class="nm">${u.sem==='pre'?'':u.no+'-'}${l.idx+1} ${l.title}</span><span class="small muted">${s.t?s.c+'/'+s.t:'-'}</span><div class="bar"><i style="width:${p}%;background:${!s.t?'#ddd':p>=80?'var(--ok)':p>=60?'#e3a521':'var(--no)'}"></i></div><span class="pct">${s.t?p+'%':''}</span></div>`}).join('')).join('')}</div>`}).join('')}
  <button class="btn ghost block" data-act="reset">이 학생의 기록 모두 지우기</button><p class="mini-note" id="syncline2">${syncText()}</p>`}
function renderLearners(first){app.innerHTML=`<div class="card" style="margin-top:20px"><h2>${first?'누가 공부하나요?':'학생 관리'}</h2><p class="small muted">학생마다 기록·레벨·오답노트가 따로 저장돼요.</p>
  ${S.learners.map(l=>`<div class="lrn"><span class="nm">${l.name}</span><button class="btn ${l.id===S.cur?'':'ghost'}" style="padding:8px 14px" data-act="sel" data-id="${l.id}">${l.id===S.cur?'공부 중':'선택'}</button><button class="iconbtn" data-act="delL" data-id="${l.id}">삭제</button></div>`).join('')}
  <input class="namein" id="newname" placeholder="이름 입력 (예: 조카 이름)" maxlength="12"><button class="btn block" data-act="addL">학생 추가하기</button></div>${S.cur?'<button class="back" data-act="home">← 돌아가기</button>':''}`}

function modalConfirm(msg,onOk){const m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="card"><p>${msg}</p><div class="row"><button class="btn ghost" id="mNo">취소</button><button class="btn" id="mOk" style="background:var(--no)">확인</button></div></div></div>`;
  document.getElementById('mNo').onclick=()=>m.innerHTML='';document.getElementById('mOk').onclick=()=>{m.innerHTML='';onOk()}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;
  if(act!=='learners'&&act!=='addL'&&act!=='sel'&&act!=='delL'&&!S.cur)return render();
  switch(act){
    case 'home':return go({view:'home'});
    case 'sem':me().sem=id;save();return render();
    case 'unit':return go({view:'unit',id});
    case 'lesson':return go({view:'lesson',id,tab:'ex'});
    case 'ltab':V.tab=id;V.sample=null;return render();
    case 'sample':V.sample=null;return render();
    case 'practice':return startPractice(id);
    case 'test':return startTest(id);
    case 'pick':if(P.done)return;P.sel=+b.dataset.i;app.querySelectorAll('.mc button').forEach((x,i)=>x.classList.toggle('sel',i===P.sel));return;
    case 'submit':return submit();
    case 'next':return advance();
    case 'hint':{const l=LESSONS[P.lid];document.getElementById('fb').innerHTML=`<div class="key">힌트: ${l.key}</div>`;return}
    case 'wrongnote':return go({view:'wrong'});
    case 'wretry':{const i=+b.dataset.i,w=me().wrong[i];P={mode:'wrong',lid:w.lid,prob:wprob(w),seed:w.seed,plv:w.lv,c:0,t:0,done:false,sel:null,tries:0};return go({view:'practice'})}
    case 'wdel':me().wrong.splice(+b.dataset.i,1);save();return render();
    case 'stats':return go({view:'stats'});
    case 'learners':return go({view:'learners'});
    case 'addL':{const nm=document.getElementById('newname').value.trim();if(!nm)return toast('이름을 입력해 주세요');const nid='L'+Date.now();S.learners.push({id:nid,name:nm});S.cur=nid;me();save();return go({view:'home'})}
    case 'sel':S.cur=id;save();return go({view:'home'});
    case 'delL':{const l=S.learners.find(x=>x.id===id);return modalConfirm(`${l.name} 학생과 모든 기록을 지울까요?`,()=>{S.learners=S.learners.filter(x=>x.id!==id);delete S.data[id];if(S.cur===id)S.cur=S.learners[0]?S.learners[0].id:null;save();go({view:'learners'})})}
    case 'backup':{const blob=new Blob([JSON.stringify({app:'mathgil',v:1,savedAt:new Date().toISOString(),learners:S.learners,data:S.data})],{type:'application/json'});const d=new Date(),nm=`mathgil-backup-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
      try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);toast('백업 파일을 저장했어요')}catch(e){toast('이 화면에서는 파일을 저장할 수 없어요')}return}
    case 'restore':{const f=document.getElementById('restoreFile');f.value='';f.onchange=()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const r=JSON.parse(rd.result);if(r.app!=='mathgil'||!Array.isArray(r.learners))throw 0;
      S.synced=false;mergeInto(r);S.synced=true;if(!S.cur&&S.learners[0])S.cur=S.learners[0].id;save();toast('백업을 불러왔어요');go({view:'stats'})}catch(e){toast('수학 길잡이 백업 파일이 아니에요')}};rd.readAsText(file)};f.click();return}
    case 'reset':return modalConfirm('이 학생의 학습 기록과 오답노트를 모두 지울까요?',()=>{const s=me().sem;S.data[S.cur]={ls:{},wrong:[],sem:s};save();go({view:'stats'})});
  }});
/* ----- 클라우드 동기화 ----- */
const SY={ref:null,st:'wait',writing:false,pending:false,timer:null};
function syncText(){return SY.st==='ok'?'☁ 기록이 Claude 계정에 저장돼요. 같은 계정으로 로그인하면 어느 브라우저·기기에서든 이어서 할 수 있어요.':SY.st==='wait'?'☁ 저장소에 연결하는 중…':SY.st==='err'?'⚠ 지금은 서버에 저장하지 못했어요. 이 브라우저에 임시로 저장하고, 연결되면 다시 올려요.':'💾 기록은 이 기기에 저장돼요. 혹시 모를 상황에 대비해 가끔 \'기록\' 화면에서 백업 파일을 저장해 두세요.'}
function setSync(st){SY.st=st;['syncline','syncline2'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=syncText()})}
function payload(){return {v:1,updatedAt:S.updatedAt||Date.now(),learners:S.learners,data:S.data}}
pushHook=()=>schedulePush();
function schedulePush(){if(!SY.ref)return;clearTimeout(SY.timer);SY.timer=setTimeout(pushNow,700)}
async function pushNow(){if(!SY.ref)return;if(SY.writing){SY.pending=true;return}SY.writing=true;
  try{await SY.ref.set(JSON.parse(JSON.stringify(payload())));S.synced=true;saveLocal();setSync('ok')}catch(e){setSync('err');if(e&&e.code==='unavailable'){setTimeout(schedulePush,3000+Math.random()*2000)}}
  SY.writing=false;if(SY.pending){SY.pending=false;pushNow()}}
function mergeInto(r){ // 처음 동기화하는 브라우저: 양쪽 기록을 합쳐요
  const ids=new Set(S.learners.map(l=>l.id));(r.learners||[]).forEach(l=>{if(!ids.has(l.id))S.learners.push(l)});
  Object.entries(r.data||{}).forEach(([id,rd])=>{const ld=S.data[id];if(!ld){S.data[id]=rd;return}
    Object.entries(rd.ls||{}).forEach(([k,v])=>{if(!ld.ls[k]||(v.t||0)>(ld.ls[k].t||0))ld.ls[k]=v});
    const seen=new Set((ld.wrong||[]).map(w=>w.lid+':'+(w.seed||w.at)));(rd.wrong||[]).forEach(w=>{if(!seen.has(w.lid+':'+(w.seed||w.at)))ld.wrong.push(w)});ld.wrong.sort((a,b)=>(b.at||0)-(a.at||0));ld.wrong=ld.wrong.slice(0,80)})}
function adopt(r){const cur=S.cur;S.learners=r.learners||[];S.data=r.data||{};S.updatedAt=r.updatedAt||0;S.cur=S.learners.some(l=>l.id===cur)?cur:(S.learners[0]?S.learners[0].id:null);S.synced=true;saveLocal()}
function softRender(){if(V.view==='practice')return;render()}
async function initSync(){try{if(!window.claude||!window.claude.use)return setSync('local');
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return setSync('local');
  const uid=await user.id();if(!uid)return setSync('local');SY.ref=db.doc('data/users/'+uid+'/state');
  let snap;try{snap=await SY.ref.get()}catch(e){await new Promise(r=>setTimeout(r,1500));snap=await SY.ref.get()}
  const r=snap.exists?snap.data():null;
  if(r&&r.v===1){if(!S.synced){mergeInto(r);if(!S.cur&&S.learners[0])S.cur=S.learners[0].id;S.updatedAt=Date.now();saveLocal();await pushNow()}
    else if((r.updatedAt||0)>(S.updatedAt||0))adopt(r);else if((S.updatedAt||0)>(r.updatedAt||0))await pushNow()}
  else if(S.learners.length)await pushNow();
  if(SY.st!=='err')setSync('ok');softRender();
  SY.ref.onSnapshot(sn=>{if(!sn.exists||sn.metadata.hasPendingWrites)return;const d=sn.data();if(d&&d.v===1&&(d.updatedAt||0)>(S.updatedAt||0)){adopt(d);softRender()}},()=>{});
 }catch(e){setSync(SY.ref?'err':'local')}}
render();initSync();
}
</script>
